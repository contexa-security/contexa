dependencies {
    api project(':contexa-autoconfigure')
    api project(':contexa-core')
    api project(':contexa-common')
    api project(':contexa-identity')
    api project(':contexa-iam')
    api 'org.springframework:spring-jcl:6.1.12'

    // BOMs (transitive to consumer projects for version management)
    // the version the core modules are built and tested against (root build.gradle); a consumer of the starter gets the same one (BR-S3)
    api platform("org.springframework.ai:spring-ai-bom:1.1.8")
    api platform("org.springframework.statemachine:spring-statemachine-bom:4.0.0")

    // Spring Boot secures an application when Spring Security's configuration support is on its class path, so that stays
    // out: adding this starter changes nothing in an application, and the application declares
    // spring-boot-starter-security when it decides to apply security with @EnableAISecurity.
    compileOnly 'org.springframework.boot:spring-boot-starter-security'
    api('org.springframework.boot:spring-boot-starter-oauth2-resource-server') {
        exclude group: 'org.springframework.security', module: 'spring-security-config'
    }
    api('org.springframework.boot:spring-boot-starter-oauth2-client') {
        exclude group: 'org.springframework.security', module: 'spring-security-config'
    }
    api('org.springframework.security:spring-security-oauth2-authorization-server:1.5.1') {
        exclude group: 'org.springframework.security', module: 'spring-security-config'
    }
    api 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    // Spring AI provider starters are application-level choices and are not forced by the library starter

    // PgVector implementation only. Do not expose Spring AI's PgVector starter because
    // its auto-configuration starts in dependency-only customer applications.
    implementation 'org.springframework.ai:spring-ai-pgvector-store'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'

    testImplementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.awaitility:awaitility:4.2.0'
    // the clients of the distributed mode, for the test that reads the threads Contexa starts in it
    testImplementation 'org.redisson:redisson:3.48.0'
    testImplementation 'org.springframework.statemachine:spring-statemachine-data-redis:4.0.0'
    testImplementation 'org.springframework.kafka:spring-kafka'
}

// The boot jar is the standalone Contexa platform image (PostgreSQL + Ollama, see the repository Dockerfile).
// Dependencies declared in 'standaloneImage' are bundled into the boot jar only. Library consumers resolve the
// published api/implementation dependencies and keep choosing their own Spring AI provider.
configurations {
    standaloneImage {
        canBeConsumed = false
        canBeResolved = false
    }
    standaloneImageRuntimeClasspath {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom configurations.implementation, configurations.runtimeOnly, configurations.standaloneImage
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
            attribute(TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
                    objects.named(TargetJvmEnvironment, TargetJvmEnvironment.STANDARD_JVM))
        }
    }
}

dependencies {
    standaloneImage 'org.springframework.boot:spring-boot-starter-security'
    standaloneImage 'org.springframework.ai:spring-ai-starter-model-ollama'
    standaloneImage 'io.opentelemetry:opentelemetry-api:1.32.0'
    standaloneImage 'io.opentelemetry:opentelemetry-sdk:1.32.0'
    standaloneImage 'io.opentelemetry:opentelemetry-exporter-otlp:1.32.0'
    standaloneImage 'io.opentelemetry.instrumentation:opentelemetry-reactor-3.1:1.32.0-alpha'
    standaloneImage 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
}

bootJar.enabled = true
jar.enabled = true

springBoot {
    mainClass = 'io.contexa.springbootstartercontexa.SpringBootStarterContexaApplication'
}

tasks.named('resolveMainClassName') {
    enabled = false
}

tasks.named('bootRun') {
    mainClass = 'io.contexa.springbootstartercontexa.SpringBootStarterContexaApplication'
}

tasks.named('bootJar') {
    mainClass = 'io.contexa.springbootstartercontexa.SpringBootStarterContexaApplication'
    classpath = files(sourceSets.main.output, configurations.standaloneImageRuntimeClasspath)
}

tasks.named('test') {
    useJUnitPlatform()
    def benchmarkSamples = System.getProperty('sandbox.prompt.benchmark.samples') ?: System.getenv('SANDBOX_PROMPT_BENCHMARK_SAMPLES')
    if (benchmarkSamples) {
        systemProperty 'sandbox.prompt.benchmark.samples', benchmarkSamples
    }
    def benchmarkRounds = System.getProperty('sandbox.prompt.benchmark.rounds') ?: System.getenv('SANDBOX_PROMPT_BENCHMARK_ROUNDS')
    if (benchmarkRounds) {
        systemProperty 'sandbox.prompt.benchmark.rounds', benchmarkRounds
    }
    def benchmarkScenarios = System.getProperty('sandbox.prompt.benchmark.scenarios') ?: System.getenv('SANDBOX_PROMPT_BENCHMARK_SCENARIOS')
    if (benchmarkScenarios) {
        systemProperty 'sandbox.prompt.benchmark.scenarios', benchmarkScenarios
    }
    def decisionRealLlm = System.getProperty('sandbox.decision.real-llm') ?: System.getenv('SANDBOX_DECISION_REAL_LLM')
    if (decisionRealLlm) {
        systemProperty 'sandbox.decision.real-llm', decisionRealLlm
    }
    def decisionModelId = System.getProperty('sandbox.decision.model-id') ?: System.getenv('SANDBOX_DECISION_MODEL_ID')
    if (decisionModelId) {
        systemProperty 'sandbox.decision.model-id', decisionModelId
    }
    def decisionSamples = System.getProperty('sandbox.decision.samples') ?: System.getenv('SANDBOX_DECISION_SAMPLES')
    if (decisionSamples) {
        systemProperty 'sandbox.decision.samples', decisionSamples
    }
    def decisionRounds = System.getProperty('sandbox.decision.rounds') ?: System.getenv('SANDBOX_DECISION_ROUNDS')
    if (decisionRounds) {
        systemProperty 'sandbox.decision.rounds', decisionRounds
    }
    def decisionScenarios = System.getProperty('sandbox.decision.scenarios') ?: System.getenv('SANDBOX_DECISION_SCENARIOS')
    if (decisionScenarios) {
        systemProperty 'sandbox.decision.scenarios', decisionScenarios
    }
    def decisionTemperature = System.getProperty('sandbox.decision.temperature') ?: System.getenv('SANDBOX_DECISION_TEMPERATURE')
    if (decisionTemperature) {
        systemProperty 'sandbox.decision.temperature', decisionTemperature
    }
    def decisionSingleMetric = System.getProperty('sandbox.decision.single-metric') ?: System.getenv('SANDBOX_DECISION_SINGLE_METRIC')
    if (decisionSingleMetric) {
        systemProperty 'sandbox.decision.single-metric', decisionSingleMetric
    }
    def officialSubmissionRefresh = System.getProperty('sandbox.official.submission.refresh') ?: System.getenv('SANDBOX_OFFICIAL_SUBMISSION_REFRESH')
    if (officialSubmissionRefresh) {
        systemProperty 'sandbox.official.submission.refresh', officialSubmissionRefresh
    }
}

tasks.named('processResources') {
    exclude 'templates/test/token-test.html'
    exclude 'static/js/token-test.js'
    exclude 'static/css/token-test.css'
}

// Spring Boot secures an application when this is on its class path: adding the starter alone must change nothing.
tasks.register('verifyStarterLeavesSecurityToTheApplication') {
    group = 'verification'
    description = 'Fails when the starter brings what makes Spring Boot secure an application.'
    doLast {
        def forbidden = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll { artifact ->
            def id = artifact.moduleVersion.id
            (id.group == 'org.springframework.security' && id.name == 'spring-security-config')
                    || (id.group == 'org.springframework.boot' && id.name == 'spring-boot-starter-security')
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("The starter brings Spring Security to the application: ${forbidden*.name.sort().join(', ')}")
        }
    }
}

// An application may leave passkeys out (exclude group: 'com.webauthn4j'), which also takes the CBOR codec out of Spring MVC.
// The tests that run Contexa on such a class path run in a task of their own, on the class path of the tests without
// webauthn4j; their names end in PasskeyLibraryClasspathTest, and `check` runs them after the others.
def withoutPasskeyLibraryTests = '**/*WithoutPasskeyLibraryClasspathTest*'

configurations {
    withoutPasskeyLibraryTestRuntimeClasspath {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom configurations.testImplementation, configurations.testRuntimeOnly
        exclude group: 'com.webauthn4j'
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
            attribute(TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
                    objects.named(TargetJvmEnvironment, TargetJvmEnvironment.STANDARD_JVM))
        }
    }
}

def withoutPasskeyLibraryClasspathTest = tasks.register('withoutPasskeyLibraryClasspathTest', Test) {
    description = 'Runs the tests that need an application class path without webauthn4j.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.output + sourceSets.main.output + configurations.withoutPasskeyLibraryTestRuntimeClasspath
    include withoutPasskeyLibraryTests
    useJUnitPlatform()
    jvmArgs '-XX:+EnableDynamicAgentLoading', '-Dorg.mockito.mock.maker=mock-maker-subclass'
}

tasks.named('test') {
    exclude withoutPasskeyLibraryTests
}

tasks.named('check') {
    dependsOn tasks.named('verifyStarterLeavesSecurityToTheApplication')
    dependsOn withoutPasskeyLibraryClasspathTest
}
