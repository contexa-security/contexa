import groovy.transform.CompileStatic
import org.gradle.api.GradleException

import java.nio.charset.StandardCharsets
import java.nio.file.FileVisitResult
import java.nio.file.Files
import java.nio.file.Path
import java.nio.file.SimpleFileVisitor
import java.nio.file.attribute.BasicFileAttributes
import java.util.regex.Matcher
import java.util.regex.Pattern

/**
 * Finds Java code that names a type by its package instead of importing it. Only code is read: string, character and
 * text block literals and comments are skipped, and a match with "import" or "package" in the twenty characters before
 * it is a declaration. The files are the tracked .java files when the root is a git work tree, otherwise every .java file
 * under the root outside the build and tool directories (a Docker build context has no git metadata).
 */
@CompileStatic
class FullyQualifiedReferences {

    private static final Set<String> SKIPPED_DIRECTORIES =
            ['.git', '.gradle', '.idea', 'build', 'out', 'node_modules'] as Set<String>

    private static final Pattern REFERENCE = Pattern.compile(
            '(?<![A-Za-z0-9_])[a-z][a-z0-9_]*\\.(?:[a-z0-9_]+\\.)+[A-Z][A-Za-z0-9_]*(?![A-Za-z0-9_])')

    private static final int CODE = 0
    private static final int TEXT_BLOCK = 1
    private static final int STRING = 2
    private static final int CHAR = 3
    private static final int LINE_COMMENT = 4
    private static final int BLOCK_COMMENT = 5

    static List<String> javaFiles(File root) {
        List<String> files = []
        if (insideGitWorkTree(root)) {
            Process process = new ProcessBuilder('git', 'ls-files').directory(root).start()
            String listing = process.inputStream.getText(StandardCharsets.UTF_8.name())
            String failure = process.errorStream.getText(StandardCharsets.UTF_8.name())
            if (process.waitFor() != 0) {
                throw new GradleException("git ls-files failed in ${root}: ${failure.trim()}".toString())
            }
            for (String line : listing.split('\n')) {
                String file = line.trim()
                if (file.endsWith('.java')) {
                    files.add(file)
                }
            }
            return files
        }
        Path base = root.toPath()
        Files.walkFileTree(base, new SimpleFileVisitor<Path>() {
            @Override
            FileVisitResult preVisitDirectory(Path dir, BasicFileAttributes attrs) {
                if (dir != base && SKIPPED_DIRECTORIES.contains(dir.fileName.toString())) {
                    return FileVisitResult.SKIP_SUBTREE
                }
                return FileVisitResult.CONTINUE
            }

            @Override
            FileVisitResult visitFile(Path file, BasicFileAttributes attrs) {
                if (attrs.regularFile && file.fileName.toString().endsWith('.java')) {
                    files.add(base.relativize(file).toString())
                }
                return FileVisitResult.CONTINUE
            }
        })
        return files
    }

    /**
     * Returns one pair per reference found: the message naming the file, line and reference, and the line itself.
     */
    static List<String[]> check(File root, String file) {
        File source = new File(root, file)
        List<String[]> found = []
        if (!source.exists()) {
            return found
        }
        String content = new String(Files.readAllBytes(source.toPath()), StandardCharsets.UTF_8)
        int[] lineStarts = lineStarts(content)
        for (int[] span : codeSpans(content)) {
            String text = content.substring(span[0], span[1])
            Matcher matcher = REFERENCE.matcher(text)
            while (matcher.find()) {
                int offset = matcher.start()
                String before = text.substring(Math.max(0, offset - 20), offset).trim()
                if (before.contains('import') || before.contains('package')) {
                    continue
                }
                int line = lineIndex(lineStarts, span[0] + offset)
                found.add([
                        "[STYLE ERROR] Fully qualified package reference found in ${file}:${line + 1} -> ${matcher.group()}".toString(),
                        "  > ${lineText(content, lineStarts, line)}".toString()
                ] as String[])
            }
        }
        return found
    }

    private static boolean insideGitWorkTree(File root) {
        try {
            Process process = new ProcessBuilder('git', 'rev-parse', '--is-inside-work-tree')
                    .directory(root)
                    .redirectError(ProcessBuilder.Redirect.DISCARD)
                    .start()
            String answer = process.inputStream.getText(StandardCharsets.UTF_8.name()).trim()
            return process.waitFor() == 0 && answer == 'true'
        } catch (IOException ignored) {
            return false
        }
    }

    private static List<int[]> codeSpans(String content) {
        List<int[]> spans = []
        int length = content.length()
        int state = CODE
        int start = 0
        int i = 0
        while (i < length) {
            char c = content.charAt(i)
            char next = i + 1 < length ? content.charAt(i + 1) : (char) 0
            char after = i + 2 < length ? content.charAt(i + 2) : (char) 0
            if (state == CODE) {
                int opened = CODE
                int width = 0
                if (c == (char) '"' && next == (char) '"' && after == (char) '"') {
                    opened = TEXT_BLOCK
                    width = 3
                } else if (c == (char) '"') {
                    opened = STRING
                    width = 1
                } else if (c == (char) '\'') {
                    opened = CHAR
                    width = 1
                } else if (c == (char) '/' && next == (char) '/') {
                    opened = LINE_COMMENT
                    width = 2
                } else if (c == (char) '/' && next == (char) '*') {
                    opened = BLOCK_COMMENT
                    width = 2
                }
                if (opened == CODE) {
                    i++
                } else {
                    if (i > start) {
                        spans.add([start, i] as int[])
                    }
                    start = i
                    state = opened
                    i += width
                }
            } else if (state == TEXT_BLOCK) {
                if (c == (char) '\\') {
                    i += 2
                } else if (c == (char) '"' && next == (char) '"' && after == (char) '"') {
                    i += 3
                    start = i
                    state = CODE
                } else {
                    i++
                }
            } else if (state == STRING || state == CHAR) {
                char closing = state == STRING ? (char) '"' : (char) '\''
                if (c == (char) '\\') {
                    i += 2
                } else if (c == closing) {
                    i++
                    start = i
                    state = CODE
                } else {
                    i++
                }
            } else if (state == LINE_COMMENT) {
                i++
                if (c == (char) '\n') {
                    start = i
                    state = CODE
                }
            } else {
                if (c == (char) '*' && next == (char) '/') {
                    i += 2
                    start = i
                    state = CODE
                } else {
                    i++
                }
            }
        }
        if (state == CODE && length > start) {
            spans.add([start, length] as int[])
        }
        return spans
    }

    private static int[] lineStarts(String content) {
        List<Integer> starts = [0]
        for (int i = 0; i < content.length(); i++) {
            if (content.charAt(i) == (char) '\n') {
                starts.add(i + 1)
            }
        }
        return starts as int[]
    }

    private static int lineIndex(int[] lineStarts, int position) {
        int found = Arrays.binarySearch(lineStarts, position)
        return found >= 0 ? found : -found - 2
    }

    private static String lineText(String content, int[] lineStarts, int line) {
        int end = line + 1 < lineStarts.length ? lineStarts[line + 1] - 1 : content.length()
        return scriptTrim(content.substring(lineStarts[line], end))
    }

    private static String scriptTrim(String text) {
        int from = 0
        int to = text.length()
        while (from < to && scriptSpace(text.charAt(from))) {
            from++
        }
        while (to > from && scriptSpace(text.charAt(to - 1))) {
            to--
        }
        return text.substring(from, to)
    }

    private static boolean scriptSpace(char c) {
        return c == (char) '\t' || c == (char) '\n' || c == (char) 0x0B || c == (char) '\f' || c == (char) '\r'
                || c == (char) 0xFEFF || Character.isSpaceChar(c)
    }
}

tasks.register('checkJavaStyle') {
    group = 'verification'
    description = 'Check Java style requirements'
    File root = rootDir
    doLast {
        int total = 0
        for (String file : FullyQualifiedReferences.javaFiles(root)) {
            for (String[] reference : FullyQualifiedReferences.check(root, file)) {
                logger.error(reference[0])
                logger.error(reference[1])
                total++
            }
        }
        if (total > 0) {
            logger.error('')
            logger.error("[COMMIT BLOCKED] Found ${total} fully qualified package reference(s).")
            logger.error('Please use import statements and simple class names instead.')
            throw new GradleException("Found ${total} fully qualified package reference(s).")
        }
        logger.lifecycle('Java style check passed successfully.')
    }
}
