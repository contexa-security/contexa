// contexa-autoconfigure는 subprojects 설정을 상속받으므로
// plugins, java, configurations는 이미 적용됨

dependencies {
    compileOnly project(':contexa-common')
    compileOnly project(':contexa-core')
    compileOnly project(':contexa-identity')
    compileOnly project(':contexa-iam')

    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'

    compileOnly 'org.springframework.statemachine:spring-statemachine-core:4.0.0'
    compileOnly 'org.springframework.statemachine:spring-statemachine-data-redis:4.0.0'

    compileOnly 'org.springframework.boot:spring-boot-starter-security'

    compileOnly 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    compileOnly 'org.springframework.boot:spring-boot-starter-oauth2-client'
    compileOnly 'org.springframework.security:spring-security-oauth2-authorization-server:1.5.1'

    compileOnly 'org.springframework.boot:spring-boot-starter-webflux'
    compileOnly 'org.springframework.boot:spring-boot-actuator'
    compileOnly 'io.micrometer:micrometer-core'

    compileOnly 'org.springframework.ai:spring-ai-autoconfigure-model-chat-client'

    compileOnly 'org.springframework.boot:spring-boot-starter-mail'
    // IAM-D31: the console's seed texts are written in the page's language by a Thymeleaf post-processor.
    compileOnly 'org.springframework.boot:spring-boot-starter-thymeleaf'
    compileOnly("org.springframework.kafka:spring-kafka")
    testImplementation("org.springframework.kafka:spring-kafka")
    compileOnly 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    compileOnly("org.redisson:redisson:3.48.0")

    compileOnly 'org.springframework.ai:spring-ai-starter-mcp-client'
    compileOnly 'org.springframework.ai:spring-ai-ollama'
    compileOnly 'org.springframework.ai:spring-ai-anthropic'
    // O-4: Contexa's vector store on its own database, built like Spring AI's PgVectorStore auto-configuration.
    compileOnly 'org.springframework.ai:spring-ai-pgvector-store'
    compileOnly 'org.springframework.ai:spring-ai-autoconfigure-vector-store-pgvector'

    testImplementation project(':contexa-common')
    testImplementation project(':contexa-core')
    testImplementation project(':contexa-identity')
    testImplementation project(':contexa-iam')
    testImplementation(testFixtures(project(':contexa-iam')))
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.ai:spring-ai-anthropic'
    testImplementation 'org.springframework.boot:spring-boot-actuator'
    testImplementation 'org.springframework.boot:spring-boot-actuator-autoconfigure'
    testImplementation 'io.micrometer:micrometer-core'
    testImplementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    testImplementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    testImplementation 'org.springframework.security:spring-security-oauth2-authorization-server:1.5.1'
    testImplementation 'org.springframework.ai:spring-ai-openai'
    testImplementation 'org.springframework.ai:spring-ai-ollama'
    testImplementation 'org.springframework.ai:spring-ai-pgvector-store'
    testImplementation 'org.springframework.ai:spring-ai-autoconfigure-vector-store-pgvector'
    // the console's pages read the signed-in user through this dialect, as the starter brings it to an application
    testImplementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    testRuntimeOnly 'com.h2database:h2'
}

bootJar.enabled = false
jar.enabled = true

tasks.named('resolveMainClassName') {
    enabled = false
}

// The distributed mode keeps the MFA flows in Redis through Redisson and Spring Statemachine's Redis repositories, which an
// application adds for that mode. The other tests of this module run without them, and adding them to those tests would
// change the versions they run on (Kryo, Objenesis), so the tests that need them run in a task of their own, on the class
// path of the tests with both libraries added. Their names end in DistributedClasspathTest; `test` runs them after the others.
def distributedClasspathTests = '**/*DistributedClasspathTest*'

configurations {
    distributedClasspathTest {
        canBeConsumed = false
        canBeResolved = false
    }
    distributedClasspathTestRuntimeClasspath {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom configurations.testImplementation, configurations.testRuntimeOnly, configurations.distributedClasspathTest
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
            attribute(TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
                    objects.named(TargetJvmEnvironment, TargetJvmEnvironment.STANDARD_JVM))
        }
    }
}

dependencies {
    testCompileOnly("org.redisson:redisson:3.48.0")
    testCompileOnly 'org.springframework.statemachine:spring-statemachine-data-redis:4.0.0'
    distributedClasspathTest("org.redisson:redisson:3.48.0")
    distributedClasspathTest 'org.springframework.statemachine:spring-statemachine-data-redis:4.0.0'
}

def distributedClasspathTest = tasks.register('distributedClasspathTest', Test) {
    description = 'Runs the tests that need the libraries of the distributed mode on their class path.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.output + sourceSets.main.output + configurations.distributedClasspathTestRuntimeClasspath
    include distributedClasspathTests
    useJUnitPlatform()
    jvmArgs '-XX:+EnableDynamicAgentLoading', '-Dorg.mockito.mock.maker=mock-maker-subclass'
}

tasks.named('test') {
    useJUnitPlatform()
    exclude distributedClasspathTests
    finalizedBy distributedClasspathTest
}
