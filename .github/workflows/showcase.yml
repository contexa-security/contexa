name: Showcase

on:
  push:
    branches: [ main ]
    paths:
      - 'contexa-showcase/**'
      - 'contexa-*/src/main/**'
      - 'spring-boot-starter-contexa/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/showcase.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'contexa-showcase/**'
      - 'contexa-*/src/main/**'
      - 'spring-boot-starter-contexa/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/showcase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test the showcase modules (Testcontainers uses the runner Docker)
        run: >
          ./gradlew --no-daemon
          :showcase-business:build
          :showcase-workload-plain:build
          :showcase-workload-contexa:build
          :showcase-portal:build

  web:
    name: Web lint, tests and E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contexa-showcase/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: contexa-showcase/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Keep the E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-playwright-report
          path: contexa-showcase/web/playwright-report

  images:
    name: Production images (linux/amd64)
    needs: [ backend, web ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the three images
        run: |
          for target in portal plain contexa; do
            docker build --platform linux/amd64 -f contexa-showcase/infra/docker/showcase.Dockerfile \
              --target "$target" -t "contexa-showcase-$target:ci" .
          done
      - name: Only linux-x86_64 native libraries in the engine image
        run: |
          id=$(docker create contexa-showcase-contexa:ci)
          docker cp "$id:/app/app.jar" engine.jar
          docker rm "$id"
          foreign=$(unzip -l engine.jar | grep -E 'BOOT-INF/lib/(nd4j-native|openblas|javacpp)-[^ ]*-(windows|macosx|android|ios|linux-arm|linux-ppc)' || true)
          if [ -n "$foreign" ]; then echo "$foreign"; exit 1; fi
