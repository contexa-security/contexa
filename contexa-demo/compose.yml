name: contexa-runtime-lab
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lab_portal
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:?Set LAB_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${LAB_DB_PORT:-15432}:5432"
    volumes:
      - lab-postgres:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/01-lab.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab_portal"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  lab-postgres:
