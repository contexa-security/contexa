<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Contexa Runtime Lab</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/pages/work.css">
    <link rel="stylesheet" href="/assets/css/pages/export.css">
    <script type="module" src="/assets/js/pages/export.js"></script>
</head>
<body data-title="export.title">
    <a class="skip" href="#main" data-i18n="skip">본문으로 바로가기</a>
    <header class="site-header"><div class="header-inner">
        <a class="brand" href="/index.html" aria-label="Contexa Runtime Lab"><svg class="icon brand-mark" aria-hidden="true"><use href="/assets/icons.svg#mark"></use></svg>contexa</a>
        <span class="brand-caption">RUNTIME LAB</span>
        <nav class="header-actions" aria-label="Navigation"><a class="header-link" href="/session.html" data-i18n="work.account"></a><button id="language" class="language" type="button" aria-label="Switch to English">EN</button></nav>
    </div></header>
    <main id="main" class="page work-page" tabindex="-1">
        <div class="work-environment"><span data-i18n="work.environment"></span><span id="environment"></span><span id="work-username" class="mono"></span></div>
        <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb"><a href="/projects.html" data-i18n="work.projects"></a></nav>
        <nav class="work-navigation" aria-label="Business navigation"><a href="/projects.html" data-i18n="work.projects" aria-current="page"></a><a href="/customers.html" data-i18n="customer.list"></a><a href="/approvals.html" data-i18n="approval.list"></a></nav>
        <div class="page-heading"><p class="eyebrow">BUSINESS WORKSPACE</p><h1 id="page-title" data-i18n="export.title"></h1><p id="page-description" class="lead" data-i18n="export.lead"></p></div>
        <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
        <div id="recovery" class="actions" hidden><a id="native-verification" class="button" data-i18n="work.mfa.continue" hidden></a><a class="button secondary" href="/session.html" data-i18n="work.account"></a><a id="connect-link" href="/connect.html" data-i18n="work.reconnect"></a></div>
        <section class="surface" aria-labelledby="document-title">
            <div class="surface-head"><h2 id="document-title" data-i18n="export.setup"></h2><span id="export-format-badge" class="badge"></span></div>
            <div class="surface-body">
                <div class="export-layout">
                <aside class="export-selection-summary" aria-labelledby="export-selection-title">
                    <p class="eyebrow" data-i18n="export.targets"></p><h3 id="export-selection-title"></h3>
                    <p id="export-format" class="small muted"></p>
                    <details id="export-target-panel" class="export-target-panel"><summary id="export-target-summary"></summary><ul id="export-targets" class="approval-target-summary"></ul></details>
                    <div id="export-security-mode" class="export-security-mode" hidden><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#shield"></use></svg><div><h3 data-i18n="export.security.title"></h3><p class="small muted" data-i18n="export.security.note"></p></div></div>
                    <p id="export-runtime-note" class="small muted" data-i18n="export.runtime.note"></p>
                </aside>
                <form id="download-form" class="download-form">
                    <div class="field"><label for="purpose" data-i18n="work.purpose"></label><select id="purpose" required aria-describedby="purpose-hint">
                        <option value="PROJECT_REVIEW" data-i18n="work.purpose.PROJECT_REVIEW"></option>
                        <option value="CUSTOMER_SUPPORT" data-i18n="work.purpose.CUSTOMER_SUPPORT"></option>
                        <option value="CROSS_PROJECT_REVIEW" data-i18n="work.purpose.CROSS_PROJECT_REVIEW"></option>
                        <option value="APPROVED_BULK_DELIVERY" data-i18n="approval.purpose.APPROVED_BULK_DELIVERY"></option>
                        <option value="EMERGENCY_MAINTENANCE" data-i18n="approval.purpose.EMERGENCY_MAINTENANCE"></option>
                        <option value="UNDECLARED" data-i18n="work.purpose.UNDECLARED"></option>
                    </select><span id="purpose-hint" class="hint" data-i18n="work.purpose.note"></span></div>
                    <div class="field approval-selection"><label for="work-approval" data-i18n="approval.link.label"></label><select id="work-approval" aria-describedby="work-approval-hint"></select><span id="work-approval-hint" class="hint"></span><div class="inline-links"><a id="work-approval-detail" data-i18n="approval.detail" hidden></a><a data-work-approval-new href="/approval-request.html?new=true" data-i18n="approval.new"></a></div></div>

                    <div class="field"><label for="file-language" data-i18n="download.language"></label><select id="file-language"><option value="KO">한국어</option><option value="EN">English</option></select></div>
                    <div class="actions"><button id="download" class="button" type="submit" data-i18n="download.receive" disabled></button><button id="cancel" class="button secondary" type="button" data-i18n="download.cancel" hidden></button></div>
                </form>
                </div>
                <div class="transfer-status" aria-live="polite"><progress id="transfer-progress" aria-label="File transfer" hidden></progress><span id="transfer-bytes" class="mono"></span></div>
                <div id="restored-result" class="feedback" role="status"></div><a id="pending-transfer-link" data-i18n="download.pending.return" hidden></a>
                <div id="download-result" class="feedback" role="status"></div><dl id="download-facts" class="definition"></dl>
                <details id="download-technical-section" class="download-technical" hidden><summary data-i18n="download.technical"></summary><dl id="download-technical" class="definition"></dl></details>
                <div id="receipt-result" class="feedback" role="status"></div>
                <button id="retry-report" class="button secondary" data-i18n="download.report.retry" hidden></button>
                <details class="export-retry-help"><summary data-i18n="export.retry.help"></summary><p class="hint" data-i18n="download.repeat.note"></p></details>
                <div class="actions"><a id="evidence-link" class="button secondary" data-i18n="work.evidence" hidden></a><button id="new-command" class="button secondary compact" type="button" data-i18n="download.new"></button><a id="back-document" data-i18n="export.back"></a></div>
            </div>
        </section>
    </main>
    <footer class="site-footer"><div class="footer-inner"><span data-i18n="footer"></span><a href="/status.html" data-i18n="status"></a></div></footer>
    <noscript>이 체험은 JavaScript가 필요합니다. / JavaScript is required.</noscript>
</body>
</html>
