<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Contexa Runtime Lab</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/pages/workspace.css">
    <script defer src="/assets/js/vendor/chart.umd.min.js"></script>
    <script type="module" src="/assets/js/pages/workspace.js"></script>
</head>
<body data-title="workspace.title">
    <a class="skip" href="#main" data-i18n="skip"></a>
    <header class="site-header"><div class="header-inner">
        <a class="brand" href="/index.html" aria-label="Contexa Runtime Lab"><svg class="icon brand-mark" aria-hidden="true"><use href="/assets/icons.svg#mark"></use></svg>contexa</a>
        <span class="brand-caption">RUNTIME LAB</span>
        <nav class="header-actions" aria-label="Navigation"><a class="header-link" href="/experience.html" data-i18n="about"></a><button id="language" class="language" type="button">EN</button></nav>
    </div></header>
    <main id="main" class="page" tabindex="-1">
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="/experience.html" data-i18n="about"></a></nav>
        <div class="page-heading"><p class="eyebrow">YOUR PRIVATE EXPERIENCE</p><h1 data-i18n="workspace.title"></h1><p class="lead" data-i18n="workspace.lead"></p></div>
        <div id="workspace-feedback" class="feedback" role="status" aria-live="polite"></div>
        <section class="surface" aria-labelledby="workspace-status-title">
            <div class="surface-head"><h2 id="workspace-status-title" data-i18n="workspace.status"></h2><button id="workspace-refresh" class="button secondary compact" type="button" data-i18n="refresh"></button></div>
            <div class="surface-body">
                <div class="workspace-status"><span id="workspace-state" class="badge"></span><div><span class="small muted" data-i18n="workspace.remaining"></span><p id="workspace-clock" class="workspace-clock">—</p></div></div>
                <p id="workspace-note" class="notice"></p>
                <div id="workspace-usage" hidden><div class="workspace-chart"><canvas id="workspace-chart" role="img"></canvas></div><dl id="workspace-counts" class="definition"></dl><p class="small muted" data-i18n="workspace.cost.note"></p></div>
                <div class="actions"><button id="workspace-start" class="button" type="button" data-i18n="workspace.start"></button><a id="workspace-continue" class="button" href="/journey.html?scenario=S01" hidden data-i18n="workspace.continue"></a><button id="workspace-end" class="button secondary" type="button" hidden data-i18n="workspace.end"></button></div>
                <div id="workspace-confirm" class="notice" hidden><p data-i18n="workspace.end.confirm"></p><div class="actions"><button id="workspace-end-confirm" class="button secondary" type="button" data-i18n="workspace.end.confirm.button"></button><button id="workspace-end-back" class="button secondary" type="button" data-i18n="workspace.keep"></button></div></div>
            </div>
        </section>
        <p class="workspace-history-note"><span data-i18n="workspace.history.note"></span> <a href="/experience.html#records-title" data-i18n="workspace.history"></a></p>
    </main>
    <footer class="site-footer"><div class="footer-inner"><span data-i18n="footer"></span><a href="/experience.html" data-i18n="about"></a></div></footer>
    <noscript>이 체험은 JavaScript가 필요합니다. / JavaScript is required.</noscript>
</body>
</html>
