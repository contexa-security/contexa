<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Contexa Runtime Lab</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/pages/experience.css">
    <link rel="stylesheet" href="/assets/css/pages/journey.css">
    <script type="module" src="/assets/js/pages/journey.js"></script>
</head>
<body data-title="journey.title">
    <a class="skip" href="#main" data-i18n="skip"></a>
    <header class="site-header"><div class="header-inner">
        <a class="brand" href="/index.html" aria-label="Contexa Runtime Lab"><svg class="icon brand-mark" aria-hidden="true"><use href="/assets/icons.svg#mark"></use></svg>contexa</a>
        <span class="brand-caption">RUNTIME LAB</span>
        <nav class="header-actions" aria-label="Navigation"><a class="header-link" href="/experience.html" data-i18n="about"></a><button id="language" class="language" type="button">EN</button></nav>
    </div></header>
    <main id="main" class="page" tabindex="-1">
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="/experience.html" data-i18n="about"></a><span>/</span><a href="/explore.html" data-i18n="explore.title"></a></nav>
        <div class="page-heading"><p id="journey-version" class="eyebrow">EXPERIENCE · LIVE WORK</p><h1 id="journey-title" data-i18n="journey.title"></h1><p id="journey-description" class="lead" data-i18n="journey.lead"></p></div>
        <div id="journey-feedback" class="feedback" role="status" aria-live="polite"></div>
        <section id="journey-start-panel" class="surface" hidden><div class="surface-body"><form id="journey-start-form">
            <label for="journey-account" data-i18n="journey.account"></label><select id="journey-account" required></select>
            <p id="journey-initial-note" class="notice" hidden data-i18n="journey.sparse"></p>
            <div class="actions"><button id="journey-start" class="button" type="submit" data-i18n="journey.start"></button></div>
        </form></div></section>
        <section id="journey-active" hidden>
            <p class="small muted" data-i18n="journey.frozen"></p>
            <nav id="journey-steps" class="journey-steps" aria-label="Experience steps"></nav>
            <section class="surface" aria-labelledby="journey-step-title"><div class="surface-body">
                <p id="journey-step-number" class="eyebrow"></p><h2 id="journey-step-title" tabindex="-1"></h2><p id="journey-step-description" class="lead"></p>
                <p id="journey-pace" class="notice" hidden></p><p id="journey-limit" class="small muted"></p>
                <div id="journey-step-actions" class="actions"></div><div id="journey-targets" class="journey-targets"></div>
                <div id="journey-catalog" hidden><h3 data-i18n="journey.catalog"></h3><div id="journey-catalog-results" class="journey-catalog"></div></div>
            </div></section>
            <section class="surface" aria-labelledby="journey-history-title"><div class="surface-head"><h2 id="journey-history-title" data-i18n="journey.history"></h2><button id="journey-refresh" class="button secondary" data-i18n="journey.refresh"></button></div><div class="surface-body">
                <p class="small muted" data-i18n="journey.results"></p><p id="journey-empty" class="empty" data-i18n="journey.empty"></p><div id="journey-runs"></div>
                <p id="journey-truncated" class="notice" hidden data-i18n="journey.truncated"></p>
            </div></section>
            <details class="surface"><summary data-i18n="journey.criteria"></summary><div class="surface-body"><pre id="journey-source" tabindex="0"></pre></div></details>
        </section>
    </main>
    <footer class="site-footer"><div class="footer-inner"><span data-i18n="footer"></span><a href="/connect.html" data-i18n="connect.title"></a></div></footer>
    <noscript>이 체험은 JavaScript가 필요합니다. / JavaScript is required.</noscript>
</body>
</html>
