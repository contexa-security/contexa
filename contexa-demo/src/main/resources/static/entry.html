<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Contexa Runtime Lab</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/pages/entry.css">
    
    <script type="module" src="/assets/js/pages/entry.js"></script>
</head>
<body data-title="entry.title">
    <a class="skip" href="#main" data-i18n="skip">본문으로 바로가기</a>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="/index.html" aria-label="Contexa Runtime Lab">
                <svg class="icon brand-mark" aria-hidden="true"><use href="/assets/icons.svg#mark"></use></svg>
                contexa
            </a>
            <span class="brand-caption">RUNTIME LAB</span>
            <nav class="header-actions" aria-label="Navigation">
                <a class="header-link" href="/index.html" data-i18n="about">체험 안내</a>
                <button id="language" class="language" type="button" aria-label="Switch to English">EN</button>
            </nav>
        </div>
    </header>
    <main id="main" class="page " tabindex="-1">
<div class="breadcrumb"><a href="/index.html" data-i18n="about"></a><span>/</span><span data-i18n="entry.form.title"></span></div>
<div class="entry-layout">
    <section class="entry-intro">
        <p class="eyebrow">01 / PARTICIPATION</p>
        <h1 data-i18n="entry.title"></h1><p class="lead" data-i18n="entry.description"></p>
        <div class="entry-assurance"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#lock"></use></svg><p data-i18n="entry.assurance"></p></div>
    </section>
    <section class="surface entry-form" aria-label="Email verification" aria-busy="true" id="entry-panel">
        <div id="entry-loading" class="muted" role="status" data-i18n="loading"></div>
        <div id="entry-request" hidden>
            <h2 data-i18n="entry.form.title"></h2><p class="small muted" data-i18n="entry.form.body"></p>
            <form id="request-form">
                <div class="field"><label for="email" data-i18n="entry.email"></label><input id="email" type="email" name="email" autocomplete="email" maxlength="254" required placeholder="name@company.com"></div>
                <button id="request-button" class="button primary" type="submit" data-i18n="entry.send"></button>
            </form>
        </div>
        <div id="entry-code" hidden>
            <h2 data-i18n="entry.code.title"></h2><p class="small muted" data-i18n="entry.code.body"></p>
            <form id="verify-form">
                <div class="field"><label for="code" data-i18n="entry.code"></label><input id="code" name="code" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required aria-describedby="code-expiry"><span class="hint" id="code-expiry"></span></div>
                <button id="verify-button" class="button primary" type="submit" data-i18n="entry.verify"></button>
            </form>
            <div class="actions"><button id="resend-button" class="button secondary compact" type="button" data-i18n="entry.resend"></button><button id="change-email" class="button secondary compact" type="button" data-i18n="entry.change"></button></div>
            <p id="retry-time" class="small muted"></p>
        </div>
        <div id="entry-verified" hidden>
            <div class="verified-mark"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#check"></use></svg></div><h2 data-i18n="entry.verified"></h2><p class="muted" data-i18n="entry.verified.body"></p>
            <a class="button" href="/connect.html"><span data-i18n="entry.continue"></span><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#arrow"></use></svg></a>
        </div>
        <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
        <div class="actions" id="entry-recovery" hidden><button class="button secondary" id="entry-refresh" type="button" data-i18n="refresh"></button><a href="/status.html" data-i18n="status"></a></div>
    </section>
</div>
    </main>
    <footer class="site-footer">
        <div class="footer-inner">
            <span data-i18n="footer">인증 이후에도, 업무의 맥락을 확인합니다.</span>
            <span><a href="/status.html" data-i18n="status">준비 상태</a> · <a href="/operator.html" data-i18n="operator">운영 진단</a></span>
        </div>
    </footer>
    <noscript>이 체험은 JavaScript가 필요합니다. / JavaScript is required for this experience.</noscript>
</body>
</html>
