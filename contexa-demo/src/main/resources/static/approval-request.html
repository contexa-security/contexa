<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Contexa Runtime Lab</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/pages/work.css">
    <script type="module" src="/assets/js/pages/approval-request.js"></script>
</head>
<body data-title="approval.request.title">
    <a class="skip" href="#main" data-i18n="skip">본문으로 바로가기</a>
    <header class="site-header"><div class="header-inner">
        <a class="brand" href="/index.html" aria-label="Contexa Runtime Lab"><svg class="icon brand-mark" aria-hidden="true"><use href="/assets/icons.svg#mark"></use></svg>contexa</a>
        <span class="brand-caption">RUNTIME LAB</span>
        <nav class="header-actions" aria-label="Navigation"><a class="header-link" href="/session.html" data-i18n="work.account"></a><button id="language" class="language" type="button" aria-label="Switch to English">EN</button></nav>
    </div></header>
    <main id="main" class="page work-page" tabindex="-1">
        <div class="work-environment"><span data-i18n="work.environment"></span><span id="environment"></span><span id="work-username" class="mono"></span></div>

        <nav class="work-navigation" aria-label="Business navigation"><a href="/projects.html" data-i18n="work.projects"></a><a href="/customers.html" data-i18n="customer.list"></a><a href="/approvals.html" data-i18n="approval.list" aria-current="page"></a></nav>
        <div class="page-heading"><p class="eyebrow">BUSINESS WORKSPACE</p><h1 id="page-title" data-i18n="approval.request.title"></h1><p id="page-description" class="lead" data-i18n="approval.lead"></p></div>
        <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
        <div id="recovery" class="actions" hidden><a id="native-verification" class="button" data-i18n="work.mfa.continue" hidden></a><a class="button secondary" href="/session.html" data-i18n="work.account"></a><a id="connect-link" href="/connect.html" data-i18n="work.reconnect"></a></div>
        <section class="surface" aria-labelledby="approval-form-title">
            <div class="surface-head"><h2 id="approval-form-title" data-i18n="approval.request.title"></h2></div>
            <form id="approval-form" class="surface-body approval-form">
                <div class="approval-fields">
                    <div class="field"><label for="resource-type" data-i18n="approval.resource.type"></label><select id="resource-type"><option value="DOCUMENT" data-i18n="work.documents"></option><option value="CUSTOMER" data-i18n="customer.list"></option></select></div>
                    <div class="field"><label for="project" data-i18n="customer.project.filter"></label><select id="project"></select></div>
                </div>
                <fieldset class="approval-targets"><legend data-i18n="approval.targets"></legend><p class="hint" data-i18n="approval.targets.note"></p><div id="target-list"></div><p id="target-count" class="small muted" aria-live="polite"></p></fieldset>
                <div class="approval-fields">
                    <div class="field"><label for="purpose" data-i18n="work.purpose"></label><select id="purpose" required><option value="PROJECT_REVIEW" data-i18n="work.purpose.PROJECT_REVIEW"></option><option value="CUSTOMER_SUPPORT" data-i18n="work.purpose.CUSTOMER_SUPPORT"></option><option value="APPROVED_BULK_DELIVERY" data-i18n="approval.purpose.APPROVED_BULK_DELIVERY"></option><option value="EMERGENCY_MAINTENANCE" data-i18n="approval.purpose.EMERGENCY_MAINTENANCE"></option></select></div>
                    <div class="field"><label for="validity" data-i18n="approval.validity"></label><select id="validity"><option value="60" data-i18n="approval.validity.one"></option><option value="300" data-i18n="approval.validity.five"></option><option value="900" selected data-i18n="approval.validity.fifteen"></option><option value="1800" data-i18n="approval.validity.thirty"></option></select></div>
                </div>
                <div class="field"><label for="reason" data-i18n="approval.reason"></label><textarea id="reason" rows="4" maxlength="1000" required aria-describedby="reason-hint"></textarea><span id="reason-hint" class="hint" data-i18n="approval.reason.note"></span></div>
                <p class="hint" data-i18n="approval.retry.note"></p><div class="actions"><button id="submit-approval" class="button" type="submit" disabled data-i18n="approval.submit"></button><a href="/approvals.html" data-i18n="approval.return"></a></div>
            </form>
        </section>
    </main>
    <footer class="site-footer"><div class="footer-inner"><span data-i18n="footer"></span><a href="/status.html" data-i18n="status"></a></div></footer>
    <noscript>이 체험은 JavaScript가 필요합니다. / JavaScript is required.</noscript>
</body>
</html>
