# Local infrastructure of the Contexa Showcase.
# Usage: set SHOWCASE_DB_PASSWORD in the environment (never commit it), then
#   docker compose -f contexa-showcase/infra/compose.yml up -d
name: contexa-showcase

services:
  postgres:
    image: pgvector/pgvector:pg16
    # Five workloads, the portal and the engine's own pools hold up to about 120 connections under 50 concurrent live
    # runs (P4-BE-01 measurement); the default limit of 100 refused new clients.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${SHOWCASE_DB_USER:-showcase}
      POSTGRES_PASSWORD: ${SHOWCASE_DB_PASSWORD:?Set SHOWCASE_DB_PASSWORD before starting the showcase infrastructure}
      POSTGRES_DB: showcase_portal
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:46432:5432"
    volumes:
      - showcase-postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d showcase_portal"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  showcase-postgres: {}
