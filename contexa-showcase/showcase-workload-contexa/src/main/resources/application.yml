spring:
  application:
    name: showcase-workload-contexa
  # The application datasource holds the Spring AI vector store. Contexa refuses to share it with
  # contexa.datasource, and business data is reached through the work datasource of showcase-business.
  datasource:
    url: ${SHOWCASE_VECTOR_DB_URL:jdbc:postgresql://127.0.0.1:46432/showcase_vector}
    username: ${SHOWCASE_DB_USER:showcase}
    password: ${SHOWCASE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      # Idle pools keep few connections; the pool grows only under load.
      minimum-idle: 2
      connection-timeout: 3000
  flyway:
    # The engine schema is created by Contexa itself and the business schema by showcase-workload-plain.
    enabled: false
  data:
    jpa:
      repositories:
        enabled: false
  jpa:
    open-in-view: false
  # A streamed export of the largest allowed size (10,000 items at the business pace of 160 per second) takes
  # about 63 seconds; the default 30-second async timeout would cut it without any security decision.
  mvc:
    async:
      request-timeout: 120s
  sql:
    init:
      mode: never
  ai:
    model:
      # The chat provider: openai, or anthropic for the model comparison and when the OpenAI balance is used up
      # (docs/agent 위임결정기록 DD-4). The embeddings: openai, or ollama (local) with the OpenAI balance used up.
      chat: ${SHOWCASE_CHAT_PROVIDER:openai}
      embedding: ${SHOWCASE_EMBEDDING_PROVIDER:openai}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${SHOWCASE_CHAT_MODEL:gpt-5-nano}
    anthropic:
      api-key: ${SHOWCASE_ANTHROPIC_API_KEY:${ANTHROPIC_API_KEY:}}
      chat:
        options:
          model: ${SHOWCASE_ANTHROPIC_CHAT_MODEL:claude-haiku-5-5}
      embedding:
        options:
          model: ${SHOWCASE_EMBEDDING_MODEL:text-embedding-3-small}
          dimensions: ${SHOWCASE_EMBEDDING_DIMENSIONS:1024}
    # Local embeddings when the OpenAI balance is used up (docs/agent 위임결정기록 DD-4): mxbai-embed-large has the
    # pgvector's 1024 dimensions. Another provider is another vector space, so the templates are learned again.
    ollama:
      base-url: ${SHOWCASE_OLLAMA_BASE_URL:http://127.0.0.1:11434}
      embedding:
        options:
          model: ${SHOWCASE_OLLAMA_EMBEDDING_MODEL:mxbai-embed-large}
contexa:
  enabled: true
  infrastructure:
    mode: standalone
  datasource:
    url: ${SHOWCASE_ENGINE_DB_URL:jdbc:postgresql://127.0.0.1:46432/showcase_engine}
    username: ${SHOWCASE_DB_USER:showcase}
    password: ${SHOWCASE_DB_PASSWORD:}
    isolation:
      contexa-owned-application: false
  security:
    zerotrust:
      mode: ENFORCE
      agent:
        # docs/agent A2-1: the business objective the company's agents are delegated (a delegation record's objective
        # family), in the words of the business operations' @Protectable category and actions; the export limit is
        # the company's limit for an assigned project.
        objective-contracts:
          REPORTING:
            operations: [READ, EXPORT]
            resource-families: [PROJECT_DOCUMENTS]
            max-export-items: 500
    tiered:
      # The decision prompt bundle D runs (docs/showcase/판정층-수정계획.md 8절 1): without it a plain start runs the
      # core default bundle.
      prompt-bundle:
        active: 2026.10.25-v21.15
      # The model of each analysis layer (docs/showcase/판정층-수정계획.md E-7): Layer1 decides, Layer2 decides what
      # Layer1 could not. A model id with no runtime binding runs on a copy of the primary chat model; one that cannot
      # be made stops the start.
      llm:
        layer1:
          model: ${SHOWCASE_LAYER1_MODEL:gpt-6-luna}
        # Layer 2 runs on Anthropic's Claude Sonnet 5.5 (user decision 2026-10-25, docs/agent 위임결정기록 DD-38); the
        # chat binding below names the chat model that model id is resolved to. Layer 2 on OpenAI again:
        # SHOWCASE_LAYER2_MODEL=gpt-6.1-sol.
        layer2:
          model: ${SHOWCASE_LAYER2_MODEL:claude-sonnet-5-5}
      layer1:
        open-ai-reasoning-effort: low
        max-output-tokens: 2048
      layer2:
        open-ai-reasoning-effort: low
        max-output-tokens: 2560
    plane:
      context:
        # The virtual company keeps its time in UTC; event hours and days are read in it whatever the JVM zone is.
        time-zone: UTC
  auth:
    state-type: SESSION
    cookie-secure: ${SHOWCASE_SECURE_COOKIE:false}
    # docs/agent A7-0: the agents' flow issues tokens through the engine's authorization server. The internal client
    # secret is a server secret like the signing key; the issuer is D's own address, where its token engine calls.
    oauth2:
      client-secret: ${SHOWCASE_OAUTH2_CLIENT_SECRET:}
      issuer-uri: ${SHOWCASE_OAUTH2_ISSUER:http://127.0.0.1:19182}
      token-exchange-enabled: true
  llm:
    bindings:
      chat:
        claude-sonnet-5-5:
          bean-name: layer2AnthropicChatModel
          provider: anthropic
          model-id: claude-sonnet-5-5
    # The OpenAI models that take max_completion_tokens and the reasoning effort (the core default covers gpt-5 and o).
    model-capabilities:
      openai:
        max-completion-token-patterns: gpt-5.*,gpt-6.*,o[0-9].*
        default-sampling-only-patterns: gpt-5.*,gpt-6.*,o[0-9].*
    selection:
      chat:
        priority: ${SHOWCASE_CHAT_PROVIDER:openai}
      embedding:
        priority: ${SHOWCASE_EMBEDDING_PROVIDER:openai}
  vectorstore:
    pgvector:
      dimensions: ${SHOWCASE_EMBEDDING_DIMENSIONS:1024}
      initialize-schema: true
  saas:
    enabled: false
  rag:
    etl:
      behavior:
        # Template memory documents carry the company time of the learned history; keep them for the template's
        # life instead of the 90-day default measured against the wall clock (docs/showcase/ADR.md ADR-23).
        retention-days: 400
  pqa:
    oss:
      sealed-evidence:
        # Every decision is measured, inspected and audited from its sealed package, so every decision is sealed
        # (R4-S6, default 1%).
        sample-percent: 100
        retention:
          # The prompt audit compares new sealed packages with those of earlier bundle versions, so a package
          # whose latest inspection found nothing wrong is kept as long as the others (R4-S5, default 30 days).
          clean-period: 90d
server:
  address: ${SHOWCASE_BIND_ADDRESS:127.0.0.1}
  # The client address comes only from the signed internal context, never from proxy headers.
  forward-headers-strategy: none
  port: ${SHOWCASE_CONTEXA_PORT:19182}
  servlet:
    session:
      cookie:
        name: SHOWCASE_CONTEXA_SESSION
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        # The workload publishes no host port; the capability report is read by the portal and the phase gates.
        include: health,contexacapabilities
  endpoint:
    health:
      show-details: never
showcase:
  control: D
  work:
    # Business database of the virtual company, reached through its own pool (ADR-10).
    datasource:
      url: ${SHOWCASE_WORK_DB_URL:jdbc:postgresql://127.0.0.1:46432/showcase_work}
      username: ${SHOWCASE_DB_USER:showcase}
      password: ${SHOWCASE_DB_PASSWORD:}
  internal:
    # Base64 HMAC key shared with the portal orchestrator (at least 32 bytes). Startup fails without it.
    signing-key: ${SHOWCASE_INTERNAL_SIGNING_KEY:}
