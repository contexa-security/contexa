server:
  port: 8081
spring:
  application:
    name: contexa-started
  ai:
    retry:
      max-attempts: 1
    openai:
      api-key: ${OPENAI_API_KEY:disabled}
      base-url: https://api.openai.com
      chat:
        options:
          model: gpt-5-nano
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 1024
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:disabled}
#      chat:
#        options:
#          model: claude-3-sonnet-20240229
  data:
    redis:
      host: ${CONTEXA_REDIS_HOST:localhost}
      port: ${CONTEXA_REDIS_PORT:26379}
  kafka:
    bootstrap-servers: ${CONTEXA_KAFKA_SERVERS:localhost:29092}
contexa:
  llm:
    selection:
      chat:
        mode: dynamic-priority
        priority: ollama,openai,anthropic
    chat:
      ollama:
        base-url: ${CONTEXA_CHAT_OLLAMA_BASE_URL:http://127.0.0.1:31434}
        model: ${CONTEXA_CHAT_OLLAMA_MODEL:qwen2.5:7b}
        keep-alive: ${CONTEXA_OLLAMA_CHAT_KEEP_ALIVE:30m}
    embedding:
      ollama:
        dedicated-runtime-enabled: false
        model: ${CONTEXA_EMBEDDING_OLLAMA_MODEL:mxbai-embed-large}
        dimensions: ${CONTEXA_EMBEDDING_OLLAMA_DIMENSIONS:1024}
  datasource:
    url: ${CONTEXA_DB_URL:${DB_URL:jdbc:postgresql://localhost:25432/contexa_sim}}
    username: ${CONTEXA_DB_USERNAME:${DB_USERNAME:contexa_sim}}
    password: ${CONTEXA_DB_PASSWORD:${DB_PASSWORD:contexa_sim_pw}}
    driver-class-name: ${CONTEXA_DB_DRIVER:org.postgresql.Driver}
    isolation:
      contexa-owned-application: true
  security:
    zerotrust:
      mode: ENFORCE
  hcad:
    geoip:
      enabled: true
      dbPath: data/GeoLite2-City.mmdb
  infrastructure:
    mode: standalone
