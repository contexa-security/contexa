server:
  port: 8081
spring:
  application:
    name: contexa-started
  ai:
    retry:
      max-attempts: 1
    openai:
      api-key: ${OPENAI_API_KEY:disabled}
      base-url: https://api.openai.com
      chat:
        options:
          model: gpt-5-nano
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 1024
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:disabled}
#      chat:
#        options:
#          model: claude-3-sonnet-20240229
  data:
    redis:
      host: ${CONTEXA_REDIS_HOST:localhost}
      port: ${CONTEXA_REDIS_PORT:26379}
  kafka:
    bootstrap-servers: ${CONTEXA_KAFKA_SERVERS:localhost:29092}
contexa:
  llm:
    selection:
      chat:
        mode: dynamic-priority
        priority: ollama,openai,anthropic
    model-capabilities:
      openai:
        max-completion-token-patterns: ${CONTEXA_LLM_MODEL_CAPABILITIES_OPENAI_MAX_COMPLETION_TOKEN_PATTERNS:gpt-5.*}
        default-sampling-only-patterns: ${CONTEXA_LLM_MODEL_CAPABILITIES_OPENAI_DEFAULT_SAMPLING_ONLY_PATTERNS:gpt-5.*}
    chat:
      ollama:
        base-url: ${CONTEXA_CHAT_OLLAMA_BASE_URL:http://127.0.0.1:31434}
        model: ${CONTEXA_CHAT_OLLAMA_MODEL:qwen2.5:7b}
        keep-alive: ${CONTEXA_OLLAMA_CHAT_KEEP_ALIVE:30m}
    embedding:
      ollama:
        dedicated-runtime-enabled: false
        model: ${CONTEXA_EMBEDDING_OLLAMA_MODEL:mxbai-embed-large}
        dimensions: ${CONTEXA_EMBEDDING_OLLAMA_DIMENSIONS:1024}
  datasource:
    url: ${CONTEXA_DB_URL:${DB_URL:jdbc:postgresql://localhost:25432/contexa_sim}}
    username: ${CONTEXA_DB_USERNAME:${DB_USERNAME:contexa_sim}}
    password: ${CONTEXA_DB_PASSWORD:${DB_PASSWORD:contexa_sim_pw}}
    driver-class-name: ${CONTEXA_DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${CONTEXA_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:48}
      minimum-idle: ${CONTEXA_DATASOURCE_HIKARI_MINIMUM_IDLE:8}
      connection-timeout-ms: ${CONTEXA_DATASOURCE_HIKARI_CONNECTION_TIMEOUT_MS:60000}
      validation-timeout-ms: ${CONTEXA_DATASOURCE_HIKARI_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout-ms: ${CONTEXA_DATASOURCE_HIKARI_IDLE_TIMEOUT_MS:600000}
      max-lifetime-ms: ${CONTEXA_DATASOURCE_HIKARI_MAX_LIFETIME_MS:1800000}
    isolation:
      contexa-owned-application: true
  security:
    zerotrust:
      mode: ENFORCE
    plane:
      agent:
        event-timeout-ms: ${CONTEXA_SECURITY_PLANE_AGENT_EVENT_TIMEOUT_MS:180000}
      llm-executor:
        queue-timeout-ms: ${CONTEXA_SECURITY_PLANE_LLM_EXECUTOR_QUEUE_TIMEOUT_MS:60000}
      llm-timeout:
        provider-call-timeout-ms: ${CONTEXA_SECURITY_PLANE_LLM_TIMEOUT_PROVIDER_CALL_TIMEOUT_MS:60000}
    tiered:
      prompt-compression:
        enabled: false
      layer1:
        timeout:
          interactive-rag-wait-ms: ${CONTEXA_SECURITY_TIERED_LAYER1_INTERACTIVE_RAG_WAIT_MS:500}
  identity:
    ott:
      fail-on-email-error: false
  hcad:
    geoip:
      enabled: true
      dbPath: data/GeoLite2-City.mmdb
  infrastructure:
    mode: standalone
