bootJar.enabled = false
jar.enabled = true

apply plugin: 'java-test-fixtures'

configurations {
    testFixturesImplementation.extendsFrom implementation
}

tasks.named('resolveMainClassName') {
    enabled = false
}

dependencies {
    api project(':contexa-common')
    compileOnly 'org.springframework.boot:spring-boot-starter-security'
    compileOnly 'org.springframework.boot:spring-boot-starter-oauth2-client'
    api 'org.springframework.boot:spring-boot-starter-webflux'
    compileOnly 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Both bring spring-ai-client-chat -> mcp-json-jackson2 -> json-schema-validator -> jackson-dataformat-yaml. Contexa
    // reads no YAML (the schema validator loads its YAML mapper only for YAML input), and the codec on the class path
    // makes Spring MVC offer application/yaml to the application, so it stays out.
    api('org.springframework.ai:spring-ai-advisors-vector-store') {
        exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-yaml'
    }
    api('org.springframework.ai:spring-ai-rag') {
        exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-yaml'
    }



    implementation 'io.micrometer:micrometer-registry-prometheus'

    // On the class path of an application they switch Boot's OpenTelemetry on: whoever wants the export declares them.
    compileOnly 'io.opentelemetry:opentelemetry-api:1.32.0'
    compileOnly 'io.opentelemetry:opentelemetry-sdk:1.32.0'
    compileOnly 'io.opentelemetry:opentelemetry-exporter-otlp:1.32.0'
    compileOnly 'io.opentelemetry.instrumentation:opentelemetry-reactor-3.1:1.32.0-alpha'
    testImplementation 'io.opentelemetry:opentelemetry-api:1.32.0'
    testImplementation 'io.opentelemetry:opentelemetry-sdk:1.32.0'
    testImplementation 'io.opentelemetry:opentelemetry-exporter-otlp:1.32.0'
    testImplementation 'io.opentelemetry.instrumentation:opentelemetry-reactor-3.1:1.32.0-alpha'

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    compileOnly("org.redisson:redisson:3.48.0")
    compileOnly("org.springframework.kafka:spring-kafka")
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    api 'net.javacrumbs.shedlock:shedlock-spring:5.16.0'
    api 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.16.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testFixturesImplementation 'org.junit.jupiter:junit-jupiter-api'
    testFixturesImplementation 'org.assertj:assertj-core'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    testImplementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    testImplementation 'org.awaitility:awaitility:4.2.0'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.springframework.ai:spring-ai-openai'
    testImplementation 'org.springframework.ai:spring-ai-anthropic'
    testImplementation 'org.springframework.ai:spring-ai-ollama'
    testImplementation 'org.springframework.ai:spring-ai-pgvector-store'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation 'org.redisson:redisson:3.48.0'
    testImplementation 'org.springframework.kafka:spring-kafka'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('processResources') {
    exclude 'static/soar-approval.html'
}
