enterprise.pqa.officialNarrative.metric.default.name=official verification metric
enterprise.pqa.officialNarrative.metric.default.purpose=Checks the evidence and prompt conditions required by an official verification metric.
enterprise.pqa.officialNarrative.metric.default.impact=If this metric fails, evidence is insufficient to issue a prompt-quality certificate.
enterprise.pqa.officialNarrative.metric.default.action=Strengthen the evidence producer and prompt-assembly path for the failed check.
enterprise.pqa.officialNarrative.metric.default.reverify=On reverification, the failed check must be stored as passing.
enterprise.pqa.officialNarrative.metric.eir.name=request-fact preservation
enterprise.pqa.officialNarrative.metric.eir.purpose=Checks whether user, tenant, resource, and authentication facts collected from the actual request retain the same meaning through sealed evidence and the final prompt.
enterprise.pqa.officialNarrative.metric.eir.impact=If request facts are not delivered accurately, the LLM may decide against a situation different from the actual request.
enterprise.pqa.officialNarrative.metric.eir.action=Align request-context and prompt-assembly values using the same identifiers.
enterprise.pqa.officialNarrative.metric.eir.reverify=Request facts in request evidence, sealed evidence, and the final prompt must match during reverification.
enterprise.pqa.officialNarrative.metric.ccr.name=context completeness
enterprise.pqa.officialNarrative.metric.ccr.purpose=Checks whether request, authentication, resource, baseline, and governance context required for the LLM decision is present.
enterprise.pqa.officialNarrative.metric.ccr.impact=Missing required context prevents the prompt-quality certificate from describing actual operating conditions completely.
enterprise.pqa.officialNarrative.metric.ccr.action=Identify each missing context producer and ensure the same value is stored in sealed evidence.
enterprise.pqa.officialNarrative.metric.ccr.reverify=All required context sections must be present during reverification.
enterprise.pqa.officialNarrative.metric.ccsr.name=context consistency
enterprise.pqa.officialNarrative.metric.ccsr.purpose=Checks that the same fact is not stored with different values in request evidence, sealed evidence, the final prompt, and the official ledger.
enterprise.pqa.officialNarrative.metric.ccsr.impact=Conflicting facts make the official result unusable for remediation and audit evidence.
enterprise.pqa.officialNarrative.metric.ccsr.action=Align field mappings across evidence capture, hash generation, and prompt assembly.
enterprise.pqa.officialNarrative.metric.ccsr.reverify=Request path, resource, user, tenant, and hash values must match across the same flow.
enterprise.pqa.officialNarrative.metric.pfr.name=prompt fidelity
enterprise.pqa.officialNarrative.metric.pfr.purpose=Checks whether the final LLM prompt follows the official template, contract version, hashes, sections, policy rules, and token budget.
enterprise.pqa.officialNarrative.metric.pfr.impact=Broken prompt contracts or source traceability prevent a certificate from representing the actual LLM input.
enterprise.pqa.officialNarrative.metric.pfr.action=Bring template, assembly, compression, and release metadata to an assurable version in prompt governance.
enterprise.pqa.officialNarrative.metric.pfr.reverify=There must be no prompt-contract violations and source-to-final prompt traceability must be present.
enterprise.pqa.officialNarrative.metric.mtr.name=verification traceability
enterprise.pqa.officialNarrative.metric.mtr.purpose=Checks whether request evidence, official runs, certificates, and remediation cases form one trace chain.
enterprise.pqa.officialNarrative.metric.mtr.impact=A broken trace chain prevents reproduction of the same facts in audit reports and reverification.
enterprise.pqa.officialNarrative.metric.mtr.action=Link packageId, aggregateRunId, officialRunId, certificate, and issue cases in the remediation workflow and official ledger.
enterprise.pqa.officialNarrative.metric.mtr.reverify=The official run, certificate, and remediation cases must all be traceable back from packageId.
enterprise.pqa.officialNarrative.metric.cor.name=context-contamination prevention
enterprise.pqa.officialNarrative.metric.cor.purpose=Checks that no other user, tenant, purpose, unauthorized document, or test path is mixed into final context.
enterprise.pqa.officialNarrative.metric.cor.impact=Contaminated context can make information outside the authorization scope part of the LLM decision evidence.
enterprise.pqa.officialNarrative.metric.cor.action=Strengthen tenant, user, resource, and purpose-scope validation evidence for retrieved results.
enterprise.pqa.officialNarrative.metric.cor.reverify=No out-of-scope document or test path may appear in the final prompt.
enterprise.pqa.officialNarrative.metric.rap.name=retrieved-document authorization consistency
enterprise.pqa.officialNarrative.metric.rap.purpose=Checks whether documents included in the final prompt are authorized for the current user and resource.
enterprise.pqa.officialNarrative.metric.rap.impact=Including documents without authorization evidence makes prompt-quality assurance bypass authorization verification.
enterprise.pqa.officialNarrative.metric.rap.action=Strengthen per-document allow evidence and permission-scope metadata.
enterprise.pqa.officialNarrative.metric.rap.reverify=Every document in final context must have an allow reason and permission scope.
enterprise.pqa.officialNarrative.metric.rpi.name=round-progression consistency
enterprise.pqa.officialNarrative.metric.rpi.purpose=Checks that key facts from a prior round do not disappear or regress across repeated requests and reverification.
enterprise.pqa.officialNarrative.metric.rpi.impact=Fact regression makes it impossible to distinguish real improvement from an accidental result.
enterprise.pqa.officialNarrative.metric.rpi.action=Compare prior evidence, learning context, and reverification execution paths using the same criteria.
enterprise.pqa.officialNarrative.metric.rpi.reverify=Differences in key facts between the prior and current round must be explainable.
enterprise.pqa.officialNarrative.metric.bma.name=baseline maturity
enterprise.pqa.officialNarrative.metric.bma.purpose=Checks whether user-baseline maturity reflects actual observation days, event count, coverage, and fallback ratio.
enterprise.pqa.officialNarrative.metric.bma.impact=Presenting an immature baseline as complete overstates the basis for normal and exceptional judgments.
enterprise.pqa.officialNarrative.metric.bma.action=Add observation depth and provisional-state reasons to learning context and baseline calculations.
enterprise.pqa.officialNarrative.metric.bma.reverify=Baseline maturity and observation evidence must agree without an overstated status.
enterprise.pqa.officialNarrative.metric.usns.name=user-specific novelty signal
enterprise.pqa.officialNarrative.metric.usns.purpose=Checks whether differences in time, network, browser, device, and request combination from the personal baseline appear in the prompt.
enterprise.pqa.officialNarrative.metric.usns.impact=Missing personal-baseline changes can make the LLM interpret an exceptional request as ordinary.
enterprise.pqa.officialNarrative.metric.usns.action=Represent user-baseline change signals in the prompt with the same names and meaning.
enterprise.pqa.officialNarrative.metric.usns.reverify=Baseline changes and reasons why comparison is unavailable must be stated in the final prompt.
enterprise.pqa.officialNarrative.metric.bsr.name=behavior-change explanation
enterprise.pqa.officialNarrative.metric.bsr.purpose=Checks whether session-flow, friction, and abrupt behavior changes are explained as decision-ready context in the prompt.
enterprise.pqa.officialNarrative.metric.bsr.impact=Without behavior explanations, the prompt loses the basis for distinguishing risk signals from normal exceptions.
enterprise.pqa.officialNarrative.metric.bsr.action=Add behavior-change signals and exception reasons to the session narrative.
enterprise.pqa.officialNarrative.metric.bsr.reverify=Behavior-change signals and their meaning must be explained in the final prompt.
enterprise.pqa.officialNarrative.metric.pre.name=protected-resource eligibility
enterprise.pqa.officialNarrative.metric.pre.purpose=Checks that the certificate target is an actual @Protectable resource and that template and actual request values are mapped separately and accurately.
enterprise.pqa.officialNarrative.metric.pre.impact=Treating a template resource as the actual resource can issue a certificate for the wrong target.
enterprise.pqa.officialNarrative.metric.pre.action=Store @Protectable template and actual request values separately and finalize the assurance-target mapping.
enterprise.pqa.officialNarrative.metric.pre.reverify=Template and actual resources must be separate and URL-variable mapping must be verified.
enterprise.pqa.officialNarrative.check.baselineCoverage.subject=baseline observation coverage
enterprise.pqa.officialNarrative.check.baselineCoverage.owner=learning-baseline producer
enterprise.pqa.officialNarrative.check.baselineCoverage.cause=The time, network, browser, and resource observation coverage needed to compare this request with a normal baseline was not stored.
enterprise.pqa.officialNarrative.check.baselineCoverage.action=Create baseline-remediation work and include coverage by time, network, browser, and resource in the baseline snapshot and final prompt.
enterprise.pqa.officialNarrative.check.baselineCoverage.reverify=The next request evidence must store baseline observation coverage and pass the baseline-maturity metric.
enterprise.pqa.officialNarrative.check.baselineObservation.subject=baseline observation period
enterprise.pqa.officialNarrative.check.baselineObservation.owner=learning-baseline producer
enterprise.pqa.officialNarrative.check.baselineObservation.cause=The number of days used to calculate the user baseline was not stored.
enterprise.pqa.officialNarrative.check.baselineObservation.action=Add the baseline observation period and record per-user observation days and calculation time in the baseline snapshot.
enterprise.pqa.officialNarrative.check.baselineObservation.reverify=The next request evidence must store observation days as a number and pass the official metric.
enterprise.pqa.officialNarrative.check.baselineEventCount.subject=baseline observation count
enterprise.pqa.officialNarrative.check.baselineEventCount.owner=learning-baseline producer
enterprise.pqa.officialNarrative.check.baselineEventCount.cause=The number of actual request observations used to calculate the baseline was not stored.
enterprise.pqa.officialNarrative.check.baselineEventCount.action=Add baseline observation count and include per-user event count and sample size in the calculation result.
enterprise.pqa.officialNarrative.check.baselineEventCount.reverify=The next request evidence must store observation count as a number and pass the official metric.
enterprise.pqa.officialNarrative.check.baselineFallback.subject=baseline default-dependency ratio
enterprise.pqa.officialNarrative.check.baselineFallback.owner=learning-baseline producer
enterprise.pqa.officialNarrative.check.baselineFallback.cause=The extent to which the baseline depends on defaults instead of actual observations was not stored.
enterprise.pqa.officialNarrative.check.baselineFallback.action=Add the fallback ratio and distinguish provisional from confirmed baselines.
enterprise.pqa.officialNarrative.check.baselineFallback.reverify=The next request evidence must store a fallback ratio within the permitted range.
enterprise.pqa.officialNarrative.check.baselineProvisional.subject=provisional baseline reason
enterprise.pqa.officialNarrative.check.baselineProvisional.owner=learning-baseline producer
enterprise.pqa.officialNarrative.check.baselineProvisional.cause=The reason for provisional baseline status was not stored, so insufficient learning cannot be distinguished from a prompt defect.
enterprise.pqa.officialNarrative.check.baselineProvisional.action=Record the provisional-baseline reason and reflect insufficient observations, a new user, or a new combination in the final prompt.
enterprise.pqa.officialNarrative.check.baselineProvisional.reverify=The next request evidence must store the provisional-baseline reason and pass the official metric.
enterprise.pqa.officialNarrative.check.baselineMaturity.subject=baseline maturity
enterprise.pqa.officialNarrative.check.baselineMaturity.owner=learning-baseline producer
enterprise.pqa.officialNarrative.check.baselineMaturity.cause=Baseline status was not shown to agree with actual observation volume, coverage, and default dependency.
enterprise.pqa.officialNarrative.check.baselineMaturity.action=Strengthen maturity-calculation evidence and combine observation days, count, coverage, and fallback ratio into one baseline snapshot.
enterprise.pqa.officialNarrative.check.baselineMaturity.reverify=The next request evidence must show baseline status and observation evidence at the same maturity level.
enterprise.pqa.officialNarrative.check.ragAuthorization.subject=retrieved-document authorization evidence
enterprise.pqa.officialNarrative.check.ragAuthorization.owner=retrieved-document authorization filter
enterprise.pqa.officialNarrative.check.ragAuthorization.cause=Sufficient evidence that the current user may access every retrieved document included in the final prompt was not stored.
enterprise.pqa.officialNarrative.check.ragAuthorization.action=Strengthen authorization evidence and finalize each document decision, permission scope, and inclusion status as prompt-input evidence.
enterprise.pqa.officialNarrative.check.ragAuthorization.reverify=The next request evidence must show an allow reason and permission scope for every included document.
enterprise.pqa.officialNarrative.check.promptContract.subject=prompt-contract violation
enterprise.pqa.officialNarrative.check.promptContract.owner=prompt-governance repository
enterprise.pqa.officialNarrative.check.promptContract.cause=The final prompt contains violations of the official template and contract rules.
enterprise.pqa.officialNarrative.check.promptContract.action=Resolve template-contract violations and promote a prompt version with zero violations.
enterprise.pqa.officialNarrative.check.promptContract.reverify=The next request evidence must store a prompt-contract violation count of zero.
enterprise.pqa.officialNarrative.check.promptBudget.subject=prompt token budget
enterprise.pqa.officialNarrative.check.promptBudget.owner=prompt assembler
enterprise.pqa.officialNarrative.check.promptBudget.cause=The final prompt exceeded the allowed token budget or budget-calculation evidence was not stored.
enterprise.pqa.officialNarrative.check.promptBudget.action=Adjust per-section token use and store budget-calculation results in sealed evidence.
enterprise.pqa.officialNarrative.check.promptBudget.reverify=The next request evidence must have no token-budget overrun.
enterprise.pqa.officialNarrative.check.behaviorFriction.subject=behavior-friction explanation
enterprise.pqa.officialNarrative.check.behaviorFriction.owner=behavior-context producer
enterprise.pqa.officialNarrative.check.behaviorFriction.cause=Friction signals such as additional verification, delay, or repeated attempts were not stored as explainable context.
enterprise.pqa.officialNarrative.check.behaviorFriction.action=Strengthen the friction profile, explain whether signals are normal exceptions or risks, and include the explanation in the final prompt.
enterprise.pqa.officialNarrative.check.behaviorFriction.reverify=The next request evidence must store both the friction profile and explanation and pass the behavior metric.
enterprise.pqa.officialNarrative.check.behaviorSurprise.subject=behavior-change signal explanation
enterprise.pqa.officialNarrative.check.behaviorSurprise.owner=behavior-context producer
enterprise.pqa.officialNarrative.check.behaviorSurprise.cause=Behavior changes from the normal session flow were not explained in a form that can be interpreted in the final prompt.
enterprise.pqa.officialNarrative.check.behaviorSurprise.action=Strengthen behavior-change signals and exception reasons and include the generated session narrative in the final prompt.
enterprise.pqa.officialNarrative.check.behaviorSurprise.reverify=The next request evidence must preserve the same meaning across behavior signals, exception reasons, and final-prompt explanation.
enterprise.pqa.officialNarrative.check.missingKnowledge.subject=required-context deficiency declaration
enterprise.pqa.officialNarrative.check.missingKnowledge.owner=context assembler
enterprise.pqa.officialNarrative.check.missingKnowledge.cause=The prompt explicitly declares missing required context, so the gap must be classified before certificate issuance.
enterprise.pqa.officialNarrative.check.missingKnowledge.action=Identify the missing context producer and classify the gap as an acceptable learning gap or a defect requiring remediation.
enterprise.pqa.officialNarrative.check.missingKnowledge.reverify=The required-context deficiency declaration must disappear or be classified as an acceptable gap.
enterprise.pqa.officialNarrative.check.uncertainty.subject=uncertainty marker
enterprise.pqa.officialNarrative.check.uncertainty.owner=context assembler
enterprise.pqa.officialNarrative.check.uncertainty.cause=Unknown or insufficient-evidence markers remain in prompt input, so unresolved facts must be isolated.
enterprise.pqa.officialNarrative.check.uncertainty.action=Break down unresolved fields and classify each as remediation, approved exception, or awaiting learning.
enterprise.pqa.officialNarrative.check.uncertainty.reverify=Uncertainty markers must be removed or classified as an acceptable operating state.
enterprise.pqa.officialNarrative.check.provisionalEvidence.subject=provisional-evidence overstatement prevention
enterprise.pqa.officialNarrative.check.provisionalEvidence.owner=learning-baseline producer
enterprise.pqa.officialNarrative.check.provisionalEvidence.cause=Provisional or learning evidence may be represented in the prompt as confirmed evidence.
enterprise.pqa.officialNarrative.check.provisionalEvidence.action=Separate provisional from confirmed evidence and clearly state learning status and reason in the prompt.
