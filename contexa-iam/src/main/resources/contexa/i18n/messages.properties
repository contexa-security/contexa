zt.console.glossary.title=Terms
zt.console.glossary.decision.label=Decision
zt.console.glossary.decision.help=A request newly put to the model whose final action was set. A retry, a judgement again and a timeout count with the original decision, never on their own.
zt.console.glossary.noDecision.label=No decision
zt.console.glossary.noDecision.help=A protected call without a new decision: a valid decision answered it, the analysis skipped it for a reason, or a technical failure left it undecided.
zt.console.glossary.coverage.label=Protection coverage
zt.console.glossary.coverage.help=The protected calls a decision answered, new or still valid, out of all protected calls (methods marked @Protectable and AuthZEN evaluations).
zt.console.glossary.reuse.label=Reuse of a valid decision
zt.console.glossary.reuse.help=A decision in force (an allow, a step-up, a hold or a block that has not expired) answered the call without asking the model again.
zt.console.glossary.stopped.label=Stopped request
zt.console.glossary.stopped.help=A decision whose final action is a step-up, a review hold or a block. In SHADOW it is a request ENFORCE would have stopped.
zt.console.glossary.timing.label=When it applies
zt.console.glossary.timing.help=Before the response for a synchronous method; from the next request for an asynchronous one, whose first request has already gone through.
zt.console.glossary.hypothesis.label=Explanations weighed (H1 to H5)
zt.console.glossary.hypothesis.help=The model weighs five explanations: the owner doing their own work, account takeover, insider misuse, automation or a mistake, and other. The most likely one is the suspicion type.
zt.console.glossary.source.label=Who set the action
zt.console.glossary.source.help=The model (its action applied as it was), the engine (it changed the action of the model) or no model (the model gave no usable answer).
zt.console.glossary.engineChanged.label=Changed by the engine
zt.console.glossary.engineChanged.help=The second analysis ended a review hold with a step-up, the escalation protection stepped in, or a stricter action already in force was kept. Engine terms: Layer2 ESCALATE termination, escalate protection, kept stricter.
zt.console.glossary.modelLess.label=Set without the model
zt.console.glossary.modelLess.help=The model timed out, was unavailable or answered in no usable form, so the engine set a safe action. Engine terms: technical fallback, contract fallback.
zt.console.glossary.firstLayer.label=First analysis
zt.console.glossary.firstLayer.help=The analysis every decision starts with (engine term: Layer1). When its result is not a review hold it is final.
zt.console.glossary.secondLayer.label=Second analysis
zt.console.glossary.secondLayer.help=The analysis a review hold of the first goes on to (engine term: Layer2), with the first analysis and more past records.
zt.console.glossary.baseline.label=Baseline
zt.console.glossary.baseline.help=What the user usually does, learned from allowed requests. Established after 20 learned requests over at least 5 days with few new values.
zt.console.glossary.context.label=Context level
zt.console.glossary.context.help=How much the application tells: the environment only, the identity, the business scope, or the business records (approvals, tickets, on-call).
zt.console.glossary.unknownFact.label=Unknown fact
zt.console.glossary.unknownFact.help=A fact the model was told it does not know: not connected to Contexa, or not available at that moment.
zt.console.glossary.shadow.label=SHADOW
zt.console.glossary.shadow.help=Decides every request as ENFORCE does and applies nothing. Its numbers are what ENFORCE would have done.
zt.console.glossary.enforce.label=ENFORCE
zt.console.glossary.enforce.help=Decides and applies: a step-up asks the user to verify, a hold waits for review, a block stops the account until released.
zt.console.glossary.review.label=Administrator review
zt.console.glossary.review.help=Administrators rate the decisions of the review queue valid or not valid: the daily sample (a random sample of stopped decisions, the allowed decisions with a sign they may be misses, and a random sample of allowed decisions), rule broken (a model answer that broke a decision rule) and would have blocked (a block SHADOW would have made). It is the one direct measure of accuracy without a known answer.

