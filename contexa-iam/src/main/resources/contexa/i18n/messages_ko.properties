zt.console.reason.NO_DECISIONS=이 기간에 판정이 없습니다.
zt.console.reason.EMPTY_DENOMINATOR=이 기간에 비교할 대상이 없습니다.
zt.console.reason.TENANT_FILTERED=모든 테넌트를 합쳐서만 셉니다. 테넌트 하나로는 보여 드리지 않습니다.
zt.console.reason.NOT_RECORDED=Contexa 가 기록하지 않는 값입니다.
zt.console.reason.NO_PRICE=토큰 단가를 설정하면 추정 비용이 보입니다.
zt.console.reason.NO_SYNCHRONOUS_DECISIONS=이 기간에 동기 판정이 없어 기다린 사용자가 없습니다.
zt.console.reason.NOT_MEASURED=이 기간의 판정은 이 시간을 기록하기 전에 저장되었습니다.
zt.console.glossary.title=용어
zt.console.glossary.decision.label=판정
zt.console.glossary.decision.help=모델에 새로 물어 최종 조치가 정해진 요청입니다. 재시도·다시 판정·시간 초과는 원래 판정 하나로 세고, 따로 세지 않습니다.
zt.console.glossary.noDecision.label=판정 없음
zt.console.glossary.noDecision.help=새 판정이 없는 보호 호출입니다. 유효한 판정이 답했거나, 분석이 사유가 있어 건너뛰었거나, 기술 실패로 판정하지 못한 경우입니다.
zt.console.glossary.coverage.label=보호 범위
zt.console.glossary.coverage.help=보호 호출(@Protectable 메서드와 AuthZEN 평가) 가운데 판정(새 판정 또는 아직 유효한 판정)이 답한 비율입니다.
zt.console.glossary.reuse.label=유효한 판정 재사용
zt.console.glossary.reuse.help=아직 만료되지 않은 판정(허용·추가 인증·보류·차단)이 모델에 다시 묻지 않고 호출에 답한 경우입니다.
zt.console.glossary.stopped.label=멈춘 요청
zt.console.glossary.stopped.help=최종 조치가 추가 인증·보류·차단인 판정입니다. SHADOW 에서는 ENFORCE 였다면 멈췄을 요청입니다.
zt.console.glossary.timing.label=적용 시점
zt.console.glossary.timing.help=동기 메서드는 응답 전에, 비동기 메서드는 다음 요청부터 적용됩니다. 비동기의 첫 요청은 이미 처리된 뒤입니다.
zt.console.glossary.hypothesis.label=따져 본 설명(H1~H5)
zt.console.glossary.hypothesis.help=모델은 정상 업무, 계정 탈취, 내부자 오용, 자동화·실수, 기타의 다섯 가지 설명을 따집니다. 가장 유력한 설명이 의심 유형입니다.
zt.console.glossary.source.label=판정 출처
zt.console.glossary.source.help=모델이 정함(모델 조치를 그대로 적용), 엔진이 바꿈(엔진이 모델 조치를 바꿈), 모델 없이 정함(모델이 쓸 수 있는 답을 내지 않음) 가운데 하나입니다.
zt.console.glossary.engineChanged.label=엔진이 바꾼 판정
zt.console.glossary.engineChanged.help=2차 판단이 보류를 추가 인증으로 끝냈거나, 과부하 보호가 들어갔거나, 이미 걸린 더 엄격한 조치를 유지한 경우입니다. 엔진 용어: Layer2 ESCALATE 종결, 과부하 보호, KEPT_STRICTER.
zt.console.glossary.modelLess.label=모델 없이 정한 판정
zt.console.glossary.modelLess.help=모델이 시간 안에 답하지 않았거나, 쓸 수 없었거나, 쓸 수 없는 형식으로 답해 엔진이 안전한 조치를 정한 경우입니다. 엔진 용어: 기술 대체, 계약 위반 대체.
zt.console.glossary.firstLayer.label=1차 판단
zt.console.glossary.firstLayer.help=모든 판정이 시작하는 분석입니다(엔진 용어: Layer1). 결과가 보류가 아니면 그대로 최종입니다.
zt.console.glossary.secondLayer.label=2차 판단
zt.console.glossary.secondLayer.help=1차 판단이 보류일 때 이어지는 분석입니다(엔진 용어: Layer2). 1차 판단과 과거 기록을 더 받습니다.
zt.console.glossary.baseline.label=기준선
zt.console.glossary.baseline.help=허용된 요청에서 배운 사용자의 평소 행동입니다. 5일 이상에 걸쳐 20건 넘게 배우고 새 값이 적으면 확정됩니다.
zt.console.glossary.context.label=컨텍스트 수준
zt.console.glossary.context.help=앱이 넘겨주는 정보의 수준입니다. 환경만, 신원까지, 업무 범위까지, 업무 기록(승인·티켓·당직)까지의 네 단계가 있습니다.
zt.console.glossary.unknownFact.label=모르는 사실
zt.console.glossary.unknownFact.help=모델에게 알 수 없다고 넘어간 사실입니다. Contexa 에 연동되지 않았거나, 그 순간 가져오지 못한 경우입니다.
zt.console.glossary.shadow.label=SHADOW
zt.console.glossary.shadow.help=ENFORCE 와 똑같이 판정하되 적용하지 않습니다. SHADOW 의 숫자는 ENFORCE 였다면 일어났을 일입니다.
zt.console.glossary.enforce.label=ENFORCE
zt.console.glossary.enforce.help=판정하고 적용합니다. 추가 인증은 본인 확인을 요구하고, 보류는 검토를 기다리고, 차단은 풀 때까지 계정을 멈춥니다.
zt.console.glossary.review.label=관리자 검토
zt.console.glossary.review.help=관리자가 검토 대기열의 판정을 타당·부당으로 평가합니다. 대기열에는 일일 표본(멈춘 판정에서 매일 무작위로 뽑음), 규칙 위반(모델 답이 판정 규칙을 어김), 차단했을 판정(SHADOW 가 차단했을 판정)이 들어갑니다. 정답이 없는 운영에서 정확도를 재는 유일한 직접 방법입니다.

