enterprise.pqa.runtimeEvidence.badge.confirmNeeded=확인 필요
enterprise.pqa.runtimeEvidence.dt.decision=판정
enterprise.pqa.runtimeEvidence.title.shortageSignals=프롬프트 컨텍스트 신호
enterprise.pqa.runtimeEvidence.shortageSignals.help=봉인된 사용자 프롬프트에서 고정 규칙으로 찾아낸 검사 전 신호입니다. 결론이 아니라, 공식 검사가 어떤 컨텍스트 생성기와 기준선을 검증해야 하는지 알려 줍니다.
enterprise.pqa.runtimeEvidence.title.preflight=공식 검사 입력 관문
enterprise.pqa.runtimeEvidence.preflight.help=이 단계는 품질 판정이 아닙니다. 봉인 증거가 최종 LLM 시스템·사용자 프롬프트와 해시를 대표하는지만 확인합니다. UNKNOWN이나 PROVISIONAL 같은 컨텍스트 값은 지표 12개 검사에서만 품질 문제가 됩니다.
enterprise.pqa.runtimeEvidence.preflight.ready=공식 검사 준비됨
enterprise.pqa.runtimeEvidence.preflight.readyDetail=봉인 증거가 최종 LLM 프롬프트와 연결되어 있습니다. 다음으로 지표 12개를 실행해 실제 프롬프트 품질을 판정하십시오.
enterprise.pqa.runtimeEvidence.preflight.checks=입력 점검
enterprise.pqa.runtimeEvidence.preflight.blocking=차단 항목
enterprise.pqa.runtimeEvidence.preflight.blockingTitle=공식 검사를 실행하기 전에 고칠 항목
enterprise.pqa.runtimeEvidence.signal.empty=찾아낸 프롬프트 컨텍스트 신호가 없습니다.
enterprise.pqa.runtimeEvidence.signal.category.MISSING_CONTEXT=근거 누락
enterprise.pqa.runtimeEvidence.signal.category.MISSING_CONTEXT.description=프롬프트가 빠진 사실, 구역, 컨텍스트 생성기 출력을 직접 선언합니다.
enterprise.pqa.runtimeEvidence.signal.category.BASELINE_MISMATCH=기준선 불일치
enterprise.pqa.runtimeEvidence.signal.category.BASELINE_MISMATCH.description=현재 요청이 관찰된 개인 기준선이나 직접 비교할 수 있는 이력과 맞지 않습니다. 정보 누락과 따로 점검하십시오.
enterprise.pqa.runtimeEvidence.signal.category.PROVISIONAL_EVIDENCE=임시 증거
enterprise.pqa.runtimeEvidence.signal.category.PROVISIONAL_EVIDENCE.description=업무 프로필, 역할 범위, 권한 근거가 아직 확정되지 않았습니다.
enterprise.pqa.runtimeEvidence.signal.category.UNCERTAINTY_MARKER=불확실성 표시
enterprise.pqa.runtimeEvidence.signal.category.UNCERTAINTY_MARKER.description=UNKNOWN이나 INSUFFICIENT 같은 예약 값이 프롬프트에 남아 있습니다. 공식 검사는 이를 필드별로 나눠야 합니다.
enterprise.pqa.runtimeEvidence.signal.category.OTHER=기타 신호
enterprise.pqa.runtimeEvidence.signal.category.OTHER.description=아직 구조화된 분류에 매핑되지 않은 프롬프트 컨텍스트 신호입니다.
enterprise.pqa.runtimeEvidence.signal.explicitMissingKnowledge=명시적인 컨텍스트 빈틈 구역이 있습니다.
enterprise.pqa.runtimeEvidence.signal.explicitMissingKnowledge.rule=사용자 프롬프트에 구역 표시 === EXPLICIT MISSING KNOWLEDGE가 있습니다.
enterprise.pqa.runtimeEvidence.signal.explicitMissingKnowledge.evidence=일치한 표시: === EXPLICIT MISSING KNOWLEDGE
enterprise.pqa.runtimeEvidence.signal.explicitMissingKnowledge.explanation=프롬프트 조립이 필요한 컨텍스트 일부가 빠졌다고 직접 선언합니다.
enterprise.pqa.runtimeEvidence.signal.explicitMissingKnowledge.impact=공식 검사는 허용할 수 있는 학습 상태의 불확실성과 프롬프트 결함 또는 컨텍스트 생성기 출력 누락을 구분해야 합니다.
enterprise.pqa.runtimeEvidence.signal.explicitMissingKnowledge.next=어떤 컨텍스트 생성기가 사실을 빠뜨렸는지 확인한 뒤 요청 컨텍스트나 학습 컨텍스트 출처를 보강하십시오.
enterprise.pqa.runtimeEvidence.signal.missingCriticalFacts=핵심 컨텍스트 사실이 빠졌다고 선언되어 있습니다.
enterprise.pqa.runtimeEvidence.signal.missingCriticalFacts.rule=프롬프트에 missingCriticalFacts가 있고 그 값이 빈 목록이 아닙니다.
enterprise.pqa.runtimeEvidence.signal.missingCriticalFacts.evidence=일치한 필드: missingCriticalFacts가 비어 있지 않음
enterprise.pqa.runtimeEvidence.signal.missingCriticalFacts.explanation=프롬프트가 품질에 중요하지만 제공되지 않은 사실을 이름으로 밝힙니다.
enterprise.pqa.runtimeEvidence.signal.missingCriticalFacts.impact=공식 검사는 빠진 사실이 요청 컨텍스트, RAG, 기준선, 인가 데이터 중 어디에 속하는지 가려내야 합니다.
enterprise.pqa.runtimeEvidence.signal.missingCriticalFacts.next=프롬프트 비교와 공식 지표 상세로 빠진 사실마다 생성기와 보완 조치를 연결하십시오.
enterprise.pqa.runtimeEvidence.signal.accessHourOutsideObserved=접근 시각이 관찰된 기준선을 벗어났습니다.
enterprise.pqa.runtimeEvidence.signal.accessHourOutsideObserved.rule=프롬프트에 currentAccessHourPresentInObservedHours: false가 있습니다.
enterprise.pqa.runtimeEvidence.signal.accessHourOutsideObserved.evidence=일치한 필드: currentAccessHourPresentInObservedHours=false
enterprise.pqa.runtimeEvidence.signal.accessHourOutsideObserved.explanation=현재 요청 시각이 사용자의 관찰된 평소 접근 시간 기준선과 맞지 않습니다.
enterprise.pqa.runtimeEvidence.signal.accessHourOutsideObserved.impact=정보가 빠진 것이 아니라 기준선 불일치 신호입니다. 공식 검사는 덜 쌓인 기준선과 정당한 예외 요청을 구분해야 합니다.
enterprise.pqa.runtimeEvidence.signal.accessHourOutsideObserved.next=기준선이 불완전한지, 사용자에게 정당한 예외가 있는지, 요청에 추가 인증이 필요한지 확인하십시오.
enterprise.pqa.runtimeEvidence.signal.networkOutsideObserved=네트워크가 관찰된 기준선을 벗어났습니다.
enterprise.pqa.runtimeEvidence.signal.networkOutsideObserved.rule=프롬프트에 currentNetworkPresentInObservedNetworks: false가 있습니다.
enterprise.pqa.runtimeEvidence.signal.networkOutsideObserved.evidence=일치한 필드: currentNetworkPresentInObservedNetworks=false
enterprise.pqa.runtimeEvidence.signal.networkOutsideObserved.explanation=현재 요청 네트워크가 사용자의 관찰된 네트워크 기준선과 맞지 않습니다.
enterprise.pqa.runtimeEvidence.signal.networkOutsideObserved.impact=사실 누락이라는 결론이 아니라 기준선 불일치입니다. 공식 검사는 부족한 수집, 신뢰 네트워크 분류, 정당한 예외 사례를 구분해야 합니다.
enterprise.pqa.runtimeEvidence.signal.networkOutsideObserved.next=관찰된 네트워크 범위, 신뢰 네트워크 분류, 정당한 예외를 기록해야 하는지 확인하십시오.
enterprise.pqa.runtimeEvidence.signal.browserOutsideObserved=브라우저가 관찰된 기준선을 벗어났습니다.
enterprise.pqa.runtimeEvidence.signal.browserOutsideObserved.rule=프롬프트에 currentBrowserPresentInObservedBrowsers: false가 있습니다.
enterprise.pqa.runtimeEvidence.signal.browserOutsideObserved.evidence=일치한 필드: currentBrowserPresentInObservedBrowsers=false
enterprise.pqa.runtimeEvidence.signal.browserOutsideObserved.explanation=브라우저 증거가 사용자의 관찰된 브라우저 기준선과 맞지 않습니다.
enterprise.pqa.runtimeEvidence.signal.browserOutsideObserved.impact=기준선이 바뀌었거나 학습 컨텍스트가 덜 쌓였다는 뜻입니다. 단독 인가 결함으로 표시하지 않습니다.
enterprise.pqa.runtimeEvidence.signal.browserOutsideObserved.next=브라우저 기준선 수집, 기기 지문 연속성, 관찰 프로필을 갱신해야 하는지 확인하십시오.
enterprise.pqa.runtimeEvidence.signal.noDirectPersonalComparable=직접 비교할 수 있는 개인 요청이 없습니다.
enterprise.pqa.runtimeEvidence.signal.noDirectPersonalComparable.rule=프롬프트에 currentRequestCombinationEvidenceScope: NO_DIRECT_PERSONAL_COMPARABLE이 있습니다.
enterprise.pqa.runtimeEvidence.signal.noDirectPersonalComparable.evidence=일치한 필드: currentRequestCombinationEvidenceScope=NO_DIRECT_PERSONAL_COMPARABLE
enterprise.pqa.runtimeEvidence.signal.noDirectPersonalComparable.explanation=사용자의 개인 비교 이력에서 정확히 같은 요청 조합을 찾지 못했습니다.
enterprise.pqa.runtimeEvidence.signal.noDirectPersonalComparable.impact=프롬프트는 그대로 검사할 수 있지만, 기준선으로는 이 조합이 정상이라고 증명할 수 없습니다.
enterprise.pqa.runtimeEvidence.signal.noDirectPersonalComparable.next=비교 이력 수집이 덜 되었는지, 이 요청에 새로 승인된 기준선 표본이 필요한지 확인하십시오.
enterprise.pqa.runtimeEvidence.signal.workProfileProvisional=업무 프로필 증거가 임시로 조립되었습니다.
enterprise.pqa.runtimeEvidence.signal.workProfileProvisional.rule=프롬프트에 workProfileEvidenceState: PROVISIONAL이 있습니다.
enterprise.pqa.runtimeEvidence.signal.workProfileProvisional.evidence=일치한 필드: workProfileEvidenceState=PROVISIONAL
enterprise.pqa.runtimeEvidence.signal.workProfileProvisional.explanation=개인 업무 프로필이 학습 중이거나 아직 확정되지 않은 기준선으로 조립되었습니다.
enterprise.pqa.runtimeEvidence.signal.workProfileProvisional.impact=공식 검사는 허용할 수 있는 학습 상태의 불확실성과 프롬프트 품질 결함을 구분해야 합니다.
enterprise.pqa.runtimeEvidence.signal.workProfileProvisional.next=기준선 관찰 횟수, 포함된 일수, 대체 처리 비율, 학습 표본이 더 필요한지 확인하십시오.
enterprise.pqa.runtimeEvidence.signal.roleScopeProvisional=역할 범위 증거가 임시로 조립되었습니다.
enterprise.pqa.runtimeEvidence.signal.roleScopeProvisional.rule=프롬프트에 roleScopeEvidenceState: PROVISIONAL이 있습니다.
enterprise.pqa.runtimeEvidence.signal.roleScopeProvisional.evidence=일치한 필드: roleScopeEvidenceState=PROVISIONAL
enterprise.pqa.runtimeEvidence.signal.roleScopeProvisional.explanation=역할과 권한 범위 증거가 임시이거나 아직 확정되지 않은 근거로 조립되었습니다.
enterprise.pqa.runtimeEvidence.signal.roleScopeProvisional.impact=임시 권한 증거가 확정된 것처럼 보이면 프롬프트 품질과 보증 준비 상태가 과장될 수 있습니다.
enterprise.pqa.runtimeEvidence.signal.roleScopeProvisional.next=이 리소스를 승격하기 전에 IAM 역할, 권한, 위임 증거 수집을 확인하십시오.
enterprise.pqa.runtimeEvidence.signal.unknownOrInsufficient=불확실성 표시가 있습니다.
enterprise.pqa.runtimeEvidence.signal.unknownOrInsufficient.rule=프롬프트에 예약된 불확실성 값인 UNKNOWN이나 INSUFFICIENT가 있습니다.
enterprise.pqa.runtimeEvidence.signal.unknownOrInsufficient.evidence=일치한 표시: UNKNOWN 또는 INSUFFICIENT
enterprise.pqa.runtimeEvidence.signal.unknownOrInsufficient.explanation=프롬프트 구역 하나 이상이 증거를 알 수 없거나 부족하다고 말합니다.
