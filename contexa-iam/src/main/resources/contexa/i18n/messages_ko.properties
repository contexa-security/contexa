enterprise.pqa.runtimeEvidence.detailSuccess.title=상세를 불러왔습니다
enterprise.pqa.runtimeEvidence.detailSuccess.detail=공식 검사 입력 전제 조건과 프롬프트 수집 상태를 확인하십시오.
enterprise.pqa.runtimeEvidence.detailFailed.title=상세를 불러오지 못했습니다
enterprise.pqa.runtimeEvidence.dt.evidenceId=증거 ID
enterprise.pqa.runtimeEvidence.dt.request=요청
enterprise.pqa.runtimeEvidence.dt.promptCapture=프롬프트 수집
