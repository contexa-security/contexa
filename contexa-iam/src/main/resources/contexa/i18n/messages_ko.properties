enterprise.pqa.runtimeEvidence.empty.filterMessage=조건에 맞는 봉인 증거가 없습니다. 필터가 맞지 않을 가능성이 높으니 기간, 테넌트, 사용자, 리소스 필터를 줄이고 다시 검색하십시오.
enterprise.pqa.runtimeEvidence.empty.noFilterMessage=최근 봉인 증거가 없습니다. 실제 보호 리소스 요청이 없었거나, 엔진 코어 수신이 늦었거나, 저장에 실패했을 가능성을 확인한 뒤 다시 검색하십시오.
enterprise.pqa.runtimeEvidence.detail.emptyAlt=검색 결과에서 증거를 고르면 봉인 상태와 프롬프트 미리보기가 표시됩니다.
