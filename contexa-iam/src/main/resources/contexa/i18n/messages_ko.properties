zt.console.ui.band.shadow=SHADOW 는 판정만 하고 적용하지 않습니다. '멈춘 요청'은 적용했다면 멈췄을 요청입니다.
zt.console.ui.band.standalone=standalone 모드입니다. 현재 조치와 기준선이 메모리에 있어 재시작하면 사라집니다.
