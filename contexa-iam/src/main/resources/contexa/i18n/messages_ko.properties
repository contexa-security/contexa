zt.console.metric.coverage.description=보호 호출 가운데 판정(새 판정 또는 아직 유효한 판정)이 답한 비율. 모든 테넌트를 합쳐 셉니다.
zt.console.metric.noDecision.label=판정 없음
zt.console.metric.noDecision.description=새 판정이 없는 보호 호출: 유효한 판정 재사용, 분석 생략(사유별), 기술 실패.
zt.console.metric.stopped.label=멈춘 요청
zt.console.metric.stopped.description=최종 조치가 추가 인증·보류·차단인 판정의 비율. SHADOW 에서는 적용했다면 멈췄을 요청입니다.
zt.console.metric.stoppedBeforeResponse.label=응답 전 적용
zt.console.metric.stoppedBeforeResponse.description=멈춘 판정 가운데 응답 전에(동기) 정한 비율. 나머지는 다음 요청부터 적용됩니다.
zt.console.metric.challengesPerUserWeek.label=1인 주당 추가 인증
zt.console.metric.challengesPerUserWeek.description=추가 인증 수를 기간에 판정받은 사용자 수와 주 수로 나눈 값.
zt.console.metric.challengePass.label=추가 인증 통과율
zt.console.metric.challengePass.description=추가 인증을 요구받은 뒤 계정 주인이 통과한 비율. 실패·만료·포기는 따로 셉니다.
zt.console.metric.userWaitP50.label=사용자 대기(중앙값)
zt.console.metric.userWaitP50.description=동기 판정에서 사용자가 응답을 기다린 시간의 중앙값.
zt.console.metric.userWaitP95.label=사용자 대기(상위 5%)
zt.console.metric.userWaitP95.description=동기 판정에서 사용자가 응답을 기다린 시간의 95번째 백분위.
zt.console.metric.blockRelease.label=차단 해제율
zt.console.metric.blockRelease.description=차단 가운데 관리자가 풀어 준 비율. 차단이 과했다는 신호입니다.
zt.console.metric.modelDecided.label=모델이 정한 판정
zt.console.metric.modelDecided.description=모델이 답했고 그 조치가 그대로 시행된 판정의 비율.
zt.console.metric.engineChanged.label=엔진이 바꾼 판정
zt.console.metric.engineChanged.description=모델 제안과 최종 조치가 다른 판정의 비율: 2차 판단의 보류 종결, 과부하 보호, 더 엄격한 조치 유지.
zt.console.metric.modelLess.label=모델 없이 정한 판정
zt.console.metric.modelLess.description=모델이 쓸 수 있는 답을 내지 않아 엔진이 정한 판정의 비율(시간 초과, 모델 불가, 형식 불가, 계약 위반 대체).
zt.console.metric.baselineEstablished.label=기준선 확정 판정
zt.console.metric.baselineEstablished.description=개인 기준선이 확정된(학습 20건·5일 이상) 사용자의 판정 비율.
zt.console.metric.reviewValid.label=관리자 검토 타당
zt.console.metric.reviewValid.description=관리자가 검토한 판정 가운데 타당하다고 평가한 비율과 95% 범위.
zt.console.metric.codeRequests.label=코드 요청
zt.console.metric.codeRequests.description=추가 인증 코드를 메일로 받은 판정 수입니다. 패스키·인증 앱처럼 메일 코드가 없는 방식은 세지 않습니다.
zt.console.metric.releaseMedian.label=해제까지(중앙값)
zt.console.metric.releaseMedian.description=차단부터 관리자가 풀기까지 걸린 시간의 중앙값으로, 기간에 내린 차단 가운데 해제된 것을 셉니다. 시간별 집계의 해제 시간 구간(15분·30분·1·2·4·8·24·72시간·7일)으로 센 값이라 구간으로 보입니다(짝수 개면 가운데 두 값 중 앞의 값).
zt.console.ui.releaseBucket.0=15분 이하
zt.console.ui.releaseBucket.1=15~30분 사이
zt.console.ui.releaseBucket.2=30분~1시간 사이
zt.console.ui.releaseBucket.3=1~2시간 사이
zt.console.ui.releaseBucket.4=2~4시간 사이
zt.console.ui.releaseBucket.5=4~8시간 사이
zt.console.ui.releaseBucket.6=8~24시간 사이
zt.console.ui.releaseBucket.7=24~72시간 사이
zt.console.ui.releaseBucket.8=72시간~7일 사이
zt.console.ui.releaseBucket.9=7일 넘음
zt.console.metric.burdenMedianPerWeek.label=사용자 부담(중앙값)
zt.console.metric.burdenMedianPerWeek.description=판정 대상 사용자 1인이 주당 받은 추가 인증 수의 중앙값.
zt.console.metric.burdenP95PerWeek.label=사용자 부담(상위 5%)
zt.console.metric.burdenP95PerWeek.description=판정 대상 사용자 1인이 주당 받은 추가 인증 수의 95번째 백분위.
zt.console.metric.corrected.label=계약 위반 교정
zt.console.metric.corrected.description=답이 출력 계약을 어겨 다시 물은 판정의 비율.
zt.console.metric.formatFallback.label=형식 대체
zt.console.metric.formatFallback.description=조치가 쓸 수 없는 형식이라 엔진이 정한 판정의 비율.
zt.console.metric.contractFallback.label=계약 위반 대체
zt.console.metric.contractFallback.description=다시 물은 뒤에도 계약을 어겨 대체 조치가 들어간 판정의 비율.
zt.console.metric.observedDecisions.label=관찰 기간·판정 수
zt.console.metric.observedDecisions.description=SHADOW 를 시작한 뒤의 판정 수.
zt.console.metric.businessContext.label=업무 기록 연동 판정
zt.console.metric.businessContext.description=업무 기록(승인·티켓·당직)이 연동된 판정의 비율. 판정 품질을 높입니다.
zt.console.metric.protectedPerMinute.label=보호 호출/분
zt.console.metric.protectedPerMinute.description=기간의 보호 호출 수를 분으로 나눈 값. 모든 노드를 합칩니다.
zt.console.metric.decisionsPerMinute.label=판정/분
zt.console.metric.decisionsPerMinute.description=기간의 판정 수를 분으로 나눈 값.
zt.console.metric.tokensPerDecision.label=판정당 토큰
zt.console.metric.tokensPerDecision.description=입력·출력 토큰 합을 판정 수로 나눈 값.
zt.console.metric.callsPerDecision.label=판정당 모델 호출
zt.console.metric.callsPerDecision.description=모델 호출 수(단계마다 1번, 교정 재질문마다 1번)를 판정 수로 나눈 값.
zt.console.metric.costPerDay.label=하루 추정 비용
zt.console.metric.costPerDay.description=기간의 토큰을 설정한 단가로 계산한 하루 비용. 단가를 설정하지 않으면 보이지 않습니다.
zt.console.alert.unreviewedBlocks=관리자가 검토하지 않은 차단 {0}건
zt.console.alert.modelLessRising=모델 없이 정한 판정이 최근 24시간 {0}건으로, 그 전날({1}건)보다 크게 늘었습니다(주된 원인: {2})
zt.console.alert.baselineNotEstablished=판정의 {0}% 가 기준선이 확정되지 않은 상태에서 내려졌습니다
zt.console.alert.notIntegrated=모델이 가장 자주 모른 사실: {0} ({1}건)
zt.console.action.ALLOW=허용했습니다
zt.console.action.CHALLENGE=추가 인증을 요구했습니다
zt.console.action.ESCALATE=검토로 보류했습니다
zt.console.action.BLOCK=차단했습니다
zt.console.action.NO_DECISION=판정하지 못했습니다
zt.console.reasonGroup.BUSINESS_RECORDS=업무 기록
zt.console.reasonGroup.DEVIATION=평소와 다름
zt.console.reasonGroup.AS_USUAL=평소와 같음
zt.console.reasonGroup.DATA_AND_SCOPE=데이터와 범위
zt.console.reasonGroup.DELEGATION=위임
zt.console.reasonGroup.SESSION=세션 흐름
zt.console.reasonGroup.PAST_RECORDS=과거 기록
zt.console.reasonGroup.CONFLICTS=사실 충돌
zt.console.reasonGroup.ESCALATION=상위 이관
zt.console.reasonGroup.OTHER=기타
zt.console.outcome.CHALLENGE_CODE_REQUESTED=계정 주인에게 추가 인증 코드를 메일로 보냈습니다
zt.console.outcome.CHALLENGE_PASSED=계정 주인이 추가 인증을 통과했습니다
zt.console.outcome.CHALLENGE_FAILED=추가 인증에 실패했습니다
zt.console.outcome.CHALLENGE_EXPIRED=답이 없어 추가 인증 시간이 지났습니다
zt.console.outcome.UNBLOCK_REQUESTED=사용자가 차단 해제를 요청했습니다
zt.console.outcome.ADMIN_RELEASED=관리자가 차단을 풀었습니다
zt.console.outcome.BLOCK_KEPT=차단이 유지되었습니다
zt.console.outcome.EVALUATED_VALID=관리자가 타당하다고 평가했습니다
zt.console.outcome.EVALUATED_INVALID=관리자가 타당하지 않다고 평가했습니다
zt.console.outcome.ALLOWED_BREACH_CONFIRMED=관리자가 허용한 요청이 뒤에 침해로 확인되었다고 기록했습니다
zt.console.conclusion.action={0}.
zt.console.conclusion.reason=주된 이유({1})로 {0}.
zt.console.conclusion.outcome={0}. 그 뒤 {1}.
zt.console.conclusion.full=주된 이유({1})로 {0}. 그 뒤 {2}.

