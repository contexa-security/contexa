<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}">
<head><th:block th:replace="~{contexa/fragments/common-head :: head-elements(pageTitle=#{admin.users.title})}"></th:block></head>
<body class="flex flex-col min-h-screen font-sans">

<div th:insert="~{contexa/fragments/header :: header}"></div>
<div id="toast-container" class="fixed top-5 right-5 z-50 w-full max-w-xs sm:max-w-sm"></div>

<div class="flex flex-1">
    <aside th:insert="~{contexa/fragments/admin-menu :: menu}" class="hidden md:block"></aside>

    <main class="flex-1 p-6 md:p-10">
        <div class="mx-auto dark-card p-6 sm:p-8 rounded-xl">
            <div class="mb-8 flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gradient" th:text="#{admin.users.title}">Admin - User List</h1>
                    <p class="text-dark-muted mt-1" th:text="#{admin.users.subtitle}">Manage platform user accounts.</p>
                </div>
                <a th:href="@{/contexa/admin/users/new}"
                   class="px-6 py-3 rounded-xl font-semibold transition-all duration-300 text-white"
                   style="background: linear-gradient(135deg, #6366f1, #4f46e5); box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); text-decoration:none;">
                    <span th:text="#{admin.users.new}">New User</span>
                </a>
            </div>
            <p th:if="${usersWithoutFactor != null and usersWithoutFactor > 0}" class="mb-6 p-4 rounded-lg text-sm"
               style="background: rgba(251, 191, 36, 0.1); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3);"
               th:text="#{admin.users.no.factor(${usersWithoutFactor})}">Some users cannot answer a CHALLENGE.</p>

            <form th:action="@{/contexa/admin/users}" method="get" class="mb-6 flex flex-wrap gap-3 console-search-form">
                <div class="relative flex-1">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2" style="color:#64748b;"></i>
                    <input type="text" name="keyword" th:value="${keyword}"
                           class="w-full pl-10 pr-4 py-2.5 rounded-lg text-sm"
                           style="background:rgba(30,41,59,0.6);border:2px solid rgba(71,85,105,0.5);color:#e2e8f0;"
                           th:placeholder="#{admin.users.search.placeholder}" placeholder="Search...">
                </div>
                <button type="submit" class="px-4 py-2.5 rounded-lg text-sm font-medium text-white"
                        style="background:linear-gradient(135deg,#6366f1,#4f46e5);">
                    <i class="fas fa-search mr-1"></i> <span th:text="#{common.action.search}">Search</span>
                </button>
                <a th:href="@{/contexa/admin/users}" class="px-4 py-2.5 rounded-lg text-sm font-medium"
                   style="color:#94a3b8;border:1px solid rgba(71,85,105,0.5);"
                   th:text="#{common.action.reset}">
                    Reset
                </a>
            </form>

            <!-- K92: the users a number of the dashboard counts, by the rule that counts them; K100: one user by name -->
            <div th:if="${!#lists.isEmpty(filters)}" id="userFilters" class="flex flex-wrap gap-2 mb-6 items-center">
                <a th:href="@{/contexa/admin/users}"
                   th:classappend="${filter == null and exactUser == null} ? 'filter-active' : 'filter-inactive'"
                   class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300"
                   th:text="#{admin.users.filter.all}">All</a>
                <a th:each="f : ${filters}" th:href="@{/contexa/admin/users(filter=${f})}"
                   th:classappend="${filter == f} ? 'filter-active' : 'filter-inactive'"
                   class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300"
                   th:text="#{${'admin.users.filter.' + f}}">Filter</a>
                <a th:if="${exactUser != null}" th:href="@{/contexa/admin/users}" id="userFilterExact"
                   class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300 filter-active"
                   style="max-width:100%;overflow-wrap:anywhere;" th:title="#{admin.users.filter.user.clear}">
                    <span th:text="#{admin.users.filter.user(${exactUser})}">User</span>
                    <i class="fas fa-times ml-1" aria-hidden="true"></i>
                </a>
                <span th:if="${filter != null or exactUser != null}" id="userFilterCount" class="text-sm"
                      style="color:#94a3b8;"
                      th:text="#{admin.users.filter.count(${#numbers.formatInteger(page.totalElements, 1, 'COMMA')})}">0 users</span>
            </div>

            <div class="overflow-x-auto shadow-md rounded-lg" tabindex="0" role="region"
                 th:aria-label="#{admin.users.table.region}">
                <table id="usersTable" class="min-w-full w-full text-sm text-left">
                    <thead class="text-xs text-white uppercase" style="background: linear-gradient(135deg, #1e293b 0%, #334155 100%);">
                    <tr>
                        <th scope="col" class="py-3.5 px-6 font-semibold" th:text="#{common.table.id}">ID</th>
                        <th scope="col" class="py-3.5 px-6 font-semibold" th:text="#{admin.users.table.name}">Username</th>
                        <th scope="col" class="py-3.5 px-6 font-semibold" th:text="#{admin.users.table.email}">Email (ID)</th>
                        <th scope="col" class="py-3.5 px-6 font-semibold" th:text="#{admin.users.table.groups}">Groups</th>
                        <th scope="col" class="py-3.5 px-6 font-semibold" th:text="#{admin.users.table.roles}">Roles</th>
                        <th scope="col" class="py-3.5 px-6 font-semibold" th:text="#{admin.users.table.permissions}">Permissions</th>
                        <th scope="col" class="py-3.5 px-6 font-semibold" th:text="#{admin.users.table.mfa}">MFA Enabled</th>
                        <th scope="col" class="py-3.5 px-6 font-semibold" th:text="#{common.table.actions}">Actions</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y" style="background: rgba(15, 23, 42, 0.6); color: #e2e8f0; border-color: rgba(71, 85, 105, 0.3);">
                    <tr th:each="user : ${users}" style="border-color: rgba(71, 85, 105, 0.3);">
                        <td class="py-4 px-6" th:text="${user.id}">1</td>
                        <td class="py-4 px-6" th:text="${user.name}">Admin</td>
                        <td class="py-4 px-6" th:text="${user.username}">admin@example.com</td>
                        <td class="py-4 px-6" th:text="${user.groupCount}"></td>
                        <td class="py-4 px-6" th:text="${user.roleCount}"></td>
                        <td class="py-4 px-6" th:text="${user.permissionCount}"></td>
                        <td class="py-4 px-6">
                            <span th:text="${user.mfaEnabled} ? #{admin.users.mfa.enabled} : #{admin.users.mfa.disabled}"
                                  th:style="${user.mfaEnabled ? 'background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3);' : 'background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3);'}"
                                  class="px-3 py-1 rounded-full text-xs font-semibold"></span>
                        </td>
                        <td class="py-4 px-6">
                            <a th:href="@{/contexa/admin/users/{id}(id=${user.id})}"
                               class="px-3 py-1.5 rounded-md text-sm font-medium transition-all duration-300 inline-block mr-2"
                               style="background: rgba(99, 102, 241, 0.2); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3);"
                               th:text="#{common.action.edit}">Edit</a>
                            <form th:action="@{/contexa/admin/users/delete/{id}(id=${user.id})}" method="post" style="display:inline;"
                                  th:data-confirm-msg="#{common.confirm.delete.user}" onsubmit="return confirm(this.getAttribute('data-confirm-msg'));">
                                <button type="submit" class="px-3 py-1.5 rounded-md text-sm font-medium transition-all duration-300 inline-block"
                                        style="background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); cursor:pointer;"
                                        th:text="#{common.action.delete}">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="8" class="py-4 px-6 text-center" style="color: #94a3b8;">
                            <span th:text="#{admin.users.empty}">No users to display.</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- S10: the policy list's pagination: the first, the previous, the pages near the current one, the next and
                 the last, never a link to each of thousands of pages. The word, the filter or the name stays (K92, K100). -->
            <nav th:if="${page != null and page.totalPages > 1}" id="userPages" class="mt-6 flex justify-center"
                 th:with="currentPage=${page.number}, totalPages=${page.totalPages},
                          startPage=${T(java.lang.Math).max(0, currentPage - 2)},
                          endPage=${T(java.lang.Math).min(totalPages - 1, currentPage + 2)}">
                <ul class="modern-pagination flex-wrap justify-center">
                    <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                        <a class="page-link" th:aria-label="#{common.page.first}" th:href="@{/contexa/admin/users(keyword=${keyword},filter=${filter},user=${exactUser},page=0,size=${page.size})}"><i class="fas fa-angle-double-left"></i></a>
                    </li>
                    <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                        <a class="page-link" th:aria-label="#{common.page.previous}" th:href="@{/contexa/admin/users(keyword=${keyword},filter=${filter},user=${exactUser},page=${T(java.lang.Math).max(0, currentPage - 1)},size=${page.size})}"><i class="fas fa-chevron-left"></i></a>
                    </li>
                    <th:block th:if="${startPage > 0}">
                        <li class="page-item">
                            <a class="page-link" th:href="@{/contexa/admin/users(keyword=${keyword},filter=${filter},user=${exactUser},page=0,size=${page.size})}">1</a>
                        </li>
                        <li class="page-item disabled" th:if="${startPage > 1}">
                            <span class="page-link">...</span>
                        </li>
                    </th:block>
                    <li th:each="pageNumber : ${#numbers.sequence(startPage, endPage)}"
                        class="page-item" th:classappend="${pageNumber == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/contexa/admin/users(keyword=${keyword},filter=${filter},user=${exactUser},page=${pageNumber},size=${page.size})}"
                           th:attr="aria-current=${pageNumber == currentPage ? 'page' : null}" th:text="${pageNumber + 1}"></a>
                    </li>
                    <th:block th:if="${endPage < totalPages - 1}">
                        <li class="page-item disabled" th:if="${endPage < totalPages - 2}">
                            <span class="page-link">...</span>
                        </li>
                        <li class="page-item">
                            <a class="page-link" th:href="@{/contexa/admin/users(keyword=${keyword},filter=${filter},user=${exactUser},page=${totalPages - 1},size=${page.size})}" th:text="${totalPages}"></a>
                        </li>
                    </th:block>
                    <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                        <a class="page-link" th:aria-label="#{common.page.next}" th:href="@{/contexa/admin/users(keyword=${keyword},filter=${filter},user=${exactUser},page=${T(java.lang.Math).min(totalPages - 1, currentPage + 1)},size=${page.size})}"><i class="fas fa-chevron-right"></i></a>
                    </li>
                    <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                        <a class="page-link" th:aria-label="#{common.page.last}" th:href="@{/contexa/admin/users(keyword=${keyword},filter=${filter},user=${exactUser},page=${totalPages - 1},size=${page.size})}"><i class="fas fa-angle-double-right"></i></a>
                    </li>
                </ul>
            </nav>

        </div>
    </main>
</div>

<div th:insert="~{contexa/fragments/footer :: footer}" class="mt-auto"></div>

<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', () => {
        const message = /*[[${message}]]*/ null;
        if (message) {
            showToast(message, 'success');
        }
        const errorMessage = /*[[${errorMessage}]]*/ null;
        if (errorMessage) {
            showToast(errorMessage, 'error');
        }
    });
    /*]]>*/
</script>

<!-- The filter chips of the console's lists (the block list, the agents, the address rules), as they are drawn there -->
<style>
    .filter-active {
        background: rgba(99, 102, 241, 0.3);
        color: #818cf8;
        border: 1px solid rgba(99, 102, 241, 0.5);
    }
    .filter-inactive {
        background: rgba(30, 41, 59, 0.5);
        color: #94a3b8;
        border: 1px solid rgba(71, 85, 105, 0.3);
    }
    .filter-inactive:hover {
        background: rgba(51, 65, 85, 0.5);
        color: #e2e8f0;
    }
    /* S10: the policy list's pagination (policy-center.css), the same values: that sheet's .hidden would hide this
       page's menu, whose aside is hidden md:block */
    .modern-pagination {
        display: flex;
        gap: 0.5rem;
        align-items: center;
    }
    .modern-pagination .page-link {
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid rgba(71, 85, 105, 0.3);
        color: #cbd5e1;
        padding: 0.5rem 0.75rem;
        border-radius: 0.375rem;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 2.5rem;
        height: 2.5rem;
    }
    .modern-pagination .page-link:hover {
        background: rgba(71, 85, 105, 0.4);
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .modern-pagination .page-item.active .page-link {
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        border-color: transparent;
        color: white;
        box-shadow: 0 2px 10px rgba(99, 102, 241, 0.3);
    }
    .modern-pagination .page-item.disabled .page-link {
        background: rgba(30, 41, 59, 0.3);
        color: #475569;
        cursor: not-allowed;
        opacity: 0.5;
    }
</style>
</body>
</html>
