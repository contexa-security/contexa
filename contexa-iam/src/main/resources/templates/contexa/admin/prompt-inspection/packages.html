<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <th:block th:replace="~{contexa/admin/prompt-inspection/fragments :: head(#{promptInspection.title.packages})}"></th:block>
</head>
<body class="flex flex-col min-h-screen font-sans">
<div th:insert="~{contexa/fragments/header :: header}"></div>

<div class="flex flex-1 overflow-hidden">
    <aside th:insert="~{contexa/fragments/admin-menu :: menu}"></aside>

    <main class="flex-1 p-6 lg:p-8 overflow-y-auto pi-page" data-pi-page="packages"
          th:attr="data-api-root=@{/contexa/admin/api/prompt-inspection},data-page-root=@{/contexa/admin/prompt-inspection}">
        <div class="modern-card p-6 sm:p-8 rounded-xl pi-card">
            <section th:replace="~{contexa/admin/prompt-inspection/fragments :: pageTop(#{promptInspection.title.packages}, #{promptInspection.subtitle.packages})}"></section>

            <form class="pi-filters" data-pi-filters>
                <label class="pi-field">
                    <span th:text="#{promptInspection.period.from}">From</span>
                    <input type="date" name="from">
                </label>
                <label class="pi-field">
                    <span th:text="#{promptInspection.period.to}">To</span>
                    <input type="date" name="to">
                </label>
                <label class="pi-field">
                    <span th:text="#{promptInspection.filter.verdict}">Result</span>
                    <select name="verdict">
                        <option value="" th:text="#{promptInspection.filter.verdictAll}">All results</option>
                        <option th:each="verdict : ${verdicts}" th:value="${verdict}"
                                th:text="#{'promptInspection.verdict.' + ${verdict}}"></option>
                    </select>
                </label>
                <label class="pi-field">
                    <span th:text="#{promptInspection.filter.check}">Check</span>
                    <select name="checkCode">
                        <option value="" th:text="#{promptInspection.filter.checkAll}">All checks</option>
                        <option th:each="check : ${checks}" th:value="${check}"
                                th:text="#{'promptInspection.check.' + ${check}}"></option>
                    </select>
                </label>
                <label class="pi-field">
                    <span th:text="#{promptInspection.filter.block}">Block</span>
                    <input type="text" name="block" placeholder="REQUEST">
                </label>
                <label class="pi-field">
                    <span th:text="#{promptInspection.filter.entry}">Entry</span>
                    <input type="text" name="entry" placeholder="Action">
                </label>
                <div class="pi-actions">
                    <button type="submit" class="pi-button pi-button-primary" th:text="#{promptInspection.action.search}">Search</button>
                    <button type="button" class="pi-button" data-pi-reset th:text="#{promptInspection.action.reset}">Reset</button>
                    <button type="button" class="pi-button" data-pi-reinspect-period th:text="#{promptInspection.action.reinspectPeriod}">Inspect this period again</button>
                </div>
            </form>
            <p class="pi-status" data-pi-status role="status" aria-live="polite"></p>

            <section class="pi-section">
                <p class="pi-total" data-pi-total></p>
                <div class="pi-table-wrap">
                    <table class="pi-table" data-pi-packages>
                        <thead>
                        <tr>
                            <th scope="col" th:text="#{promptInspection.column.capturedAt}">Sealed at</th>
                            <th scope="col" th:text="#{promptInspection.column.package}">Prompt</th>
                            <th scope="col" th:text="#{promptInspection.column.user}">User</th>
                            <th scope="col" th:text="#{promptInspection.column.request}">Request</th>
                            <th scope="col" th:text="#{promptInspection.column.verdict}">Result</th>
                            <th scope="col" class="pi-number" th:text="#{promptInspection.column.mismatch}">Mismatches</th>
                            <th scope="col" class="pi-number" th:text="#{promptInspection.column.unverifiable}">Could not check</th>
                            <th scope="col" th:text="#{promptInspection.column.inspector}">Inspector</th>
                            <th scope="col" th:text="#{promptInspection.column.inspectedAt}">Inspected at</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <nav class="pi-pager">
                    <button type="button" class="pi-button" data-pi-previous th:text="#{promptInspection.packages.previous}">Previous</button>
                    <button type="button" class="pi-button" data-pi-next th:text="#{promptInspection.packages.next}">Next</button>
                </nav>
            </section>
        </div>
    </main>
</div>

<div th:replace="~{contexa/fragments/footer :: footer}"></div>
<script th:replace="~{contexa/admin/prompt-inspection/fragments :: scriptMessages}"></script>
<script type="module" th:src="@{/contexa/js/admin/prompt-inspection/packages-page.js}"></script>
</body>
</html>
