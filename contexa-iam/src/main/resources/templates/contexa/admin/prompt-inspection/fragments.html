<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<th:block th:fragment="head(pageTitle)">
    <th:block th:replace="~{contexa/fragments/common-head :: head-elements(pageTitle=${pageTitle})}"></th:block>
    <link rel="stylesheet" th:href="@{/contexa/css/admin/prompt-inspection/prompt-inspection.css}">
</th:block>
<body>
<section th:fragment="pageTop(title, subtitle)" class="pi-top">
    <div class="pi-heading">
        <h1 class="pi-title" th:text="${title}">Prompt Inspection</h1>
        <p class="pi-subtitle" th:text="${subtitle}"></p>
    </div>
    <nav class="pi-tabs" th:attr="aria-label=#{menu.nav.pqa}">
        <a class="pi-tab" th:href="@{/contexa/admin/prompt-inspection}"
           th:classappend="${activeTab == 'overview'} ? 'is-active'"
           th:attr="aria-current=${activeTab == 'overview'} ? 'page' : null"
           th:text="#{promptInspection.tab.overview}">Overview</a>
        <a class="pi-tab" th:href="@{/contexa/admin/prompt-inspection/packages}"
           th:classappend="${activeTab == 'packages'} ? 'is-active'"
           th:attr="aria-current=${activeTab == 'packages'} ? 'page' : null"
           th:text="#{promptInspection.tab.packages}">Sealed prompts</a>
    </nav>
</section>

<th:block th:fragment="scriptMessages">
<script type="application/json" id="prompt-inspection-messages" th:utext="${scriptMessagesJson}"></script>
<script type="application/json" id="prompt-inspection-settings" th:utext="${screenSettingsJson}"></script>
</th:block>
</body>
</html>
