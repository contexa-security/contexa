<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<th:block th:fragment="head(pageTitle)">
    <th:block th:replace="~{contexa/fragments/common-head :: head-elements(pageTitle=${pageTitle})}"></th:block>
    <link rel="stylesheet" th:href="@{/contexa/css/admin/prompt-inspection/prompt-inspection.css}">
    <link rel="stylesheet" th:href="@{/contexa/css/admin/prompt-release/prompt-release.css}">
</th:block>
<body>
<section th:fragment="pageTop(title, subtitle)" class="pi-top">
    <div class="pi-heading">
        <h1 class="pi-title" th:text="${title}">Prompt Versions</h1>
        <p class="pi-subtitle" th:text="${subtitle}"></p>
    </div>
    <nav class="pi-tabs" th:attr="aria-label=#{menu.pqa.releases}">
        <a class="pi-tab" th:href="@{/contexa/admin/prompt-quality/releases}"
           th:classappend="${activeTab == 'bundles'} ? 'is-active'"
           th:attr="aria-current=${activeTab == 'bundles'} ? 'page' : null"
           th:text="#{promptRelease.tab.bundles}">Bundles</a>
        <a class="pi-tab" th:href="@{/contexa/admin/prompt-quality/releases/compare}"
           th:classappend="${activeTab == 'compare'} ? 'is-active'"
           th:attr="aria-current=${activeTab == 'compare'} ? 'page' : null"
           th:text="#{promptRelease.tab.compare}">Compare</a>
    </nav>
</section>

<th:block th:fragment="scriptMessages">
<script type="application/json" id="prompt-release-messages" th:utext="${scriptMessagesJson}"></script>
<script type="application/json" id="prompt-release-settings" th:utext="${screenSettingsJson}"></script>
</th:block>
</body>
</html>
