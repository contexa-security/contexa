<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{contexa/fragments/common-head :: head-elements(pageTitle=#{admin.agents.credentials.title})}"></head>
<body class="flex flex-col min-h-screen font-sans">

<div th:insert="~{contexa/fragments/header :: header}"></div>
<div id="toast-container" class="fixed top-5 right-5 z-50 w-full max-w-xs sm:max-w-sm"></div>

<div class="flex flex-1">
    <aside th:insert="~{contexa/fragments/admin-menu :: menu}" class="hidden md:block"></aside>

    <main class="flex-1 p-6 md:p-10">
        <div class="mx-auto dark-card p-6 sm:p-8 rounded-xl" th:object="${credentials}">
            <div class="mb-8 text-center sm:text-left">
                <h1 class="text-3xl font-bold text-gradient" th:text="#{admin.agents.credentials.title}">Agent credentials</h1>
                <p class="text-dark-muted mt-1 font-mono" th:text="${agent.agentId}">agent</p>
            </div>
            <p class="form-warning" th:text="#{admin.agents.credentials.warning}">Shown once.</p>
            <div class="form-card">
                <label class="form-label" th:text="#{admin.agents.credentials.client.id}">OAuth2 client</label>
                <div class="secret-value" id="credentialClientId" th:text="*{clientId}">client</div>
                <div th:if="*{clientSecret != null}">
                    <label class="form-label" th:text="#{admin.agents.credentials.client.secret}">Client secret</label>
                    <div class="secret-value" id="credentialClientSecret" th:text="*{clientSecret}">secret</div>
                </div>
                <div th:if="*{accountUsername != null}">
                    <label class="form-label" th:text="#{admin.agents.credentials.account.username}">Account</label>
                    <div class="secret-value" th:text="*{accountUsername}">account</div>
                    <label class="form-label" th:text="#{admin.agents.credentials.account.password}">Account password</label>
                    <div class="secret-value" id="credentialAccountPassword" th:text="*{accountPassword}">password</div>
                </div>
            </div>
            <div class="mt-8">
                <a th:href="@{/contexa/admin/agents/detail(agentId=${agent.agentId}, tenant=${agent.tenantId})}"
                   class="px-4 py-2 rounded-lg text-sm font-medium text-white inline-block"
                   style="background:linear-gradient(135deg,#6366f1,#4f46e5);"
                   th:text="#{admin.agents.credentials.done}">Done</a>
            </div>
        </div>
    </main>
</div>

<div th:insert="~{contexa/fragments/footer :: footer}" class="mt-auto"></div>

<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', () => {
        const errorMessage = /*[[${errorMessage}]]*/ null;
        if (errorMessage) {
            showToast(errorMessage, 'error');
        }
    });
    /*]]>*/
</script>

<style>
    .form-card {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(71, 85, 105, 0.3);
        border-radius: 0.75rem;
        padding: 1.25rem;
        color: #e2e8f0;
    }
    .form-label {
        display: block;
        font-size: 0.875rem;
        color: #cbd5e1;
        margin: 0.75rem 0 0.25rem;
    }
    .form-input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        background: rgba(15, 23, 42, 0.8);
        color: #e2e8f0;
        border: 1px solid rgba(71, 85, 105, 0.3);
    }
    .form-hint {
        font-size: 0.8125rem;
        color: #94a3b8;
        margin-top: 0.25rem;
    }
    .secret-value {
        font-family: ui-monospace, monospace;
        word-break: break-all;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(99, 102, 241, 0.4);
        border-radius: 0.5rem;
        padding: 0.5rem 0.75rem;
    }
    .form-warning {
        margin: 0.75rem 0;
        font-size: 0.875rem;
        color: #fbbf24;
    }
</style>

</body>
</html>
