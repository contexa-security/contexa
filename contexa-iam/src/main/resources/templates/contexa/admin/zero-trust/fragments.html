<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  The frame of every Zero Trust console screen (console design 6.0), in the admin console's own components as the
  policy center draws them: the page card, the gradient title and its question, the tab bar of the console's screens,
  the period and the band in a filter box, the place the screen draws in, and the console's messages for its script.
-->
<div th:fragment="console(title, question, periods)" class="zt-page modern-card" id="zt-console"
     th:data-api-base="${apiBase}" th:data-screen="${screen}"
     th:data-observation-id="${observationId}"
     th:data-csrf-token="${_csrf != null ? _csrf.token : ''}"
     th:data-csrf-header="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}">
    <script type="application/json" id="zt-messages" th:utext="${scriptMessagesJson}"></script>
    <div class="zt-title-row mb-6">
        <div class="min-w-0">
            <h1 class="text-3xl font-bold pc-header-gradient" th:text="${title}">Overview</h1>
            <p class="text-dark-muted mt-1" th:text="${question}">Question</p>
        </div>
        <div class="zt-toolbar"></div>
    </div>

    <nav class="pc-tab-nav zt-tab-nav mb-6" th:attr="aria-label=#{zt.console.ui.eyebrow}">
        <a th:href="@{/contexa/admin/zero-trust}" class="pc-tab-btn" data-zt-tab
           th:classappend="${activePage == 'zero-trust-overview'} ? ' active' : ''"
           th:attr="aria-current=${activePage == 'zero-trust-overview'} ? 'page' : null">
            <i class="fas fa-shield-alt" aria-hidden="true"></i><span th:text="#{zt.console.ui.title.overview}">Overview</span>
        </a>
        <a th:href="@{/contexa/admin/zero-trust/impact}" class="pc-tab-btn" data-zt-tab
           th:classappend="${activePage == 'zero-trust-impact'} ? ' active' : ''"
           th:attr="aria-current=${activePage == 'zero-trust-impact'} ? 'page' : null">
            <i class="fas fa-crosshairs" aria-hidden="true"></i><span th:text="#{zt.console.ui.title.impact}">Impact</span>
        </a>
        <a th:href="@{/contexa/admin/zero-trust/trust}" class="pc-tab-btn" data-zt-tab
           th:classappend="${activePage == 'zero-trust-trust'} ? ' active' : ''"
           th:attr="aria-current=${activePage == 'zero-trust-trust'} ? 'page' : null">
            <i class="fas fa-balance-scale" aria-hidden="true"></i><span th:text="#{zt.console.ui.title.trust}">Trust</span>
        </a>
        <a th:href="@{/contexa/admin/zero-trust/decisions}" class="pc-tab-btn" data-zt-tab
           th:classappend="${activePage == 'zero-trust-decisions'} ? ' active' : ''"
           th:attr="aria-current=${activePage == 'zero-trust-decisions'} ? 'page' : null">
            <i class="fas fa-list-alt" aria-hidden="true"></i><span th:text="#{zt.console.ui.title.decisions}">Decisions</span>
        </a>
        <a th:href="@{/contexa/admin/zero-trust/adoption}" class="pc-tab-btn" data-zt-tab
           th:classappend="${activePage == 'zero-trust-adoption'} ? ' active' : ''"
           th:attr="aria-current=${activePage == 'zero-trust-adoption'} ? 'page' : null">
            <i class="fas fa-flag-checkered" aria-hidden="true"></i><span th:text="#{zt.console.ui.title.adoption}">Adoption</span>
        </a>
        <a th:href="@{/contexa/admin/zero-trust/operations}" class="pc-tab-btn" data-zt-tab
           th:classappend="${activePage == 'zero-trust-operations'} ? ' active' : ''"
           th:attr="aria-current=${activePage == 'zero-trust-operations'} ? 'page' : null">
            <i class="fas fa-server" aria-hidden="true"></i><span th:text="#{zt.console.ui.title.operations}">Operations</span>
        </a>
    </nav>

    <div class="filter-container zt-band-box mb-6">
        <div class="zt-period" id="zt-period" role="group" th:if="${periods}"
             th:attr="aria-label=#{zt.console.ui.period}"></div>
        <div class="zt-band" id="zt-band" aria-live="polite"></div>
    </div>
    <div class="zt-stack" id="zt-content"></div>
</div>
</body>
</html>
