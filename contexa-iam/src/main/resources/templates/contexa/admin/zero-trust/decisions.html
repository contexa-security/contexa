<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <th:block th:replace="~{contexa/fragments/common-head :: head-elements(pageTitle=#{zt.console.ui.title.decisions})}"></th:block>
    <link rel="stylesheet" th:href="@{/contexa/css/zero-trust-console.css}" />
</head>
<body class="flex flex-col min-h-screen font-sans">
<div th:insert="~{contexa/fragments/header :: header}"></div>
<div class="flex flex-1 overflow-hidden">
    <aside th:insert="~{contexa/fragments/admin-menu :: menu}"></aside>
    <main class="flex-1 overflow-y-auto">
        <div th:replace="~{contexa/admin/zero-trust/fragments :: console(title=#{zt.console.ui.title.decisions}, question=#{zt.console.ui.question.decisions}, periods=true)}"></div>
    </main>
</div>
<div th:insert="~{contexa/fragments/footer :: footer}" class="mt-auto"></div>
<script th:src="@{/contexa/js/vendor/chart.umd.min.js}"></script>
<script th:src="@{/contexa/js/admin/zero-trust/console-common.js}"></script>
<script th:src="@{/contexa/js/admin/zero-trust/decisions.js}"></script>
</body>
</html>
