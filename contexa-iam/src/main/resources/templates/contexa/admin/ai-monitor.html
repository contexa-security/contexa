<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <th:block th:replace="~{contexa/fragments/common-head :: head-elements(pageTitle=#{admin.aiMonitor.title})}"></th:block>
    <link rel="stylesheet" th:href="@{/css/policy-center.css}" />
    <style>
        .ai-monitor-layout { display: grid; gap: 1rem; }
        .ai-monitor-tabs { display: flex; gap: .5rem; flex-wrap: wrap; border-bottom: 1px solid rgba(71,85,105,.45); padding-bottom: .75rem; }
        .ai-monitor-tab { border: 1px solid rgba(71,85,105,.45); border-radius: .5rem; color: #94a3b8; padding: .45rem .75rem; text-decoration: none; font-size: .86rem; }
        .ai-monitor-tab.active { border-color: rgba(34,211,238,.55); background: rgba(34,211,238,.12); color: #67e8f9; }
        .ai-monitor-toolbar { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
        .ai-monitor-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: .85rem; }
        .ai-monitor-kpis:empty { display: none; }
        .ai-monitor-kpi { border: 1px solid rgba(71,85,105,.35); border-radius: .5rem; padding: 1rem; background: rgba(15,23,42,.48); }
        .ai-monitor-kpi-value { color: #e2e8f0; font-size: 1.6rem; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
        .ai-monitor-kpi-label { color: #94a3b8; font-size: .9rem; margin-top: .45rem; }
        .ai-monitor-kpi-help { color: #64748b; font-size: .84rem; line-height: 1.5; margin-top: .35rem; }
        .ai-monitor-band { border: 1px solid rgba(71,85,105,.35); border-radius: .5rem; padding: 1rem; background: rgba(15,23,42,.36); }
        .ai-monitor-band-title { color: #e2e8f0; font-size: 1rem; font-weight: 700; margin-bottom: .75rem; }
        .ai-monitor-band-help { color: #94a3b8; font-size: .9rem; line-height: 1.55; margin: -.35rem 0 .85rem; }
        .ai-monitor-mode-grid { display: grid; grid-template-columns: repeat(2, minmax(240px, 1fr)); gap: .75rem; margin-top: .85rem; }
        .ai-monitor-mode-card { border: 1px solid rgba(34,211,238,.28); border-radius: .5rem; background: rgba(8,47,73,.24); padding: .85rem; display: grid; gap: .45rem; }
        .ai-monitor-mode-card.enforce { border-color: rgba(34,197,94,.42); background: rgba(20,83,45,.18); }
        .ai-monitor-mode-card.shadow { border-color: rgba(245,158,11,.45); background: rgba(120,53,15,.18); }
        .ai-monitor-mode-card.disabled { border-color: rgba(148,163,184,.35); background: rgba(30,41,59,.34); }
        .ai-monitor-mode-head { display: flex; justify-content: space-between; gap: .75rem; align-items: center; }
        .ai-monitor-mode-title { color: #cbd5e1; font-size: .9rem; font-weight: 700; }
        .ai-monitor-mode-badge { color: #f8fafc; font-size: .88rem; font-weight: 900; border-radius: 999px; padding: .28rem .65rem; background: rgba(34,211,238,.18); }
        .ai-monitor-mode-effect { color: #94a3b8; font-size: .9rem; line-height: 1.45; }
        .ai-monitor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
        .ai-monitor-dashboard { display: grid; gap: 1rem; }
        .ai-monitor-overview-top { display: grid; grid-template-columns: minmax(260px, .85fr) minmax(420px, 1.4fr); gap: 1rem; }
        .ai-monitor-overview-grid { display: grid; grid-template-columns: minmax(360px, 1.1fr) minmax(360px, 1fr); gap: 1rem; align-items: stretch; }
        .ai-monitor-judgement { min-height: 190px; display: grid; align-content: space-between; }
        .ai-monitor-judgement-value { color: #f8fafc; font-size: 1.9rem; line-height: 1.1; font-weight: 800; overflow-wrap: anywhere; }
        .ai-monitor-judgement-sub { color: #94a3b8; font-size: .9rem; line-height: 1.55; margin-top: .55rem; }
        .ai-monitor-meter { height: .55rem; border-radius: 999px; overflow: hidden; background: rgba(15,23,42,.9); border: 1px solid rgba(71,85,105,.5); }
        .ai-monitor-meter-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #06b6d4, #22c55e); }
        .ai-monitor-meter-fill.warn { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .ai-monitor-meter-fill.bad { background: linear-gradient(90deg, #ef4444, #fb7185); }
        .ai-monitor-flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .75rem; }
        .ai-monitor-flow-step { position: relative; min-height: 124px; padding: .95rem; border: 1px solid rgba(71,85,105,.35); border-radius: .5rem; background: rgba(15,23,42,.48); overflow: hidden; }
        .ai-monitor-flow-step::after { content: ""; position: absolute; inset: auto 0 0 0; height: .2rem; background: var(--flow-color, #22d3ee); opacity: .9; }
        .ai-monitor-flow-label { color: #94a3b8; font-size: .88rem; min-height: 2.35rem; line-height: 1.4; }
        .ai-monitor-flow-value { color: #f8fafc; font-size: 1.55rem; font-weight: 800; margin-top: .35rem; }
        .ai-monitor-flow-rate { color: #cbd5e1; font-size: .86rem; margin-top: .35rem; }
        .ai-monitor-flow-bar { height: .45rem; border-radius: 999px; background: rgba(30,41,59,.8); overflow: hidden; margin-top: .65rem; }
        .ai-monitor-flow-bar > span { display: block; height: 100%; border-radius: inherit; background: var(--flow-color, #22d3ee); }
        .ai-monitor-chart-shell { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 1rem; align-items: center; min-height: 210px; }
        .ai-monitor-donut { width: 148px; aspect-ratio: 1; border-radius: 50%; position: relative; background: rgba(30,41,59,.9); box-shadow: inset 0 0 0 1px rgba(148,163,184,.18); }
        .ai-monitor-donut::after { content: ""; position: absolute; inset: 26px; border-radius: 50%; background: #0f172a; box-shadow: inset 0 0 0 1px rgba(71,85,105,.45); }
        .ai-monitor-donut-center { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; color: #e2e8f0; font-size: 1rem; font-weight: 800; text-align: center; padding: 2.4rem; line-height: 1.25; }
        .ai-monitor-legend { display: grid; gap: .55rem; }
        .ai-monitor-legend-row { display: grid; grid-template-columns: .6rem minmax(0, 1fr) auto; gap: .55rem; align-items: center; color: #94a3b8; font-size: .88rem; }
        .ai-monitor-legend-dot { width: .6rem; height: .6rem; border-radius: 999px; background: var(--legend-color, #22d3ee); }
        .ai-monitor-bars { display: grid; gap: .85rem; }
        .ai-monitor-bar-row { display: grid; gap: .35rem; }
        .ai-monitor-bar-head { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; color: #cbd5e1; font-size: .9rem; }
        .ai-monitor-bar-track { height: .55rem; border-radius: 999px; overflow: hidden; background: rgba(30,41,59,.8); }
        .ai-monitor-bar-fill { display: block; height: 100%; border-radius: inherit; background: #22c55e; }
        .ai-monitor-bar-fill.warn { background: #f59e0b; }
        .ai-monitor-bar-fill.bad { background: #ef4444; }
        .ai-monitor-dashboard-note { color: #64748b; font-size: .86rem; line-height: 1.55; margin-top: .75rem; }
        .ai-monitor-table { width: 100%; border-collapse: collapse; }
        .ai-monitor-table th { color: #cbd5e1; font-size: .84rem; text-align: left; padding: .7rem; border-bottom: 1px solid rgba(71,85,105,.45); }
        .ai-monitor-table td { color: #94a3b8; font-size: .9rem; padding: .7rem; border-bottom: 1px solid rgba(71,85,105,.22); }
        .ai-monitor-row-meta { color: #64748b; font-size: .8rem; line-height: 1.4; margin-top: .25rem; overflow-wrap: anywhere; }
        .ai-monitor-inline-link { display: inline-flex; align-items: center; width: fit-content; border: 1px solid rgba(34,211,238,.42); border-radius: .45rem; color: #67e8f9; padding: .5rem .75rem; text-decoration: none; font-size: .88rem; font-weight: 700; background: rgba(34,211,238,.08); }
        .ai-monitor-inline-link:hover { background: rgba(34,211,238,.16); }
        .ai-monitor-status { border-radius: 999px; padding: .25rem .65rem; font-size: .82rem; font-weight: 700; display: inline-flex; background: rgba(34,211,238,.16); color: #67e8f9; }
        .ai-monitor-status.good { background: rgba(34,197,94,.18); color: #4ade80; }
        .ai-monitor-status.warn { background: rgba(245,158,11,.18); color: #fbbf24; }
        .ai-monitor-status.bad { background: rgba(239,68,68,.18); color: #f87171; }
        .ai-monitor-status.info { background: rgba(34,211,238,.16); color: #67e8f9; }
        .ai-monitor-details-note { color: #64748b; font-size: .86rem; margin-top: .7rem; }
        .ai-monitor-hero-grid { display: grid; grid-template-columns: minmax(320px, 1.15fr) minmax(280px, .85fr); gap: 1rem; }
        .ai-monitor-decision-card { border-color: rgba(34,211,238,.25); padding: 1.2rem; }
        .ai-monitor-decision-card.good { border-color: rgba(34,197,94,.45); }
        .ai-monitor-decision-card.warn { border-color: rgba(245,158,11,.55); }
        .ai-monitor-decision-card.bad { border-color: rgba(239,68,68,.6); }
        .ai-monitor-decision-head { display: grid; grid-template-columns: minmax(240px, auto) minmax(280px, 1fr); gap: 1.25rem; align-items: end; border-bottom: 1px solid rgba(71,85,105,.35); padding-bottom: 1rem; margin-bottom: 1rem; }
        .ai-monitor-decision-value { color: #f8fafc; font-size: 2.35rem; line-height: 1.05; font-weight: 900; margin: .15rem 0 0; overflow-wrap: anywhere; letter-spacing: 0; }
        .ai-monitor-decision-caption { color: #cbd5e1; font-size: .95rem; line-height: 1.55; justify-self: end; max-width: 32rem; text-align: right; }
        .ai-monitor-blocker-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .75rem; margin-top: .2rem; }
        .ai-monitor-blocker { display: grid; gap: .55rem; border-left: .26rem solid #38bdf8; padding: .8rem .9rem; background: rgba(15,23,42,.76); border-radius: .45rem; min-height: 92px; box-shadow: inset 0 0 0 1px rgba(148,163,184,.05); }
        .ai-monitor-blocker-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .8rem; align-items: baseline; }
        .ai-monitor-blocker strong { color: #f8fafc; font-size: 1rem; line-height: 1.35; }
        .ai-monitor-blocker-value { color: #f8fafc; font-size: 1.55rem; line-height: 1; font-weight: 900; white-space: nowrap; }
        .ai-monitor-blocker-criteria { color: #cbd5e1; font-size: .9rem; line-height: 1.45; }
        .ai-monitor-blocker.good { border-left-color: #22c55e; }
        .ai-monitor-blocker.warn { border-left-color: #f59e0b; }
        .ai-monitor-blocker.bad { border-left-color: #ef4444; }
        .ai-monitor-funnel { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: .75rem; }
        .ai-monitor-funnel-step { position: relative; min-height: 136px; padding: .95rem; border: 1px solid rgba(71,85,105,.35); border-radius: .5rem; background: rgba(15,23,42,.48); overflow: hidden; }
        .ai-monitor-flow-index { width: 1.4rem; height: 1.4rem; display: grid; place-items: center; border-radius: 999px; color: #0f172a; background: var(--flow-color, #22d3ee); font-size: .8rem; font-weight: 900; margin-bottom: .5rem; }
        .ai-monitor-simple-list { display: grid; gap: .55rem; }
        .ai-monitor-simple-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .75rem; align-items: center; border-bottom: 1px solid rgba(71,85,105,.22); padding: .55rem 0; color: #94a3b8; font-size: .9rem; }
        .ai-monitor-simple-row:last-child { border-bottom: 0; }
        .ai-monitor-simple-row strong { color: #e2e8f0; }
        .ai-monitor-empty-note { color: #94a3b8; line-height: 1.55; font-size: .92rem; padding: .85rem; border: 1px dashed rgba(71,85,105,.4); border-radius: .45rem; background: rgba(15,23,42,.3); }
        .ai-monitor-two-stack { display: grid; gap: .85rem; }
        .ai-monitor-mini-bars { display: grid; gap: .65rem; }
        .ai-monitor-mini-bar { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr) 3.2rem; gap: .65rem; align-items: center; color: #94a3b8; font-size: .86rem; }
        .ai-monitor-mini-bar div { height: .55rem; border-radius: 999px; overflow: hidden; background: rgba(30,41,59,.85); }
        .ai-monitor-mini-bar i { display: block; height: 100%; border-radius: inherit; background: #38bdf8; }
        .ai-monitor-mini-bar strong { color: #e2e8f0; text-align: right; }
        .ai-monitor-confusion { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
        .ai-monitor-confusion-cell { min-height: 118px; border: 1px solid rgba(71,85,105,.35); border-radius: .5rem; padding: .9rem; background: rgba(15,23,42,.45); display: grid; gap: .35rem; }
        .ai-monitor-confusion-cell.good { border-color: rgba(34,197,94,.38); }
        .ai-monitor-confusion-cell.bad { border-color: rgba(239,68,68,.38); }
        .ai-monitor-confusion-cell strong { color: #e2e8f0; font-size: 1rem; }
        .ai-monitor-confusion-cell span { color: #94a3b8; font-size: .88rem; line-height: 1.45; }
        .ai-monitor-confusion-cell b { color: #f8fafc; font-size: 1.5rem; }
        .ai-monitor-cause-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .75rem; }
        .ai-monitor-cause { border: 1px solid rgba(71,85,105,.35); border-radius: .5rem; padding: .85rem; background: rgba(15,23,42,.48); display: grid; gap: .35rem; }
        .ai-monitor-cause strong { color: #dbeafe; font-size: .95rem; }
        .ai-monitor-cause span { color: #f8fafc; font-size: 1.45rem; font-weight: 800; }
        .ai-monitor-cause i { color: #94a3b8; font-style: normal; font-size: .86rem; }
        .ai-monitor-trend { height: 170px; display: flex; gap: .5rem; align-items: end; border: 1px solid rgba(71,85,105,.22); border-radius: .5rem; padding: .8rem; background: rgba(15,23,42,.32); }
        .ai-monitor-trend-bar { flex: 1; min-width: 0; height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: .45rem; align-items: end; }
        .ai-monitor-trend-bar i { display: block; width: 100%; min-height: 4px; border-radius: .3rem .3rem 0 0; background: linear-gradient(180deg, #67e8f9, #0e7490); }
        .ai-monitor-trend-bar span { color: #94a3b8; font-size: .74rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
        .ai-monitor-readiness-visual-grid { display: grid; grid-template-columns: minmax(260px, .52fr) minmax(420px, 1.48fr); gap: 1rem; align-items: stretch; }
        .ai-monitor-readiness-gauge-card { display: grid; align-content: start; justify-items: center; gap: .9rem; }
        .ai-monitor-readiness-gauge { width: 184px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(#22c55e var(--readiness-angle), rgba(30,41,59,.9) 0deg); box-shadow: inset 0 0 0 1px rgba(148,163,184,.2), 0 18px 45px rgba(15,23,42,.38); }
        .ai-monitor-readiness-gauge-core { width: 128px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; align-content: center; gap: .35rem; background: #0f172a; box-shadow: inset 0 0 0 1px rgba(71,85,105,.5); text-align: center; }
        .ai-monitor-readiness-gauge-core strong { color: #f8fafc; font-size: 2rem; line-height: 1; font-weight: 900; }
        .ai-monitor-readiness-gauge-core span { color: #94a3b8; font-size: .84rem; line-height: 1.35; max-width: 104px; }
        .ai-monitor-readiness-bars { display: grid; gap: .85rem; }
        .ai-monitor-readiness-bar-row { display: grid; gap: .4rem; }
        .ai-monitor-readiness-bar-head { display: flex; justify-content: space-between; align-items: baseline; gap: .8rem; color: #cbd5e1; font-size: .9rem; }
        .ai-monitor-readiness-bar-head strong { color: #e2e8f0; font-size: .95rem; }
        .ai-monitor-readiness-bar-head span { color: #94a3b8; font-size: .86rem; text-align: right; }
        .ai-monitor-readiness-track { height: .72rem; border-radius: 999px; overflow: hidden; background: rgba(30,41,59,.85); border: 1px solid rgba(71,85,105,.35); }
        .ai-monitor-readiness-track > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #06b6d4, #22c55e); }
        .ai-monitor-readiness-bar-row.bad .ai-monitor-readiness-track > span { background: linear-gradient(90deg, #f97316, #ef4444); }
        .ai-monitor-criteria-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .75rem; }
        .ai-monitor-criterion { border: 1px solid rgba(71,85,105,.35); border-radius: .5rem; padding: .85rem; display: grid; gap: .35rem; background: rgba(15,23,42,.45); }
        .ai-monitor-criterion.good { border-color: rgba(34,197,94,.42); }
        .ai-monitor-criterion.bad { border-color: rgba(239,68,68,.42); }
        .ai-monitor-criterion strong { color: #e2e8f0; font-size: .98rem; }
        .ai-monitor-criterion span { color: #94a3b8; font-size: .88rem; }
        .ai-monitor-criterion em { color: #cbd5e1; font-style: normal; font-size: .88rem; }
        .ai-monitor-muted { color: #94a3b8; font-size: .95rem; line-height: 1.55; }
        .ai-monitor-reset-panel { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        .ai-monitor-reset-scope { margin: .75rem 0 0; padding-left: 1.15rem; color: #cbd5e1; font-size: .94rem; line-height: 1.55; }
        .ai-monitor-reset-scope li + li { margin-top: .2rem; }
        .ai-monitor-primary-button { border: 1px solid rgba(34,211,238,.42); border-radius: .55rem; background: rgba(8,145,178,.22); color: #cffafe; font-weight: 800; padding: .75rem 1rem; min-width: 11rem; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(103,232,249,.08); }
        .ai-monitor-primary-button:hover { background: rgba(8,145,178,.34); border-color: rgba(103,232,249,.58); }
        .ai-monitor-session-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .75rem; margin-top: .85rem; }
        .ai-monitor-session-fact { border: 1px solid rgba(71,85,105,.35); border-radius: .5rem; padding: .85rem; display: grid; gap: .35rem; background: rgba(15,23,42,.42); }
        .ai-monitor-session-fact span { color: #94a3b8; font-size: .9rem; }
        .ai-monitor-session-fact strong { color: #f8fafc; font-size: 1.12rem; overflow-wrap: anywhere; }
        .ai-monitor-session-list { display: grid; gap: .65rem; margin-top: .85rem; }
        .ai-monitor-session-row { display: grid; grid-template-columns: minmax(220px, 1.2fr) repeat(4, minmax(120px, .8fr)); gap: .8rem; align-items: center; border: 1px solid rgba(71,85,105,.28); border-radius: .5rem; padding: .85rem; background: rgba(15,23,42,.36); color: #cbd5e1; }
        .ai-monitor-session-row strong { color: #f8fafc; display: block; margin-bottom: .2rem; }
        .ai-monitor-session-row span { color: #94a3b8; font-size: .88rem; line-height: 1.45; }
        @media (max-width: 1180px) {
            .ai-monitor-overview-top,
            .ai-monitor-overview-grid,
            .ai-monitor-readiness-visual-grid,
            .ai-monitor-hero-grid { grid-template-columns: 1fr; }
            .ai-monitor-decision-head { grid-template-columns: 1fr; }
            .ai-monitor-decision-caption { justify-self: start; text-align: left; }
            .ai-monitor-blocker-list { grid-template-columns: 1fr; }
            .ai-monitor-flow,
            .ai-monitor-funnel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 700px) {
            .ai-monitor-flow,
            .ai-monitor-funnel,
            .ai-monitor-confusion,
            .ai-monitor-chart-shell { grid-template-columns: 1fr; }
            .ai-monitor-donut { width: 136px; }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen font-sans">

<div th:insert="~{contexa/fragments/header :: header}"></div>

<div class="flex flex-1 overflow-hidden">
    <aside th:insert="~{contexa/fragments/admin-menu :: menu}"></aside>

    <main class="flex-1 p-6 lg:p-8 overflow-y-auto">
        <div class="modern-card ai-monitor-layout" id="ai-monitor"
             th:data-section="${section}"
             th:data-period="${period}"
             th:data-csrf-token="${_csrf != null ? _csrf.token : ''}"
             th:data-csrf-header="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}"
             th:data-label-loading="#{admin.aiMonitor.status.loading}"
             th:data-label-unavailable="#{admin.aiMonitor.status.unavailable}"
             th:data-label-observed-requests="#{admin.aiMonitor.kpi.observedRequests}"
             th:data-label-observed-requests-help="#{admin.aiMonitor.help.observedRequests}"
             th:data-label-hcad-windows="#{admin.aiMonitor.kpi.hcadWindows}"
             th:data-label-hcad-windows-help="#{admin.aiMonitor.help.hcadWindows}"
             th:data-label-llm-calls="#{admin.aiMonitor.kpi.llmCalls}"
             th:data-label-accepted-llm-triggers="#{admin.aiMonitor.kpi.acceptedLlmTriggers}"
             th:data-label-flow-accepted-to-completed="#{admin.aiMonitor.dashboard.flowAcceptedToCompleted}"
             th:data-label-hcad-ai-connected="#{admin.aiMonitor.kpi.hcadAiConnected}"
             th:data-label-hcad-candidates="#{admin.aiMonitor.kpi.hcadCandidates}"
             th:data-label-llm-decisions="#{admin.aiMonitor.kpi.llmDecisions}"
             th:data-label-llm-decisions-help="#{admin.aiMonitor.help.llmDecisions}"
             th:data-label-confirmed-decisions="#{admin.aiMonitor.kpi.confirmedDecisions}"
             th:data-label-confirmed-decisions-help="#{admin.aiMonitor.help.confirmedDecisions}"
             th:data-label-protectable-decisions="#{admin.aiMonitor.kpi.protectableDecisions}"
             th:data-label-protectable-decisions-help="#{admin.aiMonitor.help.protectableDecisions}"
             th:data-label-hcad-pretrigger-decisions="#{admin.aiMonitor.kpi.hcadPreTriggerDecisions}"
             th:data-label-hcad-pretrigger-help="#{admin.aiMonitor.help.hcadPreTriggerDecisions}"
