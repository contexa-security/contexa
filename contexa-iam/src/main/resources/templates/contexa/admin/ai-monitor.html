<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <th:block th:replace="~{contexa/fragments/common-head :: head-elements(pageTitle=#{admin.aiMonitor.title})}"></th:block>
    <link rel="stylesheet" th:href="@{/contexa/css/policy-center.css}" />
    <style>
        .ai-monitor-layout { display:grid; gap:1rem; }
        .ai-monitor-tabs,.ai-monitor-toolbar { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
        .ai-monitor-tabs { border-bottom:1px solid rgba(71,85,105,.45); padding-bottom:.75rem; }
        .ai-monitor-tab { border:1px solid rgba(71,85,105,.45); border-radius:.5rem; color:#94a3b8; padding:.45rem .75rem; text-decoration:none; font-size:.86rem; }
        .ai-monitor-tab.active { border-color:rgba(34,211,238,.55); background:rgba(34,211,238,.12); color:#67e8f9; }
        .ai-monitor-kpis,.ai-monitor-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:.85rem; }
        .ai-monitor-kpi,.ai-monitor-band { border:1px solid rgba(71,85,105,.35); border-radius:.5rem; padding:1rem; background:rgba(15,23,42,.48); }
        .ai-monitor-kpi-value { color:#e2e8f0; font-size:1.55rem; font-weight:800; overflow-wrap:anywhere; }
        .ai-monitor-kpi-label,.ai-monitor-muted { color:#94a3b8; font-size:.9rem; margin-top:.4rem; line-height:1.5; }
        .ai-monitor-band-title { color:#e2e8f0; font-size:1rem; font-weight:700; margin-bottom:.75rem; }
        .ai-monitor-table { width:100%; border-collapse:collapse; }
        .ai-monitor-table th,.ai-monitor-table td { padding:.65rem; border-bottom:1px solid rgba(71,85,105,.3); text-align:left; color:#cbd5e1; font-size:.86rem; }
        .ai-monitor-status { display:inline-flex; border-radius:999px; padding:.25rem .65rem; color:#67e8f9; background:rgba(34,211,238,.16); font-size:.82rem; font-weight:700; }
        .ai-monitor-status.bad { color:#f87171; background:rgba(239,68,68,.18); }
        .ai-monitor-status.good { color:#4ade80; background:rgba(34,197,94,.18); }
        .ai-monitor-list { display:grid; gap:.55rem; }
        .ai-monitor-list-row { display:flex; justify-content:space-between; gap:.75rem; color:#94a3b8; border-bottom:1px solid rgba(71,85,105,.22); padding:.5rem 0; }
        .ai-monitor-button { border:1px solid rgba(34,211,238,.42); border-radius:.5rem; background:rgba(8,145,178,.22); color:#cffafe; font-weight:700; padding:.55rem .85rem; cursor:pointer; text-decoration:none; }
        .ai-monitor-button.danger { border-color:rgba(239,68,68,.5); background:rgba(127,29,29,.25); color:#fecaca; }
    </style>
</head>
<body class="flex flex-col min-h-screen font-sans">
<div th:insert="~{contexa/fragments/header :: header}"></div>
<div class="flex flex-1 overflow-hidden">
    <aside th:insert="~{contexa/fragments/admin-menu :: menu}"></aside>
    <main class="flex-1 p-6 lg:p-8 overflow-y-auto">
        <div class="modern-card ai-monitor-layout" id="ai-monitor"
             th:data-section="${section}" th:data-period="${period}"
             th:data-csrf-token="${_csrf != null ? _csrf.token : ''}"
             th:data-csrf-header="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}"
             th:data-label-loading="#{admin.aiMonitor.status.loading}"
             th:data-label-unavailable="#{admin.aiMonitor.status.unavailable}"
             th:data-label-no-data="#{admin.aiMonitor.status.noData}"
             th:data-label-key-metrics="#{admin.aiMonitor.section.keyMetrics}"
             th:data-label-llm-decisions="#{admin.aiMonitor.kpi.llmDecisions}"
             th:data-label-protectable="#{admin.aiMonitor.kpi.protectableDecisions}"
             th:data-label-failure-rate="#{admin.aiMonitor.kpi.failureRate}"
             th:data-label-timeout-rate="#{admin.aiMonitor.kpi.timeoutRate}"
             th:data-label-average-latency="#{admin.aiMonitor.kpi.averageLatency}"
             th:data-label-p95-latency="#{admin.aiMonitor.kpi.p95Latency}"
             th:data-label-parser-failures="#{admin.aiMonitor.kpi.parserFailures}"
             th:data-label-fallbacks="#{admin.aiMonitor.kpi.fallbacks}"
             th:data-label-timeouts="#{admin.aiMonitor.kpi.timeouts}"
             th:data-label-model-unavailable="#{admin.aiMonitor.kpi.modelUnavailable}"
             th:data-label-provider="#{admin.aiMonitor.section.provider}"
             th:data-label-model="#{admin.aiMonitor.section.model}"
             th:data-label-prompt-template="#{admin.aiMonitor.section.promptTemplate}"
             th:data-label-action="#{admin.aiMonitor.section.actionBreakdown}"
             th:data-label-proposed-action="#{admin.aiMonitor.section.proposedActionBreakdown}"
             th:data-label-final-action="#{admin.aiMonitor.section.finalActionBreakdown}"
             th:data-label-trigger-source="#{admin.aiMonitor.section.triggerSource}"
             th:data-label-risk-score="#{admin.aiMonitor.section.riskScoreDistribution}"
             th:data-label-confidence="#{admin.aiMonitor.section.confidenceDistribution}"
             th:data-label-failure-type="#{admin.aiMonitor.section.failureType}"
             th:data-label-fallback-category="#{admin.aiMonitor.section.fallbackCategory}"
             th:data-label-affected-requests="#{admin.aiMonitor.section.affectedRequests}"
             th:data-label-recent-failures="#{admin.aiMonitor.section.recentFailures}"
             th:data-label-slow-requests="#{admin.aiMonitor.section.slowRequests}"
             th:data-label-readiness="#{admin.aiMonitor.section.readinessCriteria}"
             th:data-label-current-session="#{admin.aiMonitor.session.current}"
             th:data-label-previous-sessions="#{admin.aiMonitor.session.previous}"
             th:data-label-no-previous="#{admin.aiMonitor.session.noPrevious}"
             th:data-label-reset="#{admin.aiMonitor.session.restartButton}"
             th:data-label-reset-confirm="#{admin.aiMonitor.session.restartConfirm}"
             th:data-label-reset-reason="#{admin.aiMonitor.session.restartReason}"
             th:data-label-reset-failed="#{admin.aiMonitor.session.restartFailed}"
             th:data-label-id="#{admin.aiMonitor.table.id}"
             th:data-label-from="#{admin.aiMonitor.table.from}"
             th:data-label-to="#{admin.aiMonitor.table.to}"
             th:data-label-ended-at="#{admin.aiMonitor.table.endedAt}">
            <div class="flex items-start justify-between gap-4 flex-wrap">
                <div>
                    <h1 class="text-2xl font-bold" style="color:#e2e8f0" th:text="#{admin.aiMonitor.title}">AI Security Monitor</h1>
                    <p class="text-sm mt-1" style="color:#94a3b8" th:text="#{admin.aiMonitor.subtitle}">AI decision quality and operations</p>
                </div>
                <span id="ai-monitor-range" class="text-xs" style="color:#64748b"></span>
            </div>
            <nav class="ai-monitor-tabs">
                <a th:href="@{/contexa/admin/ai-monitor(period=${period})}" class="ai-monitor-tab" th:classappend="${section == 'overview'} ? ' active' : ''" th:text="#{menu.aiMonitor.overview}">Overview</a>
                <a th:href="@{/contexa/admin/ai-monitor/llm(period=${period})}" class="ai-monitor-tab" th:classappend="${section == 'llm'} ? ' active' : ''" th:text="#{menu.aiMonitor.llm}">AI Decisions</a>
                <a th:href="@{/contexa/admin/ai-monitor/failures(period=${period})}" class="ai-monitor-tab" th:classappend="${section == 'failures'} ? ' active' : ''" th:text="#{menu.aiMonitor.failures}">Failures</a>
                <a th:href="@{/contexa/admin/ai-monitor/readiness(period=${period})}" class="ai-monitor-tab" th:classappend="${section == 'readiness'} ? ' active' : ''" th:text="#{menu.aiMonitor.readiness}">Readiness</a>
            </nav>
            <div class="ai-monitor-toolbar">
                <span class="ai-monitor-muted" th:text="#{admin.aiMonitor.period}">Period</span>
                <a th:href="${pagePath + '?period=day'}" class="ai-monitor-tab" th:classappend="${period == 'day'} ? ' active' : ''" th:text="#{admin.aiMonitor.period.day}">Day</a>
                <a th:href="${pagePath + '?period=week'}" class="ai-monitor-tab" th:classappend="${period == 'week'} ? ' active' : ''" th:text="#{admin.aiMonitor.period.week}">Week</a>
                <a th:href="${pagePath + '?period=month'}" class="ai-monitor-tab" th:classappend="${period == 'month'} ? ' active' : ''" th:text="#{admin.aiMonitor.period.month}">Month</a>
                <a th:href="${pagePath + '?period=year'}" class="ai-monitor-tab" th:classappend="${period == 'year'} ? ' active' : ''" th:text="#{admin.aiMonitor.period.year}">Year</a>
                <a class="ai-monitor-button" id="ai-monitor-export" href="#" th:text="#{admin.aiMonitor.export}">Export CSV</a>
            </div>
            <div id="ai-monitor-status" class="ai-monitor-band"><div class="ai-monitor-band-title" th:text="#{admin.aiMonitor.status.loading}">Loading</div></div>
            <div class="ai-monitor-kpis" id="ai-monitor-kpis"></div>
            <div class="ai-monitor-grid" id="ai-monitor-details"></div>
        </div>
    </main>
</div>
<div th:insert="~{contexa/fragments/footer :: footer}" class="mt-auto"></div>
<script th:src="@{/contexa/js/admin/ai-monitor.js?v=20260729}"></script>
</body>
</html>
