<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head><th:block th:replace="~{contexa/fragments/common-head :: head-elements(pageTitle=#{admin.company.records.title})}"></th:block></head>
<body class="flex flex-col min-h-screen font-sans">

<div th:insert="~{contexa/fragments/header :: header}"></div>
<div id="toast-container" class="fixed top-5 right-5 z-50 w-full max-w-xs sm:max-w-sm"></div>

<div class="flex flex-1">
    <aside th:insert="~{contexa/fragments/admin-menu :: menu}" class="hidden md:block"></aside>

    <main class="flex-1 p-6 md:p-10">
        <div class="mx-auto dark-card p-6 sm:p-8 rounded-xl">
            <div class="mb-8 text-center sm:text-left">
                <h1 class="text-3xl font-bold text-gradient" th:text="#{admin.company.records.title}">Company records</h1>
                <p class="text-dark-muted mt-1" th:text="#{admin.company.records.subtitle}">The company records requests are judged with</p>
            </div>

            <div class="flex flex-wrap gap-2 mb-6 items-center">
                <a th:href="@{/contexa/admin/company-records(subject=${subject}, target=${target}, tenantId=${tenantId})}"
                   th:classappend="${currentKind == null} ? 'filter-active' : 'filter-inactive'"
                   class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300"
                   th:text="#{admin.company.records.kind.all}">All</a>
                <a th:each="k : ${kinds}"
                   th:href="@{/contexa/admin/company-records(kind=${k}, subject=${subject}, target=${target}, tenantId=${tenantId})}"
                   th:classappend="${currentKind == k} ? 'filter-active' : 'filter-inactive'"
                   class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300"
                   th:text="#{${'admin.company.records.kind.' + k}}">Ticket</a>
            </div>

            <form th:action="@{/contexa/admin/company-records}" method="get" id="companyRecordsFilter"
                  class="flex flex-wrap items-center gap-2 mb-6" style="margin-top:0;">
                <input type="hidden" name="kind" th:value="${currentKind}" />
                <input type="text" name="subject" th:value="${subject}" class="px-3 py-2 rounded-lg text-sm filter-input"
                       th:placeholder="#{admin.company.records.filter.subject}" />
                <input type="text" name="target" th:value="${target}" class="px-3 py-2 rounded-lg text-sm filter-input"
                       th:placeholder="#{admin.company.records.filter.target}" />
                <input type="text" name="tenantId" th:value="${tenantId}" class="px-3 py-2 rounded-lg text-sm filter-input"
                       th:placeholder="#{admin.company.records.filter.tenant}" />
                <button type="submit" class="px-3 py-2 rounded-lg text-sm font-medium text-white" th:aria-label="#{common.search}"
                        style="background:linear-gradient(135deg,#6366f1,#4f46e5);">
                    <i class="fas fa-search"></i>
                </button>
                <a th:href="@{/contexa/admin/company-records}" class="px-3 py-2 rounded-lg text-sm font-medium"
                   th:aria-label="#{common.search.clear}"
                   style="color:#94a3b8;border:1px solid rgba(71,85,105,0.5);">
                    <i class="fas fa-times"></i>
                </a>
            </form>

            <p class="text-dark-muted text-sm mb-4" th:text="#{admin.company.records.note(${pageLimit})}">
                The newest records first. Integrations put them with the admin API.
            </p>

            <div class="overflow-x-auto shadow-md rounded-lg" tabindex="0" role="region" th:aria-label="#{admin.company.records.title}">
                <table class="min-w-full w-full text-sm text-left">
                    <thead class="text-xs text-white uppercase" style="background: linear-gradient(135deg, #1e293b 0%, #334155 100%);">
                    <tr>
                        <th scope="col" class="py-3.5 px-6 font-semibold" th:text="#{admin.company.records.table.kind}">Kind</th>
                        <th scope="col" class="py-3.5 px-6 font-semibold" th:text="#{admin.company.records.table.key}">Key</th>
                        <th scope="col" class="py-3.5 px-6 font-semibold" th:text="#{admin.company.records.table.subject}">Person</th>
                        <th scope="col" class="py-3.5 px-6 font-semibold" th:text="#{admin.company.records.table.target}">Target</th>
                        <th scope="col" class="py-3.5 px-6 font-semibold" th:text="#{admin.company.records.table.values}">Values</th>
                        <th scope="col" class="py-3.5 px-6 font-semibold" th:text="#{admin.company.records.table.ingested.by}">Put by</th>
                        <th scope="col" class="py-3.5 px-6 font-semibold" th:text="#{admin.company.records.table.ingested.at}">Put at</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y" style="background: rgba(15, 23, 42, 0.6); color: #e2e8f0; border-color: rgba(71, 85, 105, 0.3);">
                    <tr th:each="r : ${records}" style="border-color: rgba(71, 85, 105, 0.3);">
                        <td class="py-4 px-6" th:text="#{${'admin.company.records.kind.' + r.kind}}">Ticket</td>
                        <td class="py-4 px-6 font-mono text-xs" th:text="${r.key}"></td>
                        <td class="py-4 px-6">
                            <a th:if="${r.subject != null}" th:href="@{/contexa/admin/company-records(subject=${r.subject}, tenantId=${tenantId})}"
                               th:text="${r.subject}" style="color:#818cf8;"></a>
                            <span th:if="${r.subject == null}" style="color: #64748b;">-</span>
                        </td>
                        <td class="py-4 px-6">
                            <a th:if="${r.target != null}" th:href="@{/contexa/admin/company-records(target=${r.target}, tenantId=${tenantId})}"
                               th:text="${r.target}" style="color:#818cf8;"></a>
                            <span th:if="${r.target == null}" style="color: #64748b;">-</span>
                        </td>
                        <td class="py-4 px-6" th:text="${r.summary}"></td>
                        <td class="py-4 px-6" th:text="${r.ingestedBy}"></td>
                        <td class="py-4 px-6" th:text="${#temporals.format(r.ingestedAt, 'yyyy-MM-dd HH:mm')}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(records)}">
                        <td colspan="7" class="py-4 px-6 text-center" style="color: #94a3b8;" th:text="#{admin.company.records.empty}">
                            No company records.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>
</div>

<div th:insert="~{contexa/fragments/footer :: footer}" class="mt-auto"></div>

<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', () => {
        const errorMessage = /*[[${errorMessage}]]*/ null;
        if (errorMessage) {
            showToast(errorMessage, 'error');
        }
    });
    /*]]>*/
</script>

<style>
    .filter-active {
        background: rgba(99, 102, 241, 0.3);
        color: #818cf8;
        border: 1px solid rgba(99, 102, 241, 0.5);
    }
    .filter-inactive {
        background: rgba(30, 41, 59, 0.5);
        color: #94a3b8;
        border: 1px solid rgba(71, 85, 105, 0.3);
    }
    .filter-inactive:hover {
        background: rgba(51, 65, 85, 0.5);
        color: #e2e8f0;
    }
    .filter-input {
        background: rgba(30, 41, 59, 0.6);
        border: 2px solid rgba(71, 85, 105, 0.5);
        color: #e2e8f0;
        max-width: 220px;
    }
</style>
</body>
</html>
