<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <th:block th:replace="~{contexa/admin/prompt-quality/fragments :: head(${pageTitle})}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin/prompt-quality/prompt-quality-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/admin/prompt-quality/prompt-quality-context-standards.css}">
</head>
<body class="page-shell">
<div th:replace="~{contexa/fragments/header :: header}"></div>
<div th:replace="~{contexa/fragments/admin-menu :: menu}"></div>

<main class="page-body pqa-shell" data-pqa-page="dashboard" data-pqa-stage="QUALITY_PROCESS_HOME">
    <div th:replace="~{contexa/admin/prompt-quality/fragments :: engineNav(${navigation})}"></div>
    <section class="pqa-workspace">
        <div th:replace="~{contexa/admin/prompt-quality/fragments :: pageHeader(#{enterprise.pqa.dashboard.title}, #{enterprise.pqa.dashboard.subtitle})}"></div>
        <div th:replace="~{contexa/admin/prompt-quality/fragments :: apiStatus}"></div>

        <section class="section-card pqa-resource-state-search" data-pqa-resource-state-search-panel>
            <div class="section-header-inline">
                <h2 class="section-title">리소스 검사 상태 검색</h2>
            </div>
            <form class="pqa-resource-state-search-form" data-pqa-resource-state-search-form>
                <label class="input-label" for="pqa-resource-state-search-input">리소스 ID</label>
                <input id="pqa-resource-state-search-input"
                       class="input-field"
                       type="search"
                       data-pqa-resource-state-search
                       placeholder="orders.read">
                <label class="input-label" for="pqa-resource-state-search-url">리소스 URL</label>
                <input id="pqa-resource-state-search-url"
                       class="input-field"
                       type="search"
                       data-pqa-resource-state-url
                       placeholder="/contexa/admin/api/orders/{orderId}">
                <label class="input-label" for="pqa-resource-state-search-method">메서드</label>
                <select id="pqa-resource-state-search-method"
                        class="input-field"
                        data-pqa-resource-state-method>
                    <option value="">자동</option>
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="PATCH">PATCH</option>
                    <option value="DELETE">DELETE</option>
                </select>
                <button type="submit" class="button primary">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    검색
                </button>
            </form>
            <div class="pqa-resource-state-search-result" data-pqa-resource-state-search-result></div>
        </section>

        <!-- Hero 메가 패널 : 게이지 + 핵심 KPI 6 + 행동 -->
        <section class="pqa-dash-hero-mega" data-pqa-dash-hero></section>

        <!-- 표준공정 전광판 : 실제 요청 증거 기반 8 단계 -->
        <section class="section-card pqa-dash-pipeline-card" style="margin-top:1.8rem;">
            <div class="section-header-inline">
                <h2 class="section-title" th:text="#{enterprise.pqa.dashboard.pipeline.title}"></h2>
            </div>
            <p class="muted pqa-section-subtitle" th:text="#{enterprise.pqa.dashboard.pipeline.subtitle}"></p>
            <div class="pqa-dash-pipeline" data-pqa-dash-pipeline></div>
        </section>

        <!-- 공정 핵심 차트 -->
        <section class="pqa-dash-chart-grid" style="margin-top:1.8rem;">
            <article class="section-card">
                <h3 class="section-title" th:text="#{enterprise.pqa.dashboard.chart.stages.title}"></h3>
                <p class="muted pqa-section-subtitle" th:text="#{enterprise.pqa.dashboard.chart.stages.subtitle}"></p>
                <div class="pqa-chart-box"><canvas data-pqa-dash-chart-stages></canvas></div>
            </article>
            <article class="section-card">
                <h3 class="section-title" th:text="#{enterprise.pqa.dashboard.chart.evidence.title}"></h3>
                <p class="muted pqa-section-subtitle" th:text="#{enterprise.pqa.dashboard.chart.evidence.subtitle}"></p>
                <div class="pqa-chart-box"><canvas data-pqa-dash-chart-evidence></canvas></div>
            </article>
        </section>

        <!-- 3 컬럼 실시간 경보 스트림 -->
        

        <!-- 보조 관리 도구 -->
        

        <!-- Top 5 우선순위 할 일 -->
        
    </section>
</main>

<div th:replace="~{contexa/fragments/footer :: footer}"></div>
<script th:src="@{/js/vendor/chart.umd.min.js}"></script>
<script type="module" th:src="@{/js/admin/prompt-quality/dashboard-page.js}"></script>
</body>
</html>
