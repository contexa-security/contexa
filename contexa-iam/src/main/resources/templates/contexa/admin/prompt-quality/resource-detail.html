<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <th:block th:replace="~{contexa/admin/prompt-quality/fragments :: head(${pageTitle})}"></th:block>
    <link rel="stylesheet" th:href="@{/css/enterprise-operations.css}">
    <link rel="stylesheet" th:href="@{/css/saas-control-plane.css}">
    <link rel="stylesheet" th:href="@{/css/admin/prompt-quality/prompt-quality-resource-detail.css}">
</head>
<body class="page-shell">
<div th:replace="~{contexa/fragments/header :: header}"></div>
<div th:replace="~{contexa/fragments/admin-menu :: menu}"></div>

<main class="page-body pqa-shell"
      data-pqa-page="resource-detail"
      data-pqa-stage="PROTECTABLE_RESOURCES"
      th:attr="data-resource-id=${resourceId},data-resource-url=${resourceUrl},data-http-method=${httpMethod}">
    <div th:replace="~{contexa/admin/prompt-quality/fragments :: engineNav(${navigation})}"></div>
    <section class="pqa-workspace">
        <div th:replace="~{contexa/admin/prompt-quality/fragments :: pageHeader(#{enterprise.pqa.resourceDetail.pageTitle}, #{enterprise.pqa.resourceDetail.pageSubtitle})}"></div>
        <div th:replace="~{contexa/admin/prompt-quality/fragments :: apiStatus}"></div>

        <section class="summary-grid" data-pqa-resource-strip></section>



        <article class="section-card pqa-resource-detail-section">
            <div class="section-header-inline">
                <h2 class="section-title" th:text="#{enterprise.pqa.resourceDetail.section.nextAction}"></h2>
            </div>
            <div data-pqa-next-action></div>
        </article>
        <article class="section-card pqa-resource-detail-section">
            <div class="section-header-inline">
                <h2 class="section-title" th:text="#{enterprise.pqa.resourceDetail.section.ownership}"></h2>
            </div>
            <div data-pqa-ownership></div>
        </article>

        <section class="section-card pqa-resource-detail-section">
            <div class="section-header-inline">
                <h2 class="section-title" th:text="#{enterprise.pqa.resourceDetail.section.verificationHistory}">검증 연결 이력</h2>
            </div>
            <div data-pqa-resource-lineage></div>
        </section>

        <section class="section-card pqa-resource-detail-section">
            <div class="section-header-inline">
                <h2 class="section-title" th:text="#{enterprise.pqa.resourceDetail.tab.history}"></h2>
            </div>
            <div data-pqa-resource-history></div>
        </section>
    </section>
</main>

<div th:replace="~{contexa/fragments/footer :: footer}"></div>
<script type="module" th:src="@{/js/admin/prompt-quality/resource-detail-page.js}"></script>
</body>
</html>
