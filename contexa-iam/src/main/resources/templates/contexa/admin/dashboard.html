<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <th:block th:replace="~{contexa/fragments/common-head :: head-elements(pageTitle=#{dashboard.ui.title})}"></th:block>
    <link rel="stylesheet" th:href="@{/contexa/css/policy-center.css}" />
    <link rel="stylesheet" th:href="@{/contexa/css/zero-trust-console.css?v=20261118-k101}" />
</head>
<body class="flex flex-col min-h-screen font-sans">
<div th:insert="~{contexa/fragments/header :: header}"></div>
<div class="flex flex-1 overflow-hidden">
    <aside th:insert="~{contexa/fragments/admin-menu :: menu}"></aside>
    <main class="flex-1 p-6 lg:p-8 overflow-y-auto">
        <!--
          The admin dashboard (plan step 9, approved mockup v4) in the Zero Trust console's frame: the page card, the
          gradient title and its question, the period and the band in a filter box, and the place the script draws in.
          Its numbers come from the dashboard's JSON (data-api-base), its words from the messages below.
        -->
        <div class="zt-page modern-card" id="zt-console" th:data-api-base="${apiBase}" th:data-screen="${screen}">
            <script type="application/json" id="zt-messages" th:utext="${scriptMessagesJson}"></script>
            <div class="zt-title-row mb-6">
                <div class="min-w-0">
                    <h1 class="text-3xl font-bold pc-header-gradient" th:text="#{dashboard.ui.title}">Dashboard</h1>
                    <p class="text-dark-muted mt-1" th:text="#{dashboard.ui.question}">Question</p>
                </div>
                <div class="zt-toolbar"></div>
            </div>
            <div class="filter-container zt-band-box mb-6">
                <div class="zt-period" id="zt-period" role="group" th:attr="aria-label=#{zt.console.ui.period}"></div>
                <div class="zt-band" id="zt-band" aria-live="polite"></div>
            </div>
            <div class="zt-stack" id="zt-content"></div>
        </div>
    </main>
</div>
<div th:insert="~{contexa/fragments/footer :: footer}" class="mt-auto"></div>
<script th:src="@{/contexa/js/vendor/chart.umd.min.js}"></script>
<script th:src="@{/contexa/js/admin/zero-trust/console-common.js?v=20261118-k90}"></script>
<script th:src="@{/contexa/js/admin/dashboard.js?v=20261118-k101}"></script>
</body>
</html>
