<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="head-elements (pageTitle)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle ?: #messages.msg('app.title')}">Authentication Platform</title>
    <link rel="icon" href="data:,">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (window.tailwind) {
            tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'app-primary': '#6366f1',        // bright indigo (primary brand color)
                        'app-primary-dark': '#4f46e5',  // dark indigo
                        'app-secondary': '#1e293b',     // dark slate (sidebar, card background)
                        'app-accent': '#38bdf8',        // bright sky blue (accent color)
                        'app-accent-hover': '#0284c7',  // dark sky blue
                        'app-dark-bg': '#050810',       // darkest background
                        'app-dark-bg-secondary': '#0a0f1c', // second darkest background
                        'app-dark-bg-tertiary': '#0f172a',  // third darkest background
                        'app-light-gray': '#e2e8f0',    // bright text
                        'app-dark-gray': '#94a3b8',     // secondary text
                        'app-border': '#334155',         // dark border
                        'app-input-focus-border': '#6366f1', // input field focus
                        'error': '#ef4444',             // red (error)
                        'success': '#22c55e',           // green (success)
                        'info': '#3b82f6',              // blue (info)
                        'warning': '#f59e0b'            // orange (warning)
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', '"Noto Sans"', 'sans-serif'],
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                        'gradient-conic': 'conic-gradient(from 180deg at 50% 50%, var(--tw-gradient-stops))',
                    },
                    animation: {
                        'pulse-glow': 'pulse-glow 2s infinite',
                        'float': 'float 3s ease-in-out infinite',
                        'slide-in': 'slideInFromTop 0.6s ease-out',
                    }
                },
                important: false
            }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <link rel="stylesheet" th:href="@{/contexa/css/main.css}" />
    <link rel="stylesheet" th:href="@{/contexa/css/admin-menu.css?v=20260618-pqa-label}" />
    <link rel="stylesheet" th:href="@{/contexa/css/modern-checkbox.css}">
    <link rel="stylesheet" th:href="@{/contexa/css/custom-select.css}" />

    <script th:src="@{/contexa/js/toast.js}"></script>
    <script th:src="@{/contexa/js/custom-select.js}"></script>

    <th:block th:if="${_csrf != null}">
        <meta name="_csrf" th:content="${_csrf.token}" />
        <meta name="_csrf_header" th:content="${_csrf.headerName}" />
        <meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />
    </th:block>

    <style>
        .admin-sidebar * {
            box-sizing: border-box;
        }

        .admin-sidebar ul,
        .admin-sidebar li {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .admin-sidebar svg {
            vertical-align: middle;
        }

    </style>
</th:block>
</html>
