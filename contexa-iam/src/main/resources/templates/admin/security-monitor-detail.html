<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <th:block th:replace="~{fragments/common-head :: head-elements(pageTitle=#{admin.security.monitor.detail.page.title})}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/policy-center.css}" />
</head>
<body class="flex flex-col min-h-screen font-sans">

<div th:insert="~{fragments/header :: header}"></div>

<div class="flex flex-1 overflow-hidden">
    <aside th:insert="~{fragments/admin-menu :: menu}"></aside>

    <main class="flex-1 p-8 lg:p-12 overflow-y-auto">
        <div style="max-width: 72rem; margin: 0 auto;">

            <div class="flex items-center justify-between mb-10">
                <div>
                    <h1 class="text-2xl font-bold" style="color: #e2e8f0;">
                        <i class="fas fa-shield-alt mr-3" style="color: #818cf8; font-size: 1.5rem;"></i><span th:text="#{admin.security.monitor.detail.title}">Security Event Details</span>
                    </h1>
                    <p class="text-sm mt-2" style="color: #64748b;"><span th:text="#{admin.security.monitor.detail.event.id}">Event ID</span>: <span class="font-mono" th:text="${log.id}"></span></p>
                </div>
                <a th:href="@{/admin/security-monitor}" class="modern-btn-secondary px-5 py-2.5 text-sm" style="text-decoration: none;">
                    <i class="fas fa-arrow-left mr-2"></i> <span th:text="#{admin.security.monitor.detail.back}">Back to List</span>
                </a>
            </div>

            <div class="rounded-xl p-6 mb-8" style="background: rgba(15,23,42,0.6); border: 1px solid rgba(71,85,105,0.4);">
                <div class="flex items-center gap-5">
                    <span class="px-5 py-2.5 rounded-full text-base font-bold"
                          th:style="${log.eventCategory == 'SECURITY_DECISION' ? 'background: rgba(139,92,246,0.2); color: #a78bfa; border: 1px solid rgba(139,92,246,0.3);' :
                                      log.eventCategory == 'AUTHENTICATION_SUCCESS' ? 'background: rgba(34,197,94,0.2); color: #4ade80; border: 1px solid rgba(34,197,94,0.3);' :
                                      log.eventCategory == 'AUTHENTICATION_FAILURE' ? 'background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.3);' :
                                      log.eventCategory == 'ADMIN_OVERRIDE' ? 'background: rgba(99,102,241,0.2); color: #818cf8; border: 1px solid rgba(99,102,241,0.3);' :
                                      'background: rgba(71,85,105,0.2); color: #94a3b8; border: 1px solid rgba(71,85,105,0.3);'}"
                          th:text="${log.eventCategory ?: 'UNKNOWN'}"></span>
                    <span class="text-2xl font-bold"
                          th:style="${log.decision == 'ALLOW' ? 'color: #4ade80;' : log.decision == 'DENY' ? 'color: #f87171;' : 'color: #fbbf24;'}"
                          th:text="${log.decision}"></span>
                    <div th:if="${log.riskScore != null}" class="flex items-center gap-3 ml-auto">
                        <div style="width: 8rem; height: 0.5rem; background: rgba(71,85,105,0.3); border-radius: 0.25rem; overflow: hidden;">
                            <div th:style="${'width: ' + (log.riskScore * 100) + '%; height: 100%; border-radius: 0.25rem; background: ' + (log.riskScore >= 0.8 ? '#f87171' : (log.riskScore >= 0.5 ? '#fbbf24' : '#4ade80')) + ';'}"></div>
                        </div>
                        <span class="text-lg font-bold"
                              th:style="${log.riskScore >= 0.8 ? 'color: #f87171;' : log.riskScore >= 0.5 ? 'color: #fbbf24;' : 'color: #4ade80;'}"
                              th:text="${#numbers.formatDecimal(log.riskScore * 100, 1, 0) + '%'}"></span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">

                <div class="rounded-xl p-6" style="background: rgba(30,41,59,0.5); border: 1px solid rgba(99,102,241,0.3);">
                    <div class="text-sm font-bold mb-4" style="color: #818cf8; letter-spacing: 0.05em;">
                        <i class="fas fa-user mr-2"></i> <span th:text="#{admin.security.monitor.detail.who}">WHO</span>
                    </div>
                    <div class="text-lg font-bold mb-3" style="color: #e2e8f0;" th:text="${log.principalName}">-</div>
                    <div class="space-y-2">
                        <div class="text-sm" style="color: #94a3b8;"><span th:text="#{admin.security.monitor.detail.ip}">IP</span>: <span class="font-mono" style="color: #cbd5e1;" th:text="${log.clientIp ?: '-'}"></span></div>
                        <div class="text-sm" style="color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"
                             th:text="${'UA: ' + (log.userAgent ?: '-')}"></div>
                    </div>
                </div>

                <div class="rounded-xl p-6" style="background: rgba(30,41,59,0.5); border: 1px solid rgba(245,158,11,0.3);">
                    <div class="text-sm font-bold mb-4" style="color: #f59e0b; letter-spacing: 0.05em;">
                        <i class="fas fa-clock mr-2"></i> <span th:text="#{admin.security.monitor.detail.when}">WHEN</span>
                    </div>
                    <div class="text-lg font-bold mb-3" style="color: #e2e8f0;" th:text="${#temporals.format(log.timestamp, 'yyyy-MM-dd HH:mm:ss')}">-</div>
                    <div class="space-y-2">
                        <div th:if="${log.sessionId != null}" class="text-sm" style="color: #94a3b8;"><span th:text="#{admin.security.monitor.detail.session}">Session</span>: <span class="font-mono" style="color: #cbd5e1;" th:text="${log.sessionId}"></span></div>
                        <div th:if="${log.correlationId != null}" class="text-sm" style="color: #94a3b8;"><span th:text="#{admin.security.monitor.detail.correlation}">Correlation</span>: <span class="font-mono" style="color: #cbd5e1;" th:text="${log.correlationId}"></span></div>
                    </div>
                </div>

                <div class="rounded-xl p-6" style="background: rgba(30,41,59,0.5); border: 1px solid rgba(16,185,129,0.3);">
                    <div class="text-sm font-bold mb-4" style="color: #10b981; letter-spacing: 0.05em;">
                        <i class="fas fa-crosshairs mr-2"></i> <span th:text="#{admin.security.monitor.detail.what}">WHAT</span>
                    </div>
                    <div class="text-lg mb-3" style="color: #e2e8f0;">
                        <span th:if="${log.httpMethod != null}" class="font-bold mr-2 px-2 py-0.5 rounded text-sm"
                              style="background: rgba(99,102,241,0.2); color: #a5b4fc;" th:text="${log.httpMethod}"></span>
                        <span class="font-mono" th:text="${log.requestUri ?: log.resourceUri ?: log.resourceIdentifier ?: '-'}"></span>
                    </div>
                    <div th:if="${log.action != null}" class="text-sm" style="color: #94a3b8;"><span th:text="#{admin.security.monitor.detail.action}">Action</span>: <span style="color: #cbd5e1;" th:text="${log.action}"></span></div>
                </div>

                <div class="rounded-xl p-6" style="background: rgba(30,41,59,0.5); border: 1px solid rgba(248,113,113,0.3);">
                    <div class="text-sm font-bold mb-4" style="color: #f87171; letter-spacing: 0.05em;">
                        <i class="fas fa-gavel mr-2"></i> <span th:text="#{admin.security.monitor.detail.why}">WHY</span>
                    </div>
                    <div class="flex items-center gap-4 mb-3">
                        <span class="text-2xl font-bold"
                              th:style="${log.decision == 'ALLOW' ? 'color: #4ade80;' : log.decision == 'DENY' ? 'color: #f87171;' : 'color: #fbbf24;'}"
                              th:text="${log.decision}"></span>
                        <span th:if="${log.outcome != null}" class="text-sm" style="color: #94a3b8;" th:text="${'(' + log.outcome + ')'}"></span>
                    </div>
                    <div th:if="${log.reason != null}" class="text-sm" style="color: #cbd5e1; line-height: 1.7;" th:text="${log.reason}"></div>
                </div>
            </div>

            <div th:if="${log.details != null && !log.details.isBlank()}" class="mb-8">
                <div class="text-sm font-bold mb-3" style="color: #94a3b8;">
                    <i class="fas fa-code mr-2"></i> <span th:text="#{admin.security.monitor.detail.details}">Detailed Data (Details)</span>
                </div>
                <div class="rounded-xl" style="background: rgba(15,23,42,0.7); border: 1px solid rgba(71,85,105,0.3); padding: 1.5rem; overflow-x: auto;">
                    <pre style="color: #cbd5e1; font-size: 0.875rem; font-family: 'Monaco', 'Consolas', monospace; white-space: pre-wrap; margin: 0; line-height: 1.6;" th:text="${log.details}"></pre>
                </div>
            </div>

            <div class="flex items-center gap-4 text-sm" style="color: #64748b;">
                <span th:if="${log.eventSource != null}"><i class="fas fa-server mr-2"></i> <span th:text="#{admin.security.monitor.detail.source}">Source</span>: <span style="color: #94a3b8;" th:text="${log.eventSource}"></span></span>
            </div>
        </div>
    </main>
</div>

<div th:insert="~{fragments/footer :: footer}" class="mt-auto"></div>
</body>
</html>
