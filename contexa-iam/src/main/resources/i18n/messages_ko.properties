enterprise.pqa.runtimeEvidence.next.integrityError=증거가 변조되었을 수 있습니다. 같은 요청을 다시 실행해 새 증거 번호로 검사하십시오.
enterprise.pqa.runtimeEvidence.next.inspect=운영 승격 검사에서 이 요청 증거 번호를 평가하십시오.
enterprise.pqa.runtimeEvidence.warning.rawSystemPromptMissing=원본 시스템 프롬프트가 저장되지 않았습니다.
enterprise.pqa.runtimeEvidence.warning.rawUserPromptMissing=원본 사용자 프롬프트가 저장되지 않았습니다.
enterprise.pqa.runtimeEvidence.warning.llmSystemPromptMissing=LLM에 전달된 시스템 프롬프트가 없습니다.
enterprise.pqa.runtimeEvidence.warning.llmUserPromptMissing=LLM에 전달된 사용자 프롬프트가 없습니다.
enterprise.pqa.runtimeEvidence.warning.integrityMismatch=증거 해시가 맞지 않습니다.
enterprise.pqa.runtimeEvidence.warning.missingKnowledgeHighConfidence=프롬프트 컨텍스트 신호가 있는 증거입니다. 운영 승격 전 공식 검사에서 차단 사유인지 확인해야 합니다.
enterprise.pqa.runtimeEvidence.warning.missingKnowledgeReview=프롬프트 컨텍스트 신호가 있는 증거입니다. 운영 승격 전 공식 검사에서 원인과 보강 책임을 확정해야 합니다.
