enterprise.pqa.runtimeEvidence.title.shortageSignals=Prompt context signals
enterprise.pqa.runtimeEvidence.shortageSignals.help=These are pre-inspection signals detected from the sealed user prompt by fixed rules. They are not conclusions; they identify which context producers and baselines official inspection must verify.
enterprise.pqa.runtimeEvidence.title.preflight=Official inspection input gate
enterprise.pqa.runtimeEvidence.preflight.help=This stage is not a quality verdict. It only verifies that the sealed evidence represents the final LLM system/user prompts and hashes. Context values such as UNKNOWN or PROVISIONAL become quality issues only in the 12-metric inspection.
