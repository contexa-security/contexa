enterprise.pqa.runtimeEvidence.preflight.readyDetail=봉인 증거와 최종 LLM 프롬프트의 필수 연결이 확인되었습니다. 다음 단계에서 12개 지표로 실제 프롬프트 품질을 판정하십시오.
enterprise.pqa.runtimeEvidence.preflight.checks=입력 전제
enterprise.pqa.runtimeEvidence.preflight.blocking=문제
enterprise.pqa.runtimeEvidence.preflight.blockingTitle=공식검사 실행 전 해결해야 할 항목
enterprise.pqa.runtimeEvidence.signal.empty=감지된 프롬프트 컨텍스트 신호가 없습니다.
enterprise.pqa.runtimeEvidence.signal.category.MISSING_CONTEXT=근거 부족
enterprise.pqa.runtimeEvidence.signal.category.MISSING_CONTEXT.description=프롬프트가 필요한 사실, 섹션, 또는 컨텍스트 생산자 누락을 직접 선언한 항목입니다.
enterprise.pqa.runtimeEvidence.signal.category.BASELINE_MISMATCH=기준선 불일치
enterprise.pqa.runtimeEvidence.signal.category.BASELINE_MISMATCH.description=현재 요청이 관찰된 개인 기준선 또는 직접 비교 이력과 맞지 않는 항목입니다. 부족 정보와 구분해 검사합니다.
enterprise.pqa.runtimeEvidence.signal.category.PROVISIONAL_EVIDENCE=임시 근거
enterprise.pqa.runtimeEvidence.signal.category.PROVISIONAL_EVIDENCE.description=업무 프로필, 역할 범위, 권한 근거가 아직 확정 상태가 아닌 항목입니다.
enterprise.pqa.runtimeEvidence.signal.category.UNCERTAINTY_MARKER=불확실성 표식
enterprise.pqa.runtimeEvidence.signal.category.UNCERTAINTY_MARKER.description=프롬프트 안의 UNKNOWN, INSUFFICIENT 같은 예약어가 남아 있는 항목입니다. 어떤 필드인지 공식 검사에서 분해해야 합니다.
enterprise.pqa.runtimeEvidence.signal.category.OTHER=기타 신호
enterprise.pqa.runtimeEvidence.signal.category.OTHER.description=분류표에 아직 연결되지 않은 프롬프트 컨텍스트 신호입니다.
enterprise.pqa.runtimeEvidence.signal.explicitMissingKnowledge=명시적 컨텍스트 부족 섹션이 포함됨
enterprise.pqa.runtimeEvidence.signal.explicitMissingKnowledge.rule=사용자 프롬프트에 === EXPLICIT MISSING KNOWLEDGE 섹션 마커가 있으면 감지합니다.
enterprise.pqa.runtimeEvidence.signal.explicitMissingKnowledge.evidence=발견 근거: === EXPLICIT MISSING KNOWLEDGE 마커
enterprise.pqa.runtimeEvidence.signal.explicitMissingKnowledge.explanation=프롬프트 조립 결과가 필요한 일부 맥락이 부족하다고 직접 선언한 상태입니다.
enterprise.pqa.runtimeEvidence.signal.explicitMissingKnowledge.impact=공식 검사는 이 선언이 허용 가능한 학습 상태인지, 프롬프트 결함인지, 컨텍스트 생산자 누락인지 분리해야 합니다.
enterprise.pqa.runtimeEvidence.signal.explicitMissingKnowledge.next=어떤 컨텍스트 생산자가 사실을 누락했는지 확인하고 요청 컨텍스트 또는 학습 컨텍스트 소스를 보강하십시오.
enterprise.pqa.runtimeEvidence.signal.missingCriticalFacts=핵심 컨텍스트 사실이 부족 항목으로 선언됨
enterprise.pqa.runtimeEvidence.signal.missingCriticalFacts.rule=프롬프트에 missingCriticalFacts가 있고 값이 빈 목록이 아니면 감지합니다.
enterprise.pqa.runtimeEvidence.signal.missingCriticalFacts.evidence=발견 근거: missingCriticalFacts 값이 비어 있지 않음
enterprise.pqa.runtimeEvidence.signal.missingCriticalFacts.explanation=프롬프트 품질에 필요한 핵심 사실이 부족 항목으로 명시되었습니다.
enterprise.pqa.runtimeEvidence.signal.missingCriticalFacts.impact=공식 검사에서 이 누락이 요청 컨텍스트, RAG, 기준선, 권한 데이터 중 어디에서 발생했는지 찾아야 합니다.
enterprise.pqa.runtimeEvidence.signal.missingCriticalFacts.next=실제 프롬프트 비교와 12개 프롬프트 품질 지표 상세에서 각 부족 사실을 생산자와 개선 조치에 연결하십시오.
enterprise.pqa.runtimeEvidence.signal.accessHourOutsideObserved=접근 시간이 관찰 기준선 밖으로 표시됨
enterprise.pqa.runtimeEvidence.signal.accessHourOutsideObserved.rule=프롬프트에 currentAccessHourPresentInObservedHours: false 값이 있으면 감지합니다.
enterprise.pqa.runtimeEvidence.signal.accessHourOutsideObserved.evidence=발견 근거: currentAccessHourPresentInObservedHours=false
enterprise.pqa.runtimeEvidence.signal.accessHourOutsideObserved.explanation=현재 요청 시간이 사용자의 관찰된 정상 접근 시간 기준선과 맞지 않는다는 의미입니다.
enterprise.pqa.runtimeEvidence.signal.accessHourOutsideObserved.impact=부족 정보가 아니라 기준선 불일치 신호입니다. 공식 검사는 학습 기준선 미성숙과 실제 예외 요청을 분리해야 합니다.
enterprise.pqa.runtimeEvidence.signal.accessHourOutsideObserved.next=기준선이 부족한지, 사용자의 정당한 예외가 있는지, 추가 확인이 필요한 요청인지 확인하십시오.
enterprise.pqa.runtimeEvidence.signal.networkOutsideObserved=네트워크가 관찰 기준선 밖으로 표시됨
enterprise.pqa.runtimeEvidence.signal.networkOutsideObserved.rule=프롬프트에 currentNetworkPresentInObservedNetworks: false 값이 있으면 감지합니다.
enterprise.pqa.runtimeEvidence.signal.networkOutsideObserved.evidence=발견 근거: currentNetworkPresentInObservedNetworks=false
enterprise.pqa.runtimeEvidence.signal.networkOutsideObserved.explanation=현재 요청 네트워크가 사용자의 관찰된 네트워크 기준선과 맞지 않는다는 의미입니다.
enterprise.pqa.runtimeEvidence.signal.networkOutsideObserved.impact=부족 사실 결론이 아니라 기준선 불일치입니다. 공식 검사는 기준선 수집 부족, 신뢰 네트워크 분류, 합법 예외 여부를 분리해야 합니다.
enterprise.pqa.runtimeEvidence.signal.networkOutsideObserved.next=관찰 네트워크 커버리지, 신뢰 네트워크 분류, 예외 등록 필요 여부를 확인하십시오.
enterprise.pqa.runtimeEvidence.signal.browserOutsideObserved=브라우저가 관찰 기준선 밖으로 표시됨
enterprise.pqa.runtimeEvidence.signal.browserOutsideObserved.rule=프롬프트에 currentBrowserPresentInObservedBrowsers: false 값이 있으면 감지합니다.
enterprise.pqa.runtimeEvidence.signal.browserOutsideObserved.evidence=발견 근거: currentBrowserPresentInObservedBrowsers=false
enterprise.pqa.runtimeEvidence.signal.browserOutsideObserved.explanation=현재 브라우저 근거가 사용자의 관찰된 브라우저 기준선과 맞지 않는다는 의미입니다.
enterprise.pqa.runtimeEvidence.signal.browserOutsideObserved.impact=기준선 드리프트 또는 학습 컨텍스트 미성숙 신호입니다. 단독 권한 결함으로 표시하지 않습니다.
enterprise.pqa.runtimeEvidence.signal.browserOutsideObserved.next=브라우저 기준선 수집, 장치 지문 연속성, 관찰 프로필 갱신 필요 여부를 확인하십시오.
enterprise.pqa.runtimeEvidence.signal.noDirectPersonalComparable=직접 비교 가능한 개인 요청 이력이 없음
enterprise.pqa.runtimeEvidence.signal.noDirectPersonalComparable.rule=프롬프트에 currentRequestCombinationEvidenceScope: NO_DIRECT_PERSONAL_COMPARABLE 값이 있으면 감지합니다.
enterprise.pqa.runtimeEvidence.signal.noDirectPersonalComparable.evidence=발견 근거: currentRequestCombinationEvidenceScope=NO_DIRECT_PERSONAL_COMPARABLE
enterprise.pqa.runtimeEvidence.signal.noDirectPersonalComparable.explanation=현재 요청 조합과 직접 비교할 수 있는 개인 이력이 없다는 의미입니다.
enterprise.pqa.runtimeEvidence.signal.noDirectPersonalComparable.impact=프롬프트 검사는 가능하지만, 현재 조합이 정상이라고 기준선으로 증명할 수는 없습니다.
enterprise.pqa.runtimeEvidence.signal.noDirectPersonalComparable.next=비교 이력 수집이 미성숙한지, 이 요청 조합을 승인된 기준선 샘플로 보강해야 하는지 확인하십시오.
enterprise.pqa.runtimeEvidence.signal.workProfileProvisional=업무 프로필 근거가 임시 상태로 조립됨
enterprise.pqa.runtimeEvidence.signal.workProfileProvisional.rule=프롬프트에 workProfileEvidenceState: PROVISIONAL 값이 있으면 감지합니다.
enterprise.pqa.runtimeEvidence.signal.workProfileProvisional.evidence=발견 근거: workProfileEvidenceState=PROVISIONAL
enterprise.pqa.runtimeEvidence.signal.workProfileProvisional.explanation=개인 업무 프로필이 학습 중이거나 아직 확정되지 않은 기준선에서 조립되었습니다.
enterprise.pqa.runtimeEvidence.signal.workProfileProvisional.impact=공식 검사는 허용 가능한 학습 상태의 불확실성과 프롬프트 품질 결함을 분리해야 합니다.
enterprise.pqa.runtimeEvidence.signal.workProfileProvisional.next=기준선 관찰 건수, 관찰 일수, fallback 비율, 추가 학습 샘플 필요 여부를 확인하십시오.
enterprise.pqa.runtimeEvidence.signal.roleScopeProvisional=역할 범위 근거가 임시 상태로 조립됨
enterprise.pqa.runtimeEvidence.signal.roleScopeProvisional.rule=프롬프트에 roleScopeEvidenceState: PROVISIONAL 값이 있으면 감지합니다.
enterprise.pqa.runtimeEvidence.signal.roleScopeProvisional.evidence=발견 근거: roleScopeEvidenceState=PROVISIONAL
enterprise.pqa.runtimeEvidence.signal.roleScopeProvisional.explanation=역할과 권한 범위 근거가 확정된 권한 증거가 아니라 임시 또는 미확정 근거로 조립되었습니다.
enterprise.pqa.runtimeEvidence.signal.roleScopeProvisional.impact=임시 권한 근거가 확정 근거처럼 보이면 프롬프트 품질과 보증 가능성이 과장될 수 있습니다.
enterprise.pqa.runtimeEvidence.signal.roleScopeProvisional.next=운영 승격 전에 IAM 역할, 권한, 위임 증거가 정확히 캡처되는지 확인하십시오.
enterprise.pqa.runtimeEvidence.signal.unknownOrInsufficient=불확실성 예약어가 포함됨
enterprise.pqa.runtimeEvidence.signal.unknownOrInsufficient.rule=프롬프트에 불확실성 예약어인 UNKNOWN 또는 INSUFFICIENT 값이 있으면 감지합니다.
enterprise.pqa.runtimeEvidence.signal.unknownOrInsufficient.evidence=발견 근거: UNKNOWN 또는 INSUFFICIENT 마커
enterprise.pqa.runtimeEvidence.signal.unknownOrInsufficient.explanation=프롬프트의 한 영역 이상이 알 수 없거나 근거가 충분하지 않다고 표시한 상태입니다.
enterprise.pqa.runtimeEvidence.signal.unknownOrInsufficient.impact=공식 검사는 어떤 필드가 UNKNOWN 또는 INSUFFICIENT인지 분해하고, 허용 가능한 공백인지 결함인지 확정해야 합니다.
enterprise.pqa.runtimeEvidence.signal.unknownOrInsufficient.next=실제 프롬프트, 봉인 증거, 공식 지표 결과를 비교하여 어떤 소스 보강이 필요한지 결정하십시오.
