enterprise.pqa.common.glossary.evidence.label=Evidence
enterprise.pqa.common.glossary.evidence.help=Request, prompt and ledger records used as the basis for official inspection and audit reports.
enterprise.pqa.common.glossary.sealed.label=Sealed
enterprise.pqa.common.glossary.sealed.help=State where stored evidence can be verified by hash and ledger records as not changed arbitrarily afterwards.
enterprise.pqa.common.glossary.context.label=Judgement evidence
enterprise.pqa.common.glossary.context.help=Combined information capturing the current request and prior learning signals.
enterprise.pqa.common.glossary.prompt.label=Final prompt
enterprise.pqa.common.glossary.prompt.help=Input text structured so the LLM can read and reason over the judgement evidence.
enterprise.pqa.common.glossary.baseline.label=Baseline
enterprise.pqa.common.glossary.baseline.help=Accumulated observation standard used to compare normal user or organization work patterns.
enterprise.pqa.common.glossary.contextProducer.label=Context producer
enterprise.pqa.common.glossary.contextProducer.help=System component that creates request or learning context values and provides them to the prompt.
enterprise.pqa.common.glossary.recipe.label=Authoring rules
enterprise.pqa.common.glossary.recipe.help=Order, criteria and precautions that must not be missed when building the final prompt.
enterprise.pqa.common.glossary.certificate.label=Quality certificate
enterprise.pqa.common.glossary.certificate.help=Proof that the judgement evidence and final prompt for the resource passed the official inspection. It does not guarantee that the LLM is always correct.
enterprise.pqa.common.glossary.operationalPromotion.label=Operational promotion
enterprise.pqa.common.glossary.operationalPromotion.help=Procedure that enables a certified resource to be used for LLM-based Zero Trust decisions.
enterprise.pqa.common.glossary.reverify.label=Reverification
enterprise.pqa.common.glossary.reverify.help=Procedure that rechecks the same official criteria with new request evidence after a problem is fixed.
enterprise.pqa.common.glossary.blocked.label=Blocked
enterprise.pqa.common.glossary.blocked.help=State where certificate issuance or operational promotion must not proceed because a blocking issue was found.
enterprise.pqa.common.glossary.reviewRequired.label=Review required
enterprise.pqa.common.glossary.reviewRequired.help=State that is not immediately blocked but requires an operator to confirm evidence and required action.
enterprise.pqa.common.glossary.regression.label=Regression inspection
enterprise.pqa.common.glossary.regression.help=Inspection confirming that existing behaviour or judgement quality did not degrade after improvements.
enterprise.pqa.common.glossary.zeroTrust.label=Zero-Trust permit
enterprise.pqa.common.glossary.zeroTrust.help=Operational state permitting only certified resources to be used for LLM-based security decisions.
enterprise.pqa.common.glossary.resource.label=Inspection target
enterprise.pqa.common.glossary.resource.help=URL or feature declared by the customer as a protected target. Each target must obtain its own certificate.
enterprise.pqa.common.glossary.metric.label=Inspection metric
enterprise.pqa.common.glossary.metric.help=Official inspection item verifying that the final prompt and judgement evidence are suitable for LLM decisions.
enterprise.pqa.common.glossary.modelProfile.label=Model profile
enterprise.pqa.common.glossary.modelProfile.help=Bundle of settings covering the LLM, response speed and input length used for inspection and operations.
enterprise.pqa.common.glossary.promptHash.label=Prompt fingerprint
enterprise.pqa.common.glossary.promptHash.help=Short identifier used to detect whether the final prompt has changed.
enterprise.pqa.common.glossary.contextHash.label=Context fingerprint
enterprise.pqa.common.glossary.contextHash.help=Short identifier used to detect whether request and learning evidence has changed.
enterprise.pqa.common.glossary.unknown=No plain explanation has been registered for this term yet.
