enterprise.pqa.runtimeEvidence.signal.empty=No detected prompt context signals.
enterprise.pqa.runtimeEvidence.signal.category.MISSING_CONTEXT=Missing basis
enterprise.pqa.runtimeEvidence.signal.category.MISSING_CONTEXT.description=The prompt directly declares a missing fact, section, or context producer output.
enterprise.pqa.runtimeEvidence.signal.category.BASELINE_MISMATCH=Baseline mismatch
enterprise.pqa.runtimeEvidence.signal.category.BASELINE_MISMATCH.description=The current request does not match the observed personal baseline or direct comparable history. Inspect it separately from missing information.
enterprise.pqa.runtimeEvidence.signal.category.PROVISIONAL_EVIDENCE=Provisional evidence
enterprise.pqa.runtimeEvidence.signal.category.PROVISIONAL_EVIDENCE.description=The work profile, role scope, or permission basis is not yet final.
enterprise.pqa.runtimeEvidence.signal.category.UNCERTAINTY_MARKER=Uncertainty marker
enterprise.pqa.runtimeEvidence.signal.category.UNCERTAINTY_MARKER.description=Reserved values such as UNKNOWN or INSUFFICIENT remain in the prompt. Official inspection must split them by field.
enterprise.pqa.runtimeEvidence.signal.category.OTHER=Other signal
enterprise.pqa.runtimeEvidence.signal.category.OTHER.description=A prompt context signal that is not yet mapped to a structured category.
enterprise.pqa.runtimeEvidence.signal.explicitMissingKnowledge=Explicit context gap section is present.
enterprise.pqa.runtimeEvidence.signal.explicitMissingKnowledge.rule=The user prompt contains the section marker === EXPLICIT MISSING KNOWLEDGE.
enterprise.pqa.runtimeEvidence.signal.explicitMissingKnowledge.evidence=Matched marker: === EXPLICIT MISSING KNOWLEDGE
enterprise.pqa.runtimeEvidence.signal.explicitMissingKnowledge.explanation=Prompt assembly directly declares that some required context is missing.
enterprise.pqa.runtimeEvidence.signal.explicitMissingKnowledge.impact=Official inspection must separate acceptable learning-state uncertainty from a prompt defect or missing context producer output.
enterprise.pqa.runtimeEvidence.signal.explicitMissingKnowledge.next=Confirm which context producer omitted the facts, then reinforce the request context or learning context source.
enterprise.pqa.runtimeEvidence.signal.missingCriticalFacts=Critical context facts are declared missing.
enterprise.pqa.runtimeEvidence.signal.missingCriticalFacts.rule=The prompt contains missingCriticalFacts and the value is not an empty list.
enterprise.pqa.runtimeEvidence.signal.missingCriticalFacts.evidence=Matched field: missingCriticalFacts is not empty
enterprise.pqa.runtimeEvidence.signal.missingCriticalFacts.explanation=The prompt names facts that are important for prompt quality but were not supplied.
enterprise.pqa.runtimeEvidence.signal.missingCriticalFacts.impact=The official inspection must identify whether the missing facts belong to request context, RAG, baseline, or authorization data.
enterprise.pqa.runtimeEvidence.signal.missingCriticalFacts.next=Use the prompt comparison and official metric detail to map each missing fact to its producer and remediation action.
enterprise.pqa.runtimeEvidence.signal.accessHourOutsideObserved=Access hour is outside the observed baseline.
enterprise.pqa.runtimeEvidence.signal.accessHourOutsideObserved.rule=The prompt contains currentAccessHourPresentInObservedHours: false.
enterprise.pqa.runtimeEvidence.signal.accessHourOutsideObserved.evidence=Matched field: currentAccessHourPresentInObservedHours=false
enterprise.pqa.runtimeEvidence.signal.accessHourOutsideObserved.explanation=The current request time does not match the user's observed normal access-hour baseline.
enterprise.pqa.runtimeEvidence.signal.accessHourOutsideObserved.impact=This is a baseline mismatch signal, not missing information. Official inspection must split immature baseline coverage from legitimate exception traffic.
enterprise.pqa.runtimeEvidence.signal.accessHourOutsideObserved.next=Check whether the baseline is incomplete, the user has a valid exception, or the request should require challenge.
enterprise.pqa.runtimeEvidence.signal.networkOutsideObserved=Network is outside the observed baseline.
enterprise.pqa.runtimeEvidence.signal.networkOutsideObserved.rule=The prompt contains currentNetworkPresentInObservedNetworks: false.
enterprise.pqa.runtimeEvidence.signal.networkOutsideObserved.evidence=Matched field: currentNetworkPresentInObservedNetworks=false
enterprise.pqa.runtimeEvidence.signal.networkOutsideObserved.explanation=The current request network does not match the user's observed network baseline.
enterprise.pqa.runtimeEvidence.signal.networkOutsideObserved.impact=This is a baseline mismatch, not a missing-fact conclusion. Official inspection must split weak collection, trusted-network classification, and legitimate exception cases.
enterprise.pqa.runtimeEvidence.signal.networkOutsideObserved.next=Confirm observed-network coverage, trusted network classification, and whether a legitimate exception should be recorded.
enterprise.pqa.runtimeEvidence.signal.browserOutsideObserved=Browser is outside the observed baseline.
enterprise.pqa.runtimeEvidence.signal.browserOutsideObserved.rule=The prompt contains currentBrowserPresentInObservedBrowsers: false.
enterprise.pqa.runtimeEvidence.signal.browserOutsideObserved.evidence=Matched field: currentBrowserPresentInObservedBrowsers=false
enterprise.pqa.runtimeEvidence.signal.browserOutsideObserved.explanation=The browser evidence does not match the user's observed browser baseline.
enterprise.pqa.runtimeEvidence.signal.browserOutsideObserved.impact=This indicates baseline drift or immature learning context. It is not shown as a standalone authorization defect.
enterprise.pqa.runtimeEvidence.signal.browserOutsideObserved.next=Check browser baseline collection, device fingerprint continuity, and whether the observed profile should be updated.
enterprise.pqa.runtimeEvidence.signal.noDirectPersonalComparable=No direct personal comparable request exists.
enterprise.pqa.runtimeEvidence.signal.noDirectPersonalComparable.rule=The prompt contains currentRequestCombinationEvidenceScope: NO_DIRECT_PERSONAL_COMPARABLE.
enterprise.pqa.runtimeEvidence.signal.noDirectPersonalComparable.evidence=Matched field: currentRequestCombinationEvidenceScope=NO_DIRECT_PERSONAL_COMPARABLE
enterprise.pqa.runtimeEvidence.signal.noDirectPersonalComparable.explanation=The exact request combination was not found in the user's personal comparable history.
enterprise.pqa.runtimeEvidence.signal.noDirectPersonalComparable.impact=The prompt can still be inspected, but the baseline cannot prove that this specific combination is normal.
enterprise.pqa.runtimeEvidence.signal.noDirectPersonalComparable.next=Confirm whether comparable-history collection is immature or whether this request requires a new approved baseline sample.
enterprise.pqa.runtimeEvidence.signal.workProfileProvisional=Work profile evidence is assembled provisionally.
enterprise.pqa.runtimeEvidence.signal.workProfileProvisional.rule=The prompt contains workProfileEvidenceState: PROVISIONAL.
enterprise.pqa.runtimeEvidence.signal.workProfileProvisional.evidence=Matched field: workProfileEvidenceState=PROVISIONAL
enterprise.pqa.runtimeEvidence.signal.workProfileProvisional.explanation=The personal work profile was assembled from a learning or not-yet-final baseline.
enterprise.pqa.runtimeEvidence.signal.workProfileProvisional.impact=Official inspection must separate acceptable learning-state uncertainty from a prompt quality defect.
enterprise.pqa.runtimeEvidence.signal.workProfileProvisional.next=Check baseline observation count, days covered, fallback ratio, and whether more learning samples are required.
enterprise.pqa.runtimeEvidence.signal.roleScopeProvisional=Role scope evidence is assembled provisionally.
enterprise.pqa.runtimeEvidence.signal.roleScopeProvisional.rule=The prompt contains roleScopeEvidenceState: PROVISIONAL.
enterprise.pqa.runtimeEvidence.signal.roleScopeProvisional.evidence=Matched field: roleScopeEvidenceState=PROVISIONAL
enterprise.pqa.runtimeEvidence.signal.roleScopeProvisional.explanation=Role and permission scope evidence was assembled with a temporary or not-yet-confirmed basis.
enterprise.pqa.runtimeEvidence.signal.roleScopeProvisional.impact=If provisional permission evidence looks final, prompt quality and assurance readiness can be overstated.
enterprise.pqa.runtimeEvidence.signal.roleScopeProvisional.next=Confirm IAM role, permission, and delegation evidence capture before promoting this resource.
enterprise.pqa.runtimeEvidence.signal.unknownOrInsufficient=Uncertainty marker is present.
enterprise.pqa.runtimeEvidence.signal.unknownOrInsufficient.rule=The prompt contains UNKNOWN or INSUFFICIENT as reserved uncertainty values.
enterprise.pqa.runtimeEvidence.signal.unknownOrInsufficient.evidence=Matched marker: UNKNOWN or INSUFFICIENT
enterprise.pqa.runtimeEvidence.signal.unknownOrInsufficient.explanation=At least one prompt section says the evidence is unknown or not enough.
enterprise.pqa.runtimeEvidence.signal.unknownOrInsufficient.impact=Official inspection must identify which field is UNKNOWN or INSUFFICIENT and decide whether the gap is acceptable or defective.
enterprise.pqa.runtimeEvidence.signal.unknownOrInsufficient.next=Compare the prompt, sealed evidence, and official metric result to determine whether the missing source must be fixed.
