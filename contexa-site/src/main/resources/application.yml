# ============================================================
# Contexa Site - AI-Native Zero Trust Security Platform
# ============================================================

server:
  port: 9080

contexa:
  enterprise:
    enabled: true
    benchmark:
      publication:
        report-root: ${CONTEXA_BENCHMARK_REPORT_ROOT:../spring-boot-starter-contexa-enterprise/build/reports/official-verification-fullstack-benchmark}
    mcp:
      oauth2:
        enabled: true
  saas:
    enabled: true
    prompt-context-audit:
      enabled: true
  llm:
    selection:
      chat:
        mode: dynamic-priority
        priority: ollama,openai,anthropic
      embedding:
        mode: dynamic-priority
        priority: ollama,openai
    chat:
      ollama:
        baseUrl: ${CONTEXA_CHAT_OLLAMA_BASE_URL:http://127.0.0.1:11434}
        model: ${CONTEXA_CHAT_OLLAMA_MODEL:qwen3:8b}
        keepAlive: ${CONTEXA_OLLAMA_CHAT_KEEP_ALIVE:30m}
    embedding:
      ollama:
        dedicatedRuntimeEnabled: ${CONTEXA_EMBEDDING_OLLAMA_DEDICATED_RUNTIME_ENABLED:false}
        baseUrl: ${CONTEXA_EMBEDDING_OLLAMA_BASE_URL:}
        model: ${CONTEXA_EMBEDDING_OLLAMA_MODEL:mxbai-embed-large}

hcad:
  enabled: true
  filterOrder: 100
  resource:
    sensitivePatterns:
      - "/admin/api/security-test/sensitive/**"
      - "/admin/api/security-test/critical/**"
      - "/api/security-test/sensitive/**"
      - "/api/security-test/critical/**"
  geoip:
    dbPath: data/GeoLite2-City.mmdb

spring:
  application:
    name: contexa-site
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  messages:
    basename: i18n/messages-site,i18n/messages-enterprise,i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contexa}
    username: ${DB_USERNAME:contexa}
    password: ${DB_PASSWORD:contexa1234!@#}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
  auth:
    token-transport-type: header_cookie
    oauth2-csrf: false
    token-persistence: localstorage
  ai:
    retry:
      max-attempts: 1
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:your-anthropic-api-key}
      chat:
        options:
          model: claude-3-sonnet-20240229
    openai:
      api-key: ${OPENAI_API_KEY:your-openai-api-key}
      base-url: https://api.openai.com
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3
    security:
      tiered:
        prompt-compression:
          enabled: false
        layer1:
          default-budget-profile: CORTEX_L1_STANDARD
          timeout:
            rag-ms: 4000
          vector-search-limit: 12
          prompt:
            max-rag-documents: 12
        layer2:
          default-budget-profile: CORTEX_L2_STANDARD
    vectorstore:
      pgvector:
        dimensions: 1024
        initialize-schema: true
        search-timeout-ms: 4000
        store-timeout-ms: 4000
  flyway:
    baseline-on-migrate: true
  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: false

logging:
  level:
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR
    org.hibernate.orm.connections.pooling: WARN
    org.springframework.aop.framework.CglibAopProxy: ERROR

security:
  plane:
    llm-executor:
      core-pool-size: 1
      max-pool-size: 1
      queue-capacity: 32

management:
  endpoints:
    web:
      exposure:
        include: health
