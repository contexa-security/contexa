# Platform
site.platform.eyebrow=Platform
site.platform.title=AI Native Zero Trust Platform
site.platform.lead=Authentication alone is not security. Contexa monitors every action after login, detects anomalies with AI, and responds autonomously. User requests are served instantly \u2014 Zero Trust enforcement runs asynchronously, with zero latency impact.
site.platform.tagline=NEVER TRUST \u00b7 ALWAYS VERIFY \u00b7 EVERY REQUEST
site.platform.source=Any Request
site.platform.source.auth=All authenticated
site.platform.engine.subtitle=Post-authentication behavioral analysis engine
site.platform.step1.title=Context Collection
site.platform.step1.desc=API patterns \u00b7 session flows \u00b7 behavioral velocity
site.platform.step2.title=AI Behavioral Analysis
site.platform.step2.desc=Baseline comparison \u00b7 anomaly detection \u00b7 threat scoring
site.platform.step3.title=Autonomous Response
site.platform.step3.desc=Real-time Zero Trust decision \u00b7 session control
site.platform.insight=Not rule-based. Contexa detects anomalies by comparing current behavior against each user's baseline pattern.
site.platform.bottom=CONTINUOUS MONITORING \u00b7 REAL-TIME ANALYSIS \u00b7 AUTONOMOUS RESPONSE

# Features
site.features.eyebrow=Features
site.features.title=How It Works
site.features.lead=A comprehensive security platform that unifies identity, authorization, and AI-driven threat analysis in a single Spring-native integration.
site.features.identity.title=Identity DSL
site.features.identity.desc=Declarative authentication via IdentityDslRegistry. A single fluent chain generates multiple SecurityFilterChain beans at runtime. Supports Form, REST, OTT, Passkey, MFA, and OAuth2.
site.features.authz.title=Dynamic Authorization
site.features.authz.desc=Full XACML engine (PAP/PDP/PEP/PIP/PRP) with database-driven policy evaluation. @Protectable adds AI-driven method-level security for high-risk operations.
site.features.ai.title=AI Security Engine
site.features.ai.desc=HCAD (Hybrid Cold/Hot-path Anomaly Detection) with a 5-layer pipeline. The Hot Path applies rule-based evaluation; the Cold Path escalates to 2-Layer LLM analysis.
site.features.zt.title=Zero Trust
site.features.zt.desc=Continuous verification after authentication. The async AI pipeline analyzes every request in the background with zero latency impact.
site.features.shadow.title=Shadow Mode
site.features.shadow.desc=Safe 2-stage deployment. In SHADOW, the full AI pipeline runs but skips enforcement \u2014 observe and validate AI decisions before switching to ENFORCE.
site.features.rag.title=Streaming & RAG
site.features.rag.desc=Standard returns Mono; streaming returns Flux for real-time output. PgVector-backed RAG provides context-aware threat analysis.

# Use Cases
site.usecases.eyebrow=Use Cases
site.usecases.title=Where Contexa fits
site.usecases.lead=Contexa operates after authentication succeeds. It constrains human sessions, workload identities, and delegated agents during the exploit window.
site.usecases.human.title=Authenticated workforce sessions
site.usecases.human.desc=Continuously evaluate human requests after login and challenge, escalate, or block risky behavior without rebuilding the application.
site.usecases.workload.title=Service and workload identities
site.usecases.workload.desc=Apply runtime controls to service clients and workload tokens when upstream findings raise exposure or when behavior drifts from expected patterns.
site.usecases.agent.title=Delegated agent execution
site.usecases.agent.desc=Constrain MCP and A2A tool execution with permit, scope, lineage, and approval boundaries instead of trusting the agent by default.

