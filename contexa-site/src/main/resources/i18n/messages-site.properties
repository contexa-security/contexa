# Benchmark - Methodology Sections (used in Java service)
site.benchmark.methodology.section.safety-gates.title=Safety Gates First
site.benchmark.methodology.section.safety-gates.summary=CONTEXA benchmark treats permit, lineage, replay, and evidence integrity as mandatory gates before any aggregate score.
site.benchmark.methodology.section.safety-gates.p1=Unsafe action, broken lineage, or unverifiable replay fails the benchmark regardless of the average score.
site.benchmark.methodology.section.safety-gates.p2=Public reports expose both aggregate scores and gate failures.
site.benchmark.methodology.section.safety-gates.p3=The benchmark measures controllable action-plane quality rather than isolated model output.
site.benchmark.methodology.section.human-agent.title=Human and Agent Unified Semantics
site.benchmark.methodology.section.human-agent.summary=Human requests and delegated agent execution are evaluated under the same canonical security semantics.
site.benchmark.methodology.section.human-agent.p1=Human, service-client, and delegated-agent executions are assessed in one request-time control plane.
site.benchmark.methodology.section.human-agent.p2=Objective, scope, tool-chain, permit, approval, and protocol-boundary remain common evaluation axes.
site.benchmark.methodology.section.human-agent.p3=Public reports expose scenario families and scorecards without leaking private evidence.
site.benchmark.methodology.section.publication.title=Publication-safe Reporting
site.benchmark.methodology.section.publication.summary=Public benchmark artifacts are generated from sanitized publication bundles instead of internal raw evidence.
site.benchmark.methodology.section.publication.p1=Private evidence stays inside contexa-iam-enterprise for operator review.
site.benchmark.methodology.section.publication.p2=contexa-site reads only publication-approved public artifacts.
site.benchmark.methodology.section.publication.p3=HTML and PDF reports are generated from the same public summary and chart dataset.

