# Use Cases
site.usecases.eyebrow=활용 사례
site.usecases.title=CONTEXA가 필요한 운영 지점
site.usecases.lead=CONTEXA는 인증이 끝난 뒤에 동작합니다. 익스플로잇 윈도우 동안 사람 세션, 워크로드 아이덴티티, 위임된 에이전트를 제어합니다.
site.usecases.human.title=인증된 사용자 세션
site.usecases.human.desc=로그인 이후의 요청을 계속 평가하고, 위험 행동에 대해 챌린지, 에스컬레이션, 차단을 적용합니다.
site.usecases.workload.title=서비스 및 워크로드 아이덴티티
site.usecases.workload.desc=상류 보안 신호가 노출 위험을 알리거나 실행 행위가 기준선에서 벗어나면 서비스 클라이언트와 워크로드 토큰에 런타임 제어를 적용합니다.
site.usecases.agent.title=위임된 에이전트 실행
site.usecases.agent.desc=MCP와 A2A 도구 실행을 기본 신뢰하지 않고 permit, 범위, 계보, 승인 경계로 제어합니다.

# Company
site.company.eyebrow=회사
site.company.title=검증 가능한 런타임 제어 플랫폼으로 설계되었습니다
site.company.lead=Contexa는 오픈소스 엔진 코어와 검증, 벤치마크, 공개 보고 체계를 결합해 런타임 보안 주장을 증빙 가능한 형태로 만듭니다.
site.company.open.title=오픈소스 엔진 코어
site.company.open.desc=코어 엔진은 공개되어 있으며, 정적 IAM 관리가 아니라 인증 이후 런타임 제어를 위해 설계되었습니다.
site.company.benchmark.title=공개 증빙 표면
site.company.benchmark.desc=공개 벤치마크 보고서, 방법론, 아티팩트는 외부 독자가 플랫폼을 검토할 수 있게 만듭니다.
site.company.contact.title=직접 연락
site.company.contact.desc=우선 문서, 벤치마크 보고서, 보안 연락 채널을 사용하십시오. 제품 및 연구 논의도 같은 공개 근거 위에서 이어집니다.

