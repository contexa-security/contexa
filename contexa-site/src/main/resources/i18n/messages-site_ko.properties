site.features.authz.title=\uB3D9\uC801 \uC778\uAC00
site.features.authz.desc=\uB370\uC774\uD130\uBCA0\uC774\uC2A4 \uAE30\uBC18 \uC815\uCC45 \uD3C9\uAC00\uB97C \uAC16\uCD98 \uC644\uC804\uD55C XACML \uC5D4\uC9C4. @Protectable\uC740 \uACE0\uC704\uD5D8 \uC791\uC5C5\uC5D0 AI \uAE30\uBC18 \uBA54\uC11C\uB4DC \uC218\uC900 \uBCF4\uC548\uC744 \uCD94\uAC00\uD569\uB2C8\uB2E4.
site.features.ai.title=AI \uBCF4\uC548 \uC5D4\uC9C4
site.features.ai.desc=5\uB2E8\uACC4 \uD30C\uC774\uD504\uB77C\uC778\uC744 \uAC16\uCD98 HCAD. Hot Path\uB294 \uADDC\uCE59 \uAE30\uBC18 \uD3C9\uAC00\uB97C \uC801\uC6A9\uD558\uACE0, Cold Path\uB294 2\uACC4\uCE35 LLM \uBD84\uC11D\uC73C\uB85C \uC5D0\uC2A4\uCEEC\uB808\uC774\uC158\uD569\uB2C8\uB2E4.
site.features.zt.title=Zero Trust
site.features.zt.desc=\uC778\uC99D \uC774\uD6C4 \uC9C0\uC18D\uC801 \uAC80\uC99D. \uBE44\uB3D9\uAE30 AI \uD30C\uC774\uD504\uB77C\uC778\uC774 \uC9C0\uC5F0 \uC2DC\uAC04 \uC601\uD5A5 \uC5C6\uC774 \uBC31\uADF8\uB77C\uC6B4\uB4DC\uC5D0\uC11C \uBAA8\uB4E0 \uC694\uCCAD\uC744 \uBD84\uC11D\uD569\uB2C8\uB2E4.
site.features.shadow.title=Shadow Mode
site.features.shadow.desc=\uC548\uC804\uD55C 2\uB2E8\uACC4 \uBC30\uD3EC. SHADOW \uBAA8\uB4DC\uC5D0\uC11C\uB294 \uC804\uCCB4 AI \uD30C\uC774\uD504\uB77C\uC778\uC774 \uC2E4\uD589\uB418\uC9C0\uB9CC \uC801\uC6A9\uC744 \uAC74\uB108\uB701\uB2C8\uB2E4 \u2014 ENFORCE\uB85C \uC804\uD658 \uC804\uC5D0 AI \uACB0\uC815\uC744 \uAD00\uCC30\uD558\uACE0 \uAC80\uC99D\uD569\uB2C8\uB2E4.
site.features.rag.title=Streaming & RAG
site.features.rag.desc=\uD45C\uC900 \uBAA8\uB4DC\uB294 Mono\uB97C \uBC18\uD658\uD558\uACE0, \uC2A4\uD2B8\uB9AC\uBC0D \uBAA8\uB4DC\uB294 \uC2E4\uC2DC\uAC04 \uCD9C\uB825\uC744 \uC704\uD574 Flux\uB97C \uBC18\uD658\uD569\uB2C8\uB2E4. PgVector \uAE30\uBC18 RAG\uB294 \uCEE8\uD14D\uC2A4\uD2B8 \uC778\uC2DD \uC704\uD611 \uBD84\uC11D\uC744 \uC81C\uACF5\uD569\uB2C8\uB2E4.

