// ?쇱씠釉뚮윭由?JAR濡??꾪솚 (Library JAR conversion)
// Starter ?⑦꽩??遺?⑺븯?꾨줉 bootJar 鍮꾪솢?깊솕 (Disable bootJar for Starter pattern)
// ?낅┰ ?ㅽ뻾? examples 紐⑤뱢?먯꽌 ?쒓났 (Standalone execution provided by examples module)
bootJar.enabled = false
jar.enabled = true

tasks.named('resolveMainClassName') {
    enabled = false
}

dependencies {
    implementation project(':contexa-common')
    implementation project(':contexa-core')

    compileOnly 'org.springframework.boot:spring-boot-starter-security'
    compileOnly 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    compileOnly 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    compileOnly 'org.springframework.boot:spring-boot-starter-oauth2-client'
    compileOnly 'org.springframework.security:spring-security-oauth2-authorization-server:1.5.1'

    implementation 'com.webauthn4j:webauthn4j-core:0.29.7.RELEASE'
//    implementation 'org.springframework.security:spring-security-webauthn'

    implementation("org.redisson:redisson:3.48.0")
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    implementation 'com.esotericsoftware:kryo:5.5.0'
    implementation 'org.apache.commons:commons-lang3:3.17.0'

    implementation 'org.springframework.statemachine:spring-statemachine-kryo:4.0.0'
    implementation 'org.springframework.statemachine:spring-statemachine-data-redis:4.0.0'
    implementation 'org.springframework.statemachine:spring-statemachine-core:4.0.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    testImplementation 'org.springframework.security:spring-security-oauth2-authorization-server:1.5.1'
    testImplementation 'com.h2database:h2'
    testImplementation 'org.springframework.statemachine:spring-statemachine-test:4.0.0'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.awaitility:awaitility:4.2.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
